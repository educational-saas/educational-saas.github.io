   // ---- School identity ----

<script>
   // ==================================================================
   // Setup
   // ==================================================================
   const loadingOverlay = document.getElementById('loading-overlay');
   const appContainer = document.getElementById('appContainer');
   const accessDeniedEl = document.getElementById('accessDenied');

   const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

   // State
   let classesCache = [];      // [{name}]
   let examsCache = [];        // [{name, mm, components}] applicable to the chosen class
   let selectedClass = '';
   let selectedExams = [];     // array of exam names (one-or-more, merged)
   let digitalSignature = '';

   document.getElementById('school-name-display').textContent = SCHOOL_NAME;

   function showLoading() { loadingOverlay.classList.remove('hidden'); }
   function hideLoading() { loadingOverlay.classList.add('hidden'); }

   function showAccessDenied(message) {
      appContainer.classList.add('hidden');
      accessDeniedEl.textContent = message;
      accessDeniedEl.classList.remove('hidden');
      hideLoading();
   }

   // Natural sort so "Grade 2" sorts before "Grade 10"
   function naturalCompare(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
   }

   function escapeHtml(str) {
      return String(str)
         .replace(/&/g, '&amp;')
         .replace(/</g, '&lt;')
         .replace(/>/g, '&gt;')
         .replace(/"/g, '&quot;');
   }

   // ==================================================================
   // Rank calculation (same tie-handling logic as the old statement)
   // ==================================================================
   function calculateRanks(values) {
      const indexedValues = values.map((value, index) => ({ value, index }));
      indexedValues.sort((a, b) => b.value - a.value);

      const ranks = new Array(values.length).fill(0);
      let currentRank = 1;

      for (let i = 0; i < indexedValues.length; i++) {
         if (i > 0 && indexedValues[i].value === indexedValues[i - 1].value) {
            ranks[indexedValues[i].index] = ranks[indexedValues[i - 1].index];
         } else {
            ranks[indexedValues[i].index] = currentRank;
         }
         if (i === indexedValues.length - 1 ||
             indexedValues[i].value !== indexedValues[i + 1].value) {
            currentRank++;
         }
      }
      return ranks;
   }

   // ==================================================================
   // Smart header-abbreviation engine
   //
   // Long component / exam / subject names can blow out the print layout
   // once several exams are merged side by side. Rather than a fixed
   // character limit, this measures actual rendered text width (canvas
   // measureText, matching the print font) against a per-column pixel
   // budget derived from how many columns the sheet will actually have,
   // and only shortens a label as far as it needs to in order to fit:
   //   1. full name, if it already fits
   //   2. a known academic short-form (Objective -> Obj., Theory -> Th.)
   //   3. word-by-word shortening for names not in the lookup table
   //   4. an initials acronym for multi-word names (Subject Enrichment
   //      Activity -> SEA)
   //   5. hard character truncation as a last resort
   // Collisions between sibling columns are disambiguated automatically.
   // ==================================================================
   const HEADER_FONT = 'bold 12px Arial';
   const PRINT_CONTENT_WIDTH_PX = 1080; // approx. A4 landscape content area
   const ROLL_NAME_RESERVED_FRACTION = 0.21; // matches the 6% + 15% print CSS

   const COMMON_ABBREVIATIONS = {
      'objective': 'Obj.',
      'subjective': 'Sub.',
      'theory': 'Th.',
      'practical': 'Prac.',
      'oral': 'Oral',
      'written': 'Wr.',
      'grammar': 'Gram.',
      'literature': 'Lit.',
      'listening': 'List.',
      'speaking': 'Spk.',
      'reading': 'Read.',
      'writing': 'Writ.',
      'project': 'Proj.',
      'assignment': 'Assgn.',
      'activity': 'Act.',
      'activities': 'Act.',
      'enrichment': 'Enrich.',
      'comprehension': 'Comp.',
      'vocabulary': 'Vocab.',
      'internal': 'Int.',
      'external': 'Ext.',
      'assessment': 'Assess.',
      'examination': 'Exam',
      'periodic': 'PT',
      'formative': 'FA',
      'summative': 'SA',
      'dictation': 'Dict.',
      'recitation': 'Recit.',
      'drawing': 'Draw.',
      'computer': 'Comp.',
      'laboratory': 'Lab',
      'portfolio': 'Port.',
      'notebook': 'N.Bk',
      'homework': 'H.Wk',
      'classwork': 'C.Wk',
      'quiz': 'Quiz',
      'unit': 'Unit',
      'test': 'Test',
      'viva': 'Viva',
      'subject': 'Sub.',
      'enrichment activity': 'Enrich. Act.'
   };

   const STOPWORDS = new Set(['of', 'the', 'and', 'for', 'a', 'an', '&', 'to', 'in']);

   let _measureCanvas = null;
   function measureTextWidth(text, font) {
      if (!_measureCanvas) _measureCanvas = document.createElement('canvas');
      const ctx = _measureCanvas.getContext('2d');
      ctx.font = font;
      return ctx.measureText(text).width;
   }

   function wordAbbrev(word) {
      const lower = word.toLowerCase().replace(/[^a-z]/g, '');
      if (COMMON_ABBREVIATIONS[lower]) return COMMON_ABBREVIATIONS[lower];
      if (word.length <= 4) return word;
      return word.slice(0, 3) + '.';
   }

   function toAcronym(name) {
      const words = name.trim().split(/[\s\-\/]+/).filter(w => w && !STOPWORDS.has(w.toLowerCase()));
      if (words.length <= 1) return null;
      return words.map(w => w[0].toUpperCase()).join('');
   }

   // usedLabels: a Set scoped to the sibling group these headers belong to,
   // so two different full names never render as the same abbreviation
   // within the same header row block.
   function uniqueLabel(label, usedLabels) {
      if (!usedLabels.has(label)) {
         usedLabels.add(label);
         return label;
      }
      let attempt = label;
      let n = 2;
      while (usedLabels.has(attempt) && n < 10) {
         attempt = label + n;
         n++;
      }
      usedLabels.add(attempt);
      return attempt;
   }

   function deriveAbbreviation(fullName, budgetPx, usedLabels) {
      const name = (fullName || '').trim();
      if (!name) return { label: name, abbreviated: false };

      if (measureTextWidth(name, HEADER_FONT) <= budgetPx) {
         return { label: uniqueLabel(name, usedLabels), abbreviated: false };
      }

      const lowerFull = name.toLowerCase();
      if (COMMON_ABBREVIATIONS[lowerFull] &&
          measureTextWidth(COMMON_ABBREVIATIONS[lowerFull], HEADER_FONT) <= budgetPx) {
         return { label: uniqueLabel(COMMON_ABBREVIATIONS[lowerFull], usedLabels), abbreviated: true };
      }

      const words = name.split(/\s+/);
      let candidate = words.length === 1 ? wordAbbrev(words[0]) : words.map(wordAbbrev).join(' ');

      if (measureTextWidth(candidate, HEADER_FONT) <= budgetPx) {
         return { label: uniqueLabel(candidate, usedLabels), abbreviated: true };
      }

      const acronym = toAcronym(name);
      if (acronym && measureTextWidth(acronym, HEADER_FONT) <= budgetPx) {
         return { label: uniqueLabel(acronym, usedLabels), abbreviated: true };
      }

      // Last resort: hard-truncate whichever candidate is shortest so far.
      let base = acronym || candidate || name;
      if (measureTextWidth(base, HEADER_FONT) > budgetPx) {
         while (base.length > 1 && measureTextWidth(base + '.', HEADER_FONT) > budgetPx) {
            base = base.slice(0, -1);
         }
         base = base.length > 0 ? base + '.' : base;
      }
      return { label: uniqueLabel(base || name, usedLabels), abbreviated: true };
   }

   // Builds a <th> (or returns plain text) with the derived abbreviation,
   // keeping the full name available as a tooltip on screen.
   function applyAbbreviatedLabel(el, fullName, budgetPx, usedLabels) {
      const { label, abbreviated } = deriveAbbreviation(fullName, budgetPx, usedLabels);
      el.textContent = label;
      if (abbreviated) el.title = fullName;
      return label;
   }

   // ==================================================================
   // Auth / admin check
   // ==================================================================
   async function checkAdminAccess() {
      const { data: { session }, error: sessionError } = await sb.auth.getSession();

      if (sessionError || !session) {
         window.location.href = DASHBOARD_URL;
         return false;
      }

      try {
         const { data: role, error: roleError } = await sb.rpc('get_my_role');
         if (!roleError && role === 'admin') return true;
         if (!roleError) {
            showAccessDenied('This page is only available to admin accounts.');
            return false;
         }
      } catch (e) {
         // fall through to direct lookup
      }

      const { data: adminRow, error: adminError } = await sb
         .from('admins')
         .select('id')
         .eq('id', session.user.id)
         .maybeSingle();

      if (adminError || !adminRow) {
         showAccessDenied('This page is only available to admin accounts.');
         return false;
      }
      return true;
   }

   // ==================================================================
   // Data loading: classes & exams for the selection panel
   // ==================================================================
   async function loadClasses() {
      const { data, error } = await sb.from('classes').select('name');
      if (error) throw error;
      classesCache = (data || []).slice().sort((a, b) => naturalCompare(a.name, b.name));

      const classSelect = document.getElementById('classSelect');
      classSelect.innerHTML = '<option value="">-- Select Class --</option>' +
         classesCache.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
   }

   async function loadExamsForClass(className) {
      const listEl = document.getElementById('examCheckboxList');
      listEl.innerHTML = '<div class="placeholder">Loading exams&hellip;</div>';
      listEl.classList.add('disabled-look');
      document.getElementById('generateBtn').disabled = true;

      const { data: mapRows, error: mapError } = await sb
         .from('exam_classes')
         .select('exam')
         .eq('class', className);
      if (mapError) throw mapError;

      let examNames = (mapRows || []).map(r => r.exam);

      let examRows;
      if (examNames.length > 0) {
         const { data, error } = await sb
            .from('exams')
            .select('name, mm, components')
            .in('name', examNames)
            .order('added_at', { ascending: true });
         if (error) throw error;
         examRows = data;
      } else {
         // Graceful fallback: nothing mapped yet for this class -> offer
         // every registered exam rather than an empty list.
         const { data, error } = await sb
            .from('exams')
            .select('name, mm, components')
            .order('added_at', { ascending: true });
         if (error) throw error;
         examRows = data;
      }

      examsCache = examRows || [];
      listEl.classList.remove('disabled-look');

      if (examsCache.length === 0) {
         listEl.innerHTML = '<div class="placeholder">No exams available</div>';
         return;
      }

      listEl.innerHTML = examsCache.map((e, idx) => `
         <div class="exam-option">
            <input type="checkbox" id="examOpt_${idx}" value="${escapeHtml(e.name)}" class="exam-checkbox">
            <label for="examOpt_${idx}">${escapeHtml(e.name)}</label>
         </div>
      `).join('');

      listEl.querySelectorAll('.exam-checkbox').forEach(cb => {
         cb.addEventListener('change', () => {
            selectedExams = Array.from(listEl.querySelectorAll('.exam-checkbox:checked')).map(c => c.value);
            document.getElementById('generateBtn').disabled = !(selectedClass && selectedExams.length > 0);
         });
      });
   }

   // ==================================================================
   // Core report generation
   // ==================================================================
   function getExamComponents(examDef) {
      if (examDef && Array.isArray(examDef.components) && examDef.components.length > 0) {
         return examDef.components; // [{mm, name}, ...]
      }
      return null; // single-column exam
   }

   function formatMark(num) {
      if (num === null || num === undefined || isNaN(num)) return '-';
      const n = Number(num);
      return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
   }

   function statusLabel(status) {
      switch (status) {
         case 'AB': return 'Ab';
         case 'L': return 'L';
         case 'ML': return 'ML';
         default: return status || '-';
      }
   }

   async function generateReport(className, examNames) {
      showLoading();
      document.getElementById('selectionError').textContent = '';

      try {
         const examDefs = examNames
            .map(name => examsCache.find(e => e.name === name))
            .filter(Boolean);
         if (examDefs.length === 0) throw new Error('Selected exam(s) could not be found.');

         // Subjects that apply to this class (ordered by display_order)
         const { data: subjRows, error: subjError } = await sb
            .from('class_subjects')
            .select('subject, subjects(display_order)')
            .eq('class', className);
         if (subjError) throw subjError;

         const selectedSubjects = (subjRows || [])
            .slice()
            .sort((a, b) => {
               const oa = a.subjects ? a.subjects.display_order : 0;
               const ob = b.subjects ? b.subjects.display_order : 0;
               return oa - ob;
            })
            .map(r => r.subject);

         if (selectedSubjects.length === 0) {
            throw new Error('No subjects are mapped to this class yet.');
         }

         // Students in this class, ordered by roll number (falling back to sr_no)
         const { data: students, error: studError } = await sb
            .from('students_master')
            .select('id, name, roll_no, sr_no')
            .eq('class', className)
            .order('roll_no', { ascending: true, nullsFirst: false })
            .order('sr_no', { ascending: true, nullsFirst: false });
         if (studError) throw studError;

         if (!students || students.length === 0) {
            throw new Error('No students found for this class.');
         }

         // Marks for this class across all merged (standard, registered)
         // exams -- custom/one-off exams stay excluded, same as before.
         const { data: marksRows, error: marksError } = await sb
            .from('marks')
            .select('id, student_id, subject, exam_name, status, marks_obtained, component_marks, updated_at')
            .eq('class', className)
            .in('exam_name', examDefs.map(e => e.name));
         if (marksError) throw marksError;

         digitalSignature = await generateNumericSignature(marksRows || []);

         renderTable({
            className, examDefs,
            selectedSubjects, students, marksRows: marksRows || []
         });

         const examHeading = examDefs.map(e => e.name).join(' + ');
         document.getElementById('exam-name').textContent = examHeading;
         document.getElementById('session-label').textContent = SCHOOL_SESSION;
         document.getElementById('class-name').textContent = className;
         document.getElementById('timestamp-info').textContent =
            'Generated on ' + getFormattedDateTime() + ' | Digital Signature: ' + digitalSignature;

         document.getElementById('selectionPanel').classList.add('hidden');
         document.getElementById('changeSelectionWrap').classList.remove('hidden');
         document.getElementById('reportHeader').classList.remove('hidden');
         document.getElementById('marks-table').classList.remove('hidden');
         document.getElementById('printBtn').classList.remove('hidden');

         updateUrlParams(className, examDefs.map(e => e.name));
      } catch (err) {
         console.error(err);
         document.getElementById('selectionError').textContent =
            err && err.message ? err.message : 'Failed to generate the statement.';
      } finally {
         hideLoading();
      }
   }

   function renderTable({ className, examDefs, selectedSubjects, students, marksRows }) {
      const table = document.getElementById('marks-table');
      table.innerHTML = '';

      const multiExam = examDefs.length > 1;
      const headerRowCount = multiExam ? 3 : 2;

      // Pre-compute the column structure (needed up front so we can size the
      // abbreviation budget before building any header cell).
      let totalMarkColumns = 0;
      const subjectBlocks = selectedSubjects.map(subject => {
         const examBlocks = examDefs.map(examDef => {
            const comps = getExamComponents(examDef);
            const colCount = comps ? comps.length + 1 : 1;
            totalMarkColumns += colCount;
            return { examDef, comps, colCount };
         });
         const subjectColSpan = examBlocks.reduce((s, b) => s + b.colCount, 0);
         return { subject, examBlocks, subjectColSpan };
      });

      const totalDataColumns = totalMarkColumns + 3; // Total + % + Rank
      const dataAreaPx = PRINT_CONTENT_WIDTH_PX * (1 - ROLL_NAME_RESERVED_FRACTION);
      const perColumnBudgetPx = Math.min(140, Math.max(26, dataAreaPx / totalDataColumns));

      const headerRowTop = document.createElement('tr');
      const headerRowMid = document.createElement('tr');   // exam names (multi-exam only)
      const headerRowBottom = document.createElement('tr'); // components

      const rollHeader = document.createElement('th');
      rollHeader.textContent = 'Roll No.';
      rollHeader.rowSpan = headerRowCount;
      rollHeader.classList.add('roll-col');
      headerRowTop.appendChild(rollHeader);

      const nameHeader = document.createElement('th');
      nameHeader.textContent = 'Student Name';
      nameHeader.rowSpan = headerRowCount;
      nameHeader.classList.add('name-col');
      headerRowTop.appendChild(nameHeader);

      const subjectLabelUsed = new Set();

      subjectBlocks.forEach(({ subject, examBlocks, subjectColSpan }) => {
         const subjectHeader = document.createElement('th');
         subjectHeader.colSpan = subjectColSpan;
         subjectHeader.classList.add('subject-header');
         applyAbbreviatedLabel(subjectHeader, subject, perColumnBudgetPx * subjectColSpan * 0.95, subjectLabelUsed);
         headerRowTop.appendChild(subjectHeader);

         const examLabelUsed = new Set(); // scoped per subject block

         examBlocks.forEach(({ examDef, comps, colCount }) => {
            if (multiExam) {
               const examTh = document.createElement('th');
               examTh.colSpan = colCount;
               examTh.classList.add('exam-header');
               applyAbbreviatedLabel(examTh, examDef.name, perColumnBudgetPx * colCount * 0.95, examLabelUsed);
               headerRowMid.appendChild(examTh);
            }

            const compLabelUsed = new Set(); // scoped per subject+exam block

            if (comps) {
               comps.forEach(comp => {
                  const th = document.createElement('th');
                  th.classList.add('mark-col');
                  const label = applyAbbreviatedLabel(th, comp.name, perColumnBudgetPx, compLabelUsed);
                  th.innerHTML = escapeHtml(label) + '<hr>' + comp.mm + 'M';
                  if (label !== comp.name) th.title = comp.name;
                  headerRowBottom.appendChild(th);
               });
               const totalTh = document.createElement('th');
               totalTh.innerHTML = 'Total<hr>' + examDef.mm + 'M';
               totalTh.classList.add('mark-col');
               headerRowBottom.appendChild(totalTh);
            } else {
               const th = document.createElement('th');
               th.innerHTML = examDef.mm + 'M';
               th.classList.add('mark-col');
               headerRowBottom.appendChild(th);
            }
         });
      });

      // Grand Total / Percentage / Rank headers
      const totalHeader = document.createElement('th');
      totalHeader.textContent = 'Total';
      totalHeader.rowSpan = headerRowCount;
      headerRowTop.appendChild(totalHeader);

      const percentHeader = document.createElement('th');
      percentHeader.textContent = '%';
      percentHeader.rowSpan = headerRowCount;
      headerRowTop.appendChild(percentHeader);

      const rankHeader = document.createElement('th');
      rankHeader.textContent = 'Rank';
      rankHeader.rowSpan = headerRowCount;
      headerRowTop.appendChild(rankHeader);

      table.appendChild(headerRowTop);
      if (multiExam) table.appendChild(headerRowMid);
      table.appendChild(headerRowBottom);

      const aggregateTotalMax = selectedSubjects.length * examDefs.reduce((s, e) => s + Number(e.mm || 0), 0);

      const studentTotals = [];
      const studentRows = [];

      students.forEach((student, idx) => {
         const row = document.createElement('tr');

         const serialNum = (idx + 1).toString().padStart(2, '0');
         const rollNo = student.roll_no != null ? student.roll_no
                       : (student.sr_no != null ? student.sr_no : serialNum);

         const rollCell = document.createElement('td');
         rollCell.textContent = rollNo;
         row.appendChild(rollCell);

         const nameCell = document.createElement('td');
         nameCell.textContent = (student.name || '').toUpperCase();
         nameCell.style.textAlign = 'left';
         row.appendChild(nameCell);

         let grandTotal = 0;

         subjectBlocks.forEach(({ subject, examBlocks }) => {
            examBlocks.forEach(({ examDef, comps, colCount }) => {
               const markRow = marksRows.find(m =>
                  m.student_id === student.id && m.subject === subject && m.exam_name === examDef.name);

               if (!markRow) {
                  const cell = document.createElement('td');
                  cell.textContent = '-';
                  cell.colSpan = colCount;
                  cell.classList.add('mark-cell');
                  cell.dataset.name = student.name;
                  cell.dataset.subject = subject;
                  cell.dataset.exam = examDef.name;
                  row.appendChild(cell);
                  return;
               }

               if (markRow.status !== 'P') {
                  const cell = document.createElement('td');
                  cell.textContent = statusLabel(markRow.status);
                  cell.colSpan = colCount;
                  cell.classList.add('mark-cell', 'status-cell');
                  cell.style.fontWeight = 'bold';
                  cell.dataset.name = student.name;
                  cell.dataset.subject = subject;
                  cell.dataset.exam = examDef.name;
                  row.appendChild(cell);
                  return;
               }

               if (comps) {
                  comps.forEach(comp => {
                     const cell = document.createElement('td');
                     cell.classList.add('mark-cell');
                     cell.dataset.name = student.name;
                     cell.dataset.subject = subject;
                     cell.dataset.exam = examDef.name;
                     const compVal = markRow.component_marks ? markRow.component_marks[comp.name] : undefined;
                     cell.textContent = (compVal === undefined || compVal === null) ? '-' : formatMark(compVal);
                     row.appendChild(cell);
                  });
               }

               const totalCell = document.createElement('td');
               totalCell.classList.add('mark-cell');
               totalCell.dataset.name = student.name;
               totalCell.dataset.subject = subject;
               totalCell.dataset.exam = examDef.name;
               totalCell.style.fontWeight = 'bold';

               const subjectExamTotal = markRow.marks_obtained !== null && markRow.marks_obtained !== undefined
                  ? Number(markRow.marks_obtained)
                  : (comps
                     ? comps.reduce((sum, comp) => {
                          const v = markRow.component_marks ? markRow.component_marks[comp.name] : null;
                          return sum + (v !== null && v !== undefined ? Number(v) : 0);
                       }, 0)
                     : 0);

               totalCell.textContent = formatMark(subjectExamTotal);
               row.appendChild(totalCell);

               grandTotal += subjectExamTotal;
            });
         });

         const grandTotalCell = document.createElement('td');
         grandTotalCell.textContent = formatMark(grandTotal);
         grandTotalCell.style.fontWeight = 'bold';
         row.appendChild(grandTotalCell);

         const percentCell = document.createElement('td');
         percentCell.textContent = aggregateTotalMax > 0
            ? ((grandTotal / aggregateTotalMax) * 100).toFixed(2)
            : '-';
         percentCell.style.fontWeight = 'bold';
         row.appendChild(percentCell);

         const rankCell = document.createElement('td');
         rankCell.classList.add('rank-cell');
         row.appendChild(rankCell);

         studentRows.push(row);
         studentTotals.push(grandTotal);
         table.appendChild(row);
      });

      const ranks = calculateRanks(studentTotals);
      studentRows.forEach((row, idx) => {
         const rankCell = row.querySelector('.rank-cell');
         rankCell.textContent = ranks[idx];
         if (ranks[idx] === 1 || ranks[idx] === 2 || ranks[idx] === 3) {
            rankCell.classList.add('highlight-rank');
         }
      });
   }

   // ==================================================================
   // Digital signature (tamper-evidence) -- a canonical, deterministic
   // string (now including exam_name, since marks from several merged
   // exams can share the same id-adjacent space) hashed with SHA-256 and
   // shrunk to a 12-digit number, so any change in the underlying marks
   // changes the signature.
   // ==================================================================
   async function generateNumericSignature(marksData) {
      const sorted = [...marksData].sort((a, b) => Number(a.id) - Number(b.id));

      const canonicalString = sorted
         .map(item => {
            const compPart = item.component_marks ? JSON.stringify(sortObjectKeys(item.component_marks)) : 'null';
            return `${item.id}:${item.exam_name}:${item.subject}:${item.status}:${item.marks_obtained}:${compPart}`;
         })
         .join('|');

      const msgBuffer = new TextEncoder().encode(canonicalString);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);

      const hashArray = Array.from(new Uint8Array(hashBuffer));
      let bigNum = 0n;
      for (const byte of hashArray) {
         bigNum = (bigNum << 8n) + BigInt(byte);
      }

      const signature = bigNum % 1000000000000n;
      return signature.toString().padStart(12, '0');
   }

   function sortObjectKeys(obj) {
      return Object.keys(obj).sort().reduce((acc, key) => {
         acc[key] = obj[key];
         return acc;
      }, {});
   }

   function getFormattedDateTime() {
      const now = new Date();
      const options = {
         month: 'short', day: 'numeric', year: 'numeric',
         hour: 'numeric', minute: '2-digit', hour12: true
      };
      return now.toLocaleString('en-US', options);
   }

   // ==================================================================
   // URL param helpers (kept for deep-linking parity with the old page)
   // ==================================================================
   function updateUrlParams(className, examNames) {
      const url = new URL(window.location.href);
      url.searchParams.set('class', className);
      url.searchParams.delete('exam');
      examNames.forEach(name => url.searchParams.append('exam', name));
      window.history.replaceState({}, '', url);
   }

   function resetToSelectionPanel() {
      document.getElementById('selectionPanel').classList.remove('hidden');
      document.getElementById('changeSelectionWrap').classList.add('hidden');
      document.getElementById('reportHeader').classList.add('hidden');
      document.getElementById('marks-table').classList.add('hidden');
      document.getElementById('printBtn').classList.add('hidden');
   }

   // ==================================================================
   // Wiring
   // ==================================================================
   document.getElementById('classSelect').addEventListener('change', async (e) => {
      selectedClass = e.target.value;
      selectedExams = [];
      document.getElementById('generateBtn').disabled = true;
      if (!selectedClass) {
         document.getElementById('examCheckboxList').innerHTML = '<div class="placeholder">Select a class first</div>';
         return;
      }
      try {
         await loadExamsForClass(selectedClass);
      } catch (err) {
         console.error(err);
         document.getElementById('selectionError').textContent = 'Failed to load exams for this class.';
      }
   });

   document.getElementById('generateBtn').addEventListener('click', () => {
      if (selectedClass && selectedExams.length > 0) {
         generateReport(selectedClass, selectedExams);
      }
   });

   document.getElementById('changeSelectionBtn').addEventListener('click', () => {
      resetToSelectionPanel();
   });

   // ==================================================================
   // Boot
   // ==================================================================
   window.addEventListener('load', async () => {
      showLoading();
      try {
         const allowed = await checkAdminAccess();
         if (!allowed) return;

         appContainer.classList.remove('hidden');
         await loadClasses();

         // Deep-link support: ?class=...&exam=...&exam=... (repeatable)
         const urlParams = new URLSearchParams(window.location.search);
         const classParam = urlParams.get('class');
         const examParams = urlParams.getAll('exam');

         if (classParam && classesCache.some(c => c.name === classParam)) {
            document.getElementById('classSelect').value = classParam;
            selectedClass = classParam;
            await loadExamsForClass(classParam);

            const validExamParams = examParams.filter(name => examsCache.some(ex => ex.name === name));
            if (validExamParams.length > 0) {
               document.querySelectorAll('.exam-checkbox').forEach(cb => {
                  if (validExamParams.includes(cb.value)) cb.checked = true;
               });
               selectedExams = validExamParams;
               document.getElementById('generateBtn').disabled = false;
               await generateReport(classParam, validExamParams);
               return;
            }
         }

         hideLoading();
      } catch (err) {
         console.error('Startup error:', err);
         showAccessDenied('Something went wrong while loading this page. Please refresh and try again.');
      }
   });
</script>
