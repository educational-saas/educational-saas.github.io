<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  /* Apply saved/preferred theme immediately to avoid a flash of the wrong theme */
  (function(){
    try{
      var saved = localStorage.getItem('gsms-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teacher Dashboard | My GSMS</title>
<meta name="description" content="Teacher dashboard for Gopal Sharma Memorial School. Access lesson plans, marks entry, attendance, and classroom tools.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="https://educational-saas.github.io/gsms-logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    color-scheme: light;

    /* ---------- Brand palette (light) ---------- */
    --teal-900:#0d3841;
    --teal-800:#124f59;
    --teal-700:#1b6b78;
    --teal-600:#227d8b;
    --teal-100:#e3eef0;
    --gold-600:#e2941a;
    --gold-500:#f5a623;
    --gold-400:#ffc65c;
    --gold-100:#fdf1dc;
    --cream:#faf8f3;
    --ink-900:#1c2626;
    --ink-500:#5f6f70;
    --white:#ffffff;

    --bg-tint-gold: rgba(245,166,35,.10);
    --bg-tint-teal: rgba(27,107,120,.10);
    --border-card: rgba(13,56,65,.08);
    --border-card-hover: rgba(245,166,35,.45);

    --toggle-bg: rgba(255,255,255,.75);
    --toggle-border: rgba(13,56,65,.14);
    --toggle-icon: var(--teal-700);
    --toggle-shadow: 0 10px 24px -12px rgba(13,56,65,.4);

    --header-bg: rgba(250,248,243,.85);
    --header-border: rgba(13,56,65,.08);

    --r-lg:26px;
    --r-md:18px;
    --r-sm:14px;
    --shadow-card:0 18px 40px -22px rgba(13,56,65,.35);
    --shadow-card-hover:0 24px 50px -18px rgba(13,56,65,.45);
    --ease:cubic-bezier(.22,1,.36,1);
  }

  html[data-theme="dark"]{
    color-scheme: dark;

    --teal-900:#092227;
    --teal-800:#8fe1ec;
    --teal-700:#5fd0de;
    --teal-600:#7fdbe6;
    --teal-100:#173338;
    --gold-600:#ffb648;
    --gold-500:#ffc65c;
    --gold-400:#ffd685;
    --gold-100:#2b2110;
    --cream:#0d1517;
    --ink-900:#eef3f2;
    --ink-500:#a4b6b7;
    --white:#182425;

    --bg-tint-gold: rgba(255,182,72,.07);
    --bg-tint-teal: rgba(95,208,222,.10);
    --border-card: rgba(255,255,255,.08);
    --border-card-hover: rgba(255,198,92,.4);

    --toggle-bg: rgba(24,36,37,.85);
    --toggle-border: rgba(255,255,255,.14);
    --toggle-icon: var(--gold-400);
    --toggle-shadow: 0 10px 24px -12px rgba(0,0,0,.6);

    --header-bg: rgba(9,34,39,.85);
    --header-border: rgba(255,255,255,.08);

    --shadow-card:0 18px 40px -22px rgba(0,0,0,.55);
    --shadow-card-hover:0 24px 50px -18px rgba(0,0,0,.65);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(1100px 700px at 82% -10%, var(--bg-tint-gold), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, var(--bg-tint-teal), transparent 60%),
      var(--cream);
    color:var(--ink-900);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    overflow-x:hidden;
    position:relative;
    transition:background-color .35s var(--ease), color .35s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }

  ::selection{background:var(--gold-400); color:var(--teal-900);}

  a{color:inherit;}

  /* ---------- Loading gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    background:var(--cream);
    transition:opacity .35s var(--ease), visibility .35s var(--ease);
  }
  #gate.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  .spinner{
    width:40px; height:40px; border-radius:50%;
    border:3px solid var(--border-card);
    border-top-color:var(--gold-500);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  #app{ display:none; min-height:100svh; flex-direction:column; }
  #app.ready{ display:flex; }

  /* ---------- App header ---------- */
  .app-header{
    position:sticky;
    top:0;
    z-index:40;
    background:var(--header-bg);
    border-bottom:1px solid var(--header-border);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
    transition:background-color .35s var(--ease), border-color .35s var(--ease);
  }
  .app-header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    max-width:960px;
    margin:0 auto 14px;
  }
  .header-brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .header-brand img{
    width:38px; height:38px;
    border-radius:10px;
    object-fit:cover;
    flex-shrink:0;
  }
  .header-text{ min-width:0; }
  .header-greeting{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.02rem;
    color:var(--ink-900);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:color .3s var(--ease);
  }
  .header-sub{
    margin:1px 0 0;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold-600);
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }

  .icon-btn{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--toggle-bg);
    border:1.5px solid var(--toggle-border);
    box-shadow:var(--toggle-shadow);
    cursor:pointer;
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    transition:background-color .3s var(--ease), border-color .3s var(--ease), transform .2s var(--ease);
    position:relative;
    flex-shrink:0;
  }
  .icon-btn:hover{ transform:translateY(-2px) scale(1.05); }
  .icon-btn:active{ transform:translateY(0) scale(.96); }
  .icon-btn:focus-visible{ outline:3px solid var(--gold-500); outline-offset:3px; }
  .icon-btn svg{
    width:19px; height:19px;
    fill:none; stroke:var(--toggle-icon); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    position:absolute;
    transition:opacity .3s var(--ease), transform .4s var(--ease);
  }
  .icon-sun{opacity:1; transform:rotate(0deg) scale(1);}
  .icon-moon{opacity:0; transform:rotate(-70deg) scale(.5);}
  html[data-theme="dark"] .icon-sun{opacity:0; transform:rotate(70deg) scale(.5);}
  html[data-theme="dark"] .icon-moon{opacity:1; transform:rotate(0deg) scale(1);}

  /* ---------- Search ---------- */
  .search-wrap{
    max-width:960px;
    margin:0 auto;
    position:relative;
  }
  .search-wrap svg{
    position:absolute;
    left:16px; top:50%; transform:translateY(-50%);
    width:18px; height:18px;
    stroke:var(--ink-500);
    fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    pointer-events:none;
    transition:stroke .3s var(--ease);
  }
  #search{
    width:100%;
    padding:13px 16px 13px 46px;
    border-radius:999px;
    border:1.5px solid var(--border-card);
    background:var(--white);
    color:var(--ink-900);
    font-family:'Manrope',sans-serif;
    font-size:.94rem;
    font-weight:500;
    outline:none;
    transition:border-color .25s var(--ease), box-shadow .25s var(--ease), background-color .3s var(--ease), color .3s var(--ease);
  }
  #search::placeholder{ color:var(--ink-500); font-weight:500; }
  #search:focus{
    border-color:var(--border-card-hover);
    box-shadow:0 0 0 4px var(--bg-tint-gold);
  }

  /* ---------- Main ---------- */
  main.dash{
    flex:1;
    width:100%;
    max-width:960px;
    margin:0 auto;
    padding:22px 18px calc(env(safe-area-inset-bottom) + 40px);
  }

  .section-label{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--teal-700);
    margin:0 4px 14px;
    transition:color .3s var(--ease);
  }

  .tile-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  @media (max-width:760px){
    .tile-grid{ grid-template-columns:repeat(3,1fr); gap:12px; }
  }

  .tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    text-align:center;
    text-decoration:none;
    color:inherit;
    background:var(--white);
    border:1px solid var(--border-card);
    border-radius:var(--r-md);
    padding:20px 10px 16px;
    box-shadow:var(--shadow-card);
    cursor:pointer;
    opacity:0;
    animation:rise .55s var(--ease) forwards;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease), background-color .3s var(--ease);
  }
  .tile:hover, .tile:focus-visible{
    transform:translateY(-4px);
    box-shadow:var(--shadow-card-hover);
    border-color:var(--border-card-hover);
  }
  .tile:active{ transform:translateY(-1px) scale(.98); }
  .tile:focus-visible{ outline:3px solid var(--gold-500); outline-offset:3px; }

  .tile-icon{
    width:56px; height:56px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg,var(--teal-100),var(--white));
    transition:background .3s var(--ease), transform .3s var(--ease);
    flex-shrink:0;
  }
  .tile:hover .tile-icon{
    background:linear-gradient(150deg,var(--gold-100),var(--white));
    transform:scale(1.06) rotate(-4deg);
  }
  .tile-icon svg{ width:32px; height:32px; display:block; overflow:visible; }

  .tile-name{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:.92rem;
    line-height:1.25;
    letter-spacing:-.01em;
    color:var(--ink-900);
    transition:color .3s var(--ease);
  }

  .empty-state{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:10px;
    padding:60px 20px;
    color:var(--ink-500);
  }
  .empty-state.show{ display:flex; }
  .empty-state svg{ width:40px; height:40px; stroke:var(--ink-500); fill:none; stroke-width:1.6; }
  .empty-state p{ margin:0; font-size:.92rem; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .tile{ animation:none; opacity:1; }
  }

  /* ---------- Mobile: full-width stacked tiles, icon left of name ---------- */
  @media (max-width:600px){
    .tile-grid{
      grid-template-columns: 1fr;
      gap:10px;
    }
    .tile{
      flex-direction:row;
      align-items:center;
      justify-content:flex-start;
      text-align:left;
      padding:12px 16px;
      gap:14px;
    }
    .tile-icon{
      width:46px; height:46px;
      border-radius:14px;
    }
    .tile-icon svg{ width:27px; height:27px; }
    .tile-name{ font-size:1rem; }
    .tile:hover .tile-icon{ transform:scale(1.04) rotate(-3deg); }
  }

  /* ---------- Sign-out sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; z-index:100;
    background:rgba(9,34,39,.4);
    opacity:0; visibility:hidden;
    transition:opacity .25s var(--ease), visibility .25s var(--ease);
  }
  .sheet-backdrop.show{ opacity:1; visibility:visible; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:101;
    background:var(--cream);
    border-radius:22px 22px 0 0;
    padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);
    max-width:960px; margin:0 auto;
    box-shadow:0 -20px 50px -20px rgba(0,0,0,.35);
    transform:translateY(100%);
    transition:transform .3s var(--ease);
  }
  .sheet-backdrop.show .sheet{ transform:translateY(0); }
  .sheet-handle{ width:38px; height:4px; border-radius:99px; background:var(--border-card); margin:0 auto 18px; }
  .sheet h3{ font-family:'Fraunces',serif; margin:0 0 6px; font-size:1.1rem; }
  .sheet p{ margin:0 0 20px; color:var(--ink-500); font-size:.88rem; }
  .sheet-actions{ display:flex; gap:10px; }
  .btn{
    flex:1;
    padding:13px 16px;
    border-radius:14px;
    border:none;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:.88rem;
    cursor:pointer;
    transition:transform .2s var(--ease), opacity .2s var(--ease);
  }
  .btn:active{ transform:scale(.97); }
  .btn-ghost{ background:var(--white); color:var(--ink-900); border:1.5px solid var(--border-card); }
  .btn-danger{ background:var(--gold-500); color:var(--teal-900); }
</style>
</head>
<body>

<!-- Loading / auth gate -->
<div id="gate"><div class="spinner" role="status" aria-label="Loading"></div></div>

<div id="app">

  <header class="app-header">
    <div class="app-header-top">
      <div class="header-brand">
        <img src="https://educational-saas.github.io/gsms-logo.png" alt="GSMS crest">
        <div class="header-text">
          <p class="header-greeting" id="greeting">Hello, Teacher</p>
          <p class="header-sub">Teacher Dashboard</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.4M12 19.1v2.4M4.5 4.5l1.7 1.7M17.8 17.8l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.5 19.5l1.7-1.7M17.8 6.2l1.7-1.7"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>
          </svg>
        </button>
        <button class="icon-btn" id="signout-btn" type="button" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="opacity:1; position:static;">
            <path d="M15 17l5-5-5-5M20 12H9M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Search tools…" autocomplete="off" aria-label="Search tools">
    </div>
  </header>

  <main class="dash">
    <p class="section-label">Your Tools</p>
    <div class="tile-grid" id="tile-grid"><!-- tiles injected by JS --></div>

    <div class="empty-state" id="empty-state">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <p>No tools match your search.</p>
    </div>
  </main>

</div>

<!-- Sign-out confirmation sheet -->
<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet" role="dialog" aria-label="Sign out confirmation">
    <div class="sheet-handle"></div>
    <h3>Sign out?</h3>
    <p>You'll need to sign in again to access your dashboard.</p>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancel-signout">Cancel</button>
      <button class="btn btn-danger" id="confirm-signout">Sign out</button>
    </div>
  </div>
</div>

<script>
  /* ---------------- Theme toggle ---------------- */
  var themeToggleBtn = document.getElementById('theme-toggle');
  themeToggleBtn.addEventListener('click', function(){
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('gsms-theme', next); }catch(e){}
  });

  /* ---------------- Tool tiles ---------------- */
  /* Each icon is a small, self-contained, full-color SVG (flat/duotone style) so it reads
     clearly on both the light and dark tile backgrounds. Colors are fixed (not theme tokens)
     on purpose — the whole point is a vivid, consistent mark regardless of theme. */
  var TOOLS = [
  // ==========================================
  // 1. ACADEMIC PLANNING & PREPARATION
  // ==========================================
  {
    name: 'Weekly Lesson Plan',
    href: 'https://educational-saas.github.io/teachers/weekly-lesson-plan/',

  },
  {
    name: 'Morning Assembly Planner',
    href: '#',
    icon: '<circle cx="12" cy="12" r="5.2" fill="#f5a623"/><g stroke="#e2941a" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.8v2.6M12 18.6v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2.8 12h2.6M18.6 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/></g><path d="M8.5 21h7" stroke="#1b6b78" stroke-width="2" stroke-linecap="round"/>'
  },
  {
    name: 'Syllabus Tracker',
    href: 'https://educational-saas.github.io/teachers/exam-syllabus',
    icon: '<path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="#f5a623"/><path d="M15 3v5h4" fill="#c97b0f"/><rect x="7.4" y="11.2" width="9" height="1.6" rx="0.8" fill="#fff6e6"/><rect x="7.4" y="14.6" width="6.4" height="1.6" rx="0.8" fill="#fff6e6"/><rect x="3.8" y="2" width="3.2" height="7" rx="1" fill="#ef4444"/>'
  },
  {
    name: 'Blueprint Tracker',
    href: 'https://educational-saas.github.io/teachers/exam-blueprint/',
    icon: '<rect x="3" y="3" width="18" height="18" rx="3" fill="#1b6b78"/><path d="M3 9h18M9 3v18" stroke="#5fd0de" stroke-width="1.4" opacity="0.7"/><rect x="12.3" y="12" width="6.5" height="6.5" rx="1.2" fill="#f5a623"/><path d="M14 15h3M14 17h2" stroke="#1b6b78" stroke-width="1.1" stroke-linecap="round"/>'
  },

  // ==========================================
  // 2. STUDENT RECORDS & CLASSROOM MANAGEMENT
  // ==========================================
  {
    name: 'Student Lists',
    href: 'https://educational-saas.github.io/teachers/student-list/',
    icon: '<circle cx="9" cy="8" r="3.2" fill="#4f8ff7"/><path d="M3.2 19c0-3.4 2.6-5.9 5.8-5.9s5.8 2.5 5.8 5.9Z" fill="#8fb8fb"/><circle cx="17" cy="8.5" r="2.4" fill="#f5a623"/><path d="M14.6 13.9c2.3.5 3.9 2.4 3.9 5.1h-3.6" fill="#ffd685"/>'
  },
  {
    name: 'Attendance',
    href: 'https://educational-saas.github.io/teachers/attendance/',
    icon: '<rect x="5" y="3.5" width="14" height="18" rx="2.4" fill="#1b6b78"/><rect x="8.5" y="2" width="7" height="3.4" rx="1.4" fill="#0d3841"/><rect x="7.3" y="9" width="9.4" height="1.6" rx="0.8" fill="#eaf4f4" opacity="0.8"/><rect x="7.3" y="12.3" width="9.4" height="1.6" rx="0.8" fill="#eaf4f4" opacity="0.8"/><circle cx="17" cy="17.3" r="4" fill="#10b981"/><path d="m15.3 17.3 1.2 1.2 2.2-2.4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'
  },
  {

  var grid = document.getElementById('tile-grid');
  var emptyState = document.getElementById('empty-state');

  function renderTiles(list){
    grid.innerHTML = '';
    list.forEach(function(tool, i){
      var a = document.createElement('a');
      a.className = 'tile';
      a.href = tool.href;
      a.style.animationDelay = (i * 0.04) + 's';
      a.setAttribute('aria-label', tool.name);
      a.innerHTML =
        '<span class="tile-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24">' + tool.icon + '</svg>' +
        '</span>' +
        '<span class="tile-name">' + tool.name + '</span>';
      grid.appendChild(a);
    });
    emptyState.classList.toggle('show', list.length === 0);
    grid.style.display = list.length === 0 ? 'none' : 'grid';
  }

  document.getElementById('search').addEventListener('input', function(e){
    var q = e.target.value.trim().toLowerCase();
    var filtered = TOOLS.filter(function(t){ return t.name.toLowerCase().indexOf(q) !== -1; });
    renderTiles(filtered);
  });

  /* ---------------- Sign-out sheet ---------------- */
  var sheetBackdrop = document.getElementById('sheet-backdrop');
  document.getElementById('signout-btn').addEventListener('click', function(){
    sheetBackdrop.classList.add('show');
  });
  document.getElementById('cancel-signout').addEventListener('click', function(){
    sheetBackdrop.classList.remove('show');
  });
  sheetBackdrop.addEventListener('click', function(e){
    if(e.target === sheetBackdrop){ sheetBackdrop.classList.remove('show'); }
  });
  document.getElementById('confirm-signout').addEventListener('click', function(){
    supabaseClient.auth.signOut().then(async function(){
      await wipeInstitutionData();
      window.location.href = 'https://educational-saas.github.io/';
    });
  });

  /* ---------------- Supabase auth gate ---------------- */

  var SUPABASE_URL, SUPABASE_ANON_KEY;
  (function(){
    var institutionId = localStorage.getItem('gsms_last_institution_id');
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem('cp_institution_' + institutionId)); } catch(e) {}

    if (!cached || !cached.data || !cached.data.supabase_url || !cached.data.supabase_anon_key) {
      window.location.href = '/teacher-signin.html'; // no credentials on record — back to login
      throw new Error('Redirecting to sign-in.');
    }
    SUPABASE_URL = cached.data.supabase_url;
    SUPABASE_ANON_KEY = cached.data.supabase_anon_key;
  })();

  async function wipeInstitutionData(){
    try{
      const { clearInstitutionCache } = await import('/commons/control-plane.js');
      clearInstitutionCache(); // wipes every cached cp_institution_* entry on this device
    }catch(e){ /* ignore — nothing to clean up if this fails */ }
    localStorage.removeItem('gsms_last_institution_id');
  }

  var AUTH_REDIRECT = 'https://educational-saas.github.io/';

  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showApp(teacherName){
    document.getElementById('greeting').textContent = 'Hello, ' + (teacherName || 'Teacher').split(' ')[0];
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.add('ready');
  }

  function redirectToAuth(){
    window.location.href = AUTH_REDIRECT;
  }

  (async function initAuth(){
    try{
      var sessionResult = await supabaseClient.auth.getSession();
      var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;

      if(!session || !session.user){
        redirectToAuth();
        return;
      }

      var userId = session.user.id;

      var teacherResult = await supabaseClient
        .from('teachers')
        .select('id, name, email')
        .eq('id', userId)
        .maybeSingle();

      if(teacherResult.error || !teacherResult.data){
          redirectToAuth();
          return;
      }

      var adminResult = await supabaseClient.rpc('is_admin');

      if(adminResult.error){
        console.error('Admin check failed:', adminResult.error);
        redirectToAuth();
        return;
      }

      renderTiles(TOOLS.filter(function(tool){
      return !tool.adminOnly || adminResult.data === true;
      }));

      document.querySelector('.header-sub').textContent = adminResult.data === true ? 'Admin Dashboard' : 'Teacher Dashboard';
      
      showApp(teacherResult.data.name);
    }catch(err){
      console.error('Auth check failed:', err);
      redirectToAuth();
    }
  })();
</script>
