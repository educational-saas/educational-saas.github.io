<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Code Quest — Learn to Code!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;

    /* ---------- Brand palette (light) — matches the parent portal ---------- */
    --teal-900:#0d3841;
    --teal-800:#124f59;
    --teal-700:#1b6b78;
    --teal-600:#227d8b;
    --teal-100:#e3eef0;
    --gold-600:#e2941a;
    --gold-500:#f5a623;
    --gold-400:#ffc65c;
    --gold-100:#fdf1dc;
    --cream:#faf8f3;
    --ink-900:#1c2626;
    --ink-500:#5f6f70;
    --white:#ffffff;

    --bg-tint-gold: rgba(245,166,35,.10);
    --bg-tint-teal: rgba(27,107,120,.10);
    --border-card: rgba(13,56,65,.08);

    /* ---------- Kid-friendly accents ---------- */
    --fun-red:#f2555a;
    --fun-orange:#ff9f45;
    --fun-yellow:#ffd85c;
    --fun-green:#4fc98a;
    --fun-blue:#4aa8e0;
    --fun-purple:#a679e0;
    --fun-pink:#ff8fc0;
    --char-line:#2a2a2a;

    /* ---------- Code Quest semantic tokens ---------- */
    --sky-top: var(--teal-600);
    --sky-bottom: var(--cream);
    --grass-a: var(--fun-green);
    --grass-b: #3fb87d;
    --sand: var(--gold-100);
    --panel: var(--white);
    --panel-edge: var(--gold-500);
    --ink: var(--ink-900);
    --ink-soft: var(--ink-500);
    --pink: var(--fun-pink);
    --pink-dark: #e8557a;
    --blue: var(--fun-blue);
    --blue-dark: var(--teal-700);
    --orange: var(--fun-orange);
    --orange-dark: var(--gold-600);
    --purple: var(--fun-purple);
    --purple-dark: #8a52c9;
    --green: var(--fun-green);
    --green-dark: #399c6c;
    --gold: var(--gold-500);
    --gold-dark: var(--gold-600);

    --panel-tint: var(--bg-tint-teal);
    --bubble-tint: var(--bg-tint-gold);
    --input-bg: color-mix(in srgb, var(--white) 97%, var(--ink-900) 3%);
    --input-border: color-mix(in srgb, var(--ink-900) 16%, transparent);
    --overlay-tint: color-mix(in srgb, var(--teal-900) 55%, transparent);
    --edge-shadow: rgba(13,56,65,.14);
    --edge-shadow-soft: rgba(13,56,65,.08);

    --r-lg:26px;
    --r-md:18px;
    --r-sm:14px;
    --ease:cubic-bezier(.22,1,.36,1);

    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Manrope',system-ui,sans-serif;

    font-family:var(--font-body);
  }

  html[data-theme="dark"]{
    color-scheme: dark;
    --teal-900:#092227; --teal-800:#8fe1ec; --teal-700:#5fd0de; --teal-600:#7fdbe6; --teal-100:#173338;
    --gold-600:#ffb648; --gold-500:#ffc65c; --gold-400:#ffd685; --gold-100:#2b2110;
    --cream:#0d1517; --ink-900:#eef3f2; --ink-500:#a4b6b7; --white:#182425;
    --bg-tint-gold: rgba(255,182,72,.08); --bg-tint-teal: rgba(95,208,222,.12);
    --border-card: rgba(255,255,255,.10); --char-line:#0d1517;
    --grass-a:#2f8f63; --grass-b:#276f4e; --green-dark:#2c8f60; --pink-dark:#c23b5f;
    --blue-dark:#5fd0de; --orange-dark:#ffb648; --purple-dark:#c79ae8;
    --input-bg: color-mix(in srgb, var(--white) 90%, black 10%);
    --input-border: color-mix(in srgb, var(--white) 22%, transparent);
    --edge-shadow: rgba(0,0,0,.5); --edge-shadow-soft: rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;max-width:100%;overflow-x:hidden;}
  body{
    min-height:100vh;
    width:100%;
    background:linear-gradient(180deg,var(--bg-tint-teal) 0%, var(--cream) 55%, var(--bg-tint-gold) 100%);
    color:var(--ink);
    position:relative;
    transition:background .3s var(--ease), color .3s var(--ease);
  }

  /* ---------- background decor ---------- */
  #bg-decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .sun{
    position:absolute; top:6%; right:8%; width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--gold-400), var(--gold) 60%, var(--gold-dark) 100%);
    box-shadow:0 0 60px 10px var(--bg-tint-gold);
    animation:sunPulse 5s ease-in-out infinite;
  }
  @keyframes sunPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  .cloud{position:absolute; opacity:0.9; animation:drift linear infinite;}
  .cloud svg{display:block;width:100%;height:100%;}
  @keyframes drift{from{transform:translateX(-140px);}to{transform:translateX(110vw);}}
  .hill{position:absolute;bottom:-4%;left:0;width:100%;height:14%;
    background:linear-gradient(180deg,var(--grass-a),var(--grass-b));
    border-radius:50% 50% 0 0/100% 100% 0 0;opacity:0.4;}

  /* ---------- screens ---------- */
  .screen{position:relative;z-index:1;min-height:100vh;display:none;flex-direction:column;align-items:center;}
  .screen.active{display:flex;}

  /* ---------- top bar (shared) ---------- */
  .top-bar{
    position:relative;z-index:2;width:100%;max-width:1180px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px 0;gap:12px;flex-wrap:wrap;
  }
  .theme-toggle{
    width:46px;height:46px;border-radius:50%; border:3px solid var(--panel-edge); background:var(--panel);
    font-size:1.2rem; cursor:pointer; box-shadow:0 4px 0 var(--edge-shadow-soft); transition:transform .12s;
    display:flex;align-items:center;justify-content:center;color:var(--ink);display:none;
  }
  .theme-toggle:active{transform:translateY(3px); box-shadow:0 1px 0 var(--edge-shadow-soft);}

  /* ---------- character select ---------- */
  #screen-select{padding:8px 16px 60px;text-align:center;width:100%;}
  .title{
    font-family:var(--font-display);
    font-size:clamp(2.2rem,6vw,3.4rem); font-weight:700; margin:22px 0 2px;
    color:var(--pink-dark); letter-spacing:0.3px;
  }
  .subtitle{font-size:clamp(1rem,2.6vw,1.3rem); color:var(--ink-soft); margin:0 0 30px; font-weight:600;}
  .char-grid{
    display:grid; grid-template-columns:repeat(4,minmax(150px,220px)); gap:22px; justify-content:center;
    max-width:1000px; margin:0 auto;
  }
  @media (max-width:820px){.char-grid{grid-template-columns:repeat(2,minmax(140px,1fr)); max-width:480px;}}
  .char-card{
    background:var(--panel); border:1px solid var(--border-card); border-radius:28px;
    padding:16px 12px 18px; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease;
    box-shadow:0 8px 0 var(--edge-shadow-soft), 0 14px 24px var(--edge-shadow-soft);
  }
  .char-card:hover{transform:translateY(-6px) scale(1.03); box-shadow:0 12px 0 var(--edge-shadow-soft), 0 18px 30px var(--edge-shadow);}
  .char-card:active{transform:translateY(-1px) scale(0.99);}
  .char-card svg{width:100%; height:auto; display:block;}
  .char-card h3{margin:6px 0 2px; font-family:var(--font-display); font-weight:700; font-size:1.3rem; color:var(--ink);}
  .char-card p{margin:0; font-size:0.85rem; color:var(--ink-soft); font-weight:600;}
  .idle-bounce{animation:idleBounce 2.6s ease-in-out infinite;}
  @keyframes idleBounce{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-6px) rotate(-2deg);}}

  /* ---------- game screen ---------- */
  #screen-game{width:100%; max-width:1180px; padding:14px 14px 40px; margin:0 auto;}
  .game-header{
    width:100%; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;
  }
  .icon-btn{
    width:46px;height:46px;border-radius:50%; border:3px solid var(--panel-edge); background:var(--panel);
    font-size:1.3rem; cursor:pointer; box-shadow:0 4px 0 var(--edge-shadow-soft); transition:transform .12s;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--edge-shadow-soft);}
  .level-dots{display:flex; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--border-card); border-radius:20px; padding:6px 14px; box-shadow:0 4px 0 var(--edge-shadow-soft);}
  .dot{width:16px;height:16px;border-radius:50%; background:var(--stone-locked, var(--teal-100)); border:2px solid var(--border-card); transition:all .3s;}
  .dot.done{background:var(--green); border-color:var(--green-dark); box-shadow:0 0 6px var(--bg-tint-gold);}
  .dot.current{background:var(--pink); border-color:var(--pink-dark); transform:scale(1.3);}

  .story-bubble{
    display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--border-card);
    border-radius:22px; padding:12px 18px; margin-bottom:14px; box-shadow:0 6px 0 var(--edge-shadow-soft);
    width:100%; max-width:100%;
  }
  .mascot-avatar{width:64px; height:64px; flex:none;}
  .mascot-avatar svg{width:100%;height:100%;}
  .speech{flex:1 1 0; min-width:0; font-size:clamp(0.95rem,2vw,1.15rem); font-weight:600; color:var(--ink); line-height:1.35;}
  .level-tag{display:inline-block; background:var(--pink); color:#fff; font-weight:700; font-size:0.75rem; padding:3px 10px; border-radius:12px; margin-right:8px; letter-spacing:0.4px;}

  /* Mobile-first: stacked column, full-width children, nothing to override later. */
  .game-main{display:flex; flex-direction:column; align-items:stretch; gap:18px; width:100%; max-width:100%;}
  .board-panel{width:100%; min-width:0; display:flex; flex-direction:column; gap:10px;}
  .board-wrap{
    background:linear-gradient(180deg,var(--bg-tint-teal),var(--cream)); border:1px solid var(--border-card); border-radius:24px;
    box-shadow:0 10px 0 var(--edge-shadow-soft), 0 16px 30px var(--edge-shadow-soft); padding:10px; position:relative;
    contain:layout; /* isolate board layout so sibling content changes never resize it */
  }
  .board{
    position:relative; width:100%; display:grid; border-radius:14px; overflow:hidden;
    box-shadow:inset 0 0 0 4px var(--panel);
    aspect-ratio:4/3; /* sensible default before JS sets the real level ratio, prevents any 0-height flash */
    min-height:200px;
  }
  .cell{position:relative; background:var(--grass-a);}
  .cell.alt{background:var(--grass-b);}
  .cell::after{content:'';position:absolute; inset:0; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 60%);}
  .cell.rock{background:var(--grass-a);}
  .cell .rock-icon{position:absolute; inset:8%; display:flex; align-items:center; justify-content:center; font-size:min(9vw,42px);
    filter:drop-shadow(0 3px 2px rgba(0,0,0,0.25));}
  .cell.goal .goal-icon{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:min(9vw,40px);
    animation:goalPulse 1.4s ease-in-out infinite;}
  @keyframes goalPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.18) rotate(8deg);}}
  .cell.start .start-icon{position:absolute; left:6%; top:6%; font-size:min(4.5vw,18px); opacity:0.6;}

  .char-sprite{position:absolute; display:flex; align-items:center; justify-content:center; transition:left .48s cubic-bezier(.4,1.4,.5,1), top .48s cubic-bezier(.4,1.4,.5,1); z-index:5;}
  .char-inner{width:78%; height:78%; position:relative;}
  .char-inner svg{width:100%; height:100%; display:block; filter:drop-shadow(0 4px 5px rgba(0,0,0,0.28));}
  .facing-arrow{position:absolute; top:-6px; right:-2px; font-size:16px; transition:transform .3s ease; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3)); z-index:6;}

  .hop{animation:hop .48s ease;}
  @keyframes hop{0%{transform:translateY(0) scale(1,1);}30%{transform:translateY(-18%) scale(0.95,1.08);}60%{transform:translateY(-4%) scale(1.03,0.97);}100%{transform:translateY(0) scale(1,1);}}
  .hop-big{animation:hopBig .55s ease;}
  @keyframes hopBig{0%{transform:translateY(0) rotate(0);}40%{transform:translateY(-42%) rotate(-8deg);}70%{transform:translateY(-10%) rotate(6deg);}100%{transform:translateY(0) rotate(0);}}
  .bump{animation:bump .5s ease;}
  @keyframes bump{0%,100%{transform:translateX(0);}20%{transform:translateX(-8%) rotate(-6deg);}40%{transform:translateX(6%) rotate(4deg);}60%{transform:translateX(-5%) rotate(-3deg);}80%{transform:translateX(3%) rotate(2deg);}}
  .celebrate{animation:celebrate 1s ease;}
  @keyframes celebrate{0%{transform:translateY(0) rotate(0);}25%{transform:translateY(-35%) rotate(-10deg);}50%{transform:translateY(-4%) rotate(8deg);}75%{transform:translateY(-24%) rotate(-6deg);}100%{transform:translateY(0) rotate(0);}}

  .sparkle{position:absolute; pointer-events:none; font-size:18px; animation:sparkleFloat .7s ease forwards; z-index:7;}
  @keyframes sparkleFloat{0%{opacity:1; transform:translateY(0) scale(0.6);}100%{opacity:0; transform:translateY(-40px) scale(1.3);}}

  .feedback-banner{min-height:34px; text-align:center; font-weight:700; font-size:1.05rem; color:var(--pink-dark); transition:opacity .3s;}

  .controls-panel{width:100%; min-width:0; display:flex; flex-direction:column; gap:14px;}
  .palette,.program{
    background:var(--panel); border:1px solid var(--border-card); border-radius:20px; padding:14px 14px 16px;
    box-shadow:0 6px 0 var(--edge-shadow-soft);
  }
  .palette h3,.program h3{margin:0 0 10px; font-family:var(--font-display); font-weight:700; font-size:1.05rem; color:var(--ink-soft); letter-spacing:0.3px;}
  .palette-blocks{display:flex; flex-wrap:wrap; gap:10px;}
  .block-btn{
    border:none; border-radius:16px; padding:12px 16px; font-family:var(--font-body); font-weight:700; font-size:0.95rem;
    color:#fff; cursor:pointer; display:flex; align-items:center; gap:8px; box-shadow:0 4px 0 rgba(0,0,0,0.18);
    transition:transform .12s;
  }
  .block-btn .ic{font-size:1.25rem;}
  .block-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.18);}
  .block-btn.forward{background:var(--blue); box-shadow:0 4px 0 var(--blue-dark);}
  .block-btn.turnLeft,.block-btn.turnRight{background:var(--orange); box-shadow:0 4px 0 var(--orange-dark);}
  .block-btn.jump{background:var(--purple); box-shadow:0 4px 0 var(--purple-dark);}
  .block-btn.repeat2,.block-btn.repeat3{background:var(--green); box-shadow:0 4px 0 var(--green-dark);}
  .block-btn:disabled{opacity:0.4; cursor:not-allowed; transform:none !important;}

  .loop-banner{margin-top:10px; background:var(--bg-tint-teal); border:2px dashed var(--green-dark); border-radius:14px; padding:8px 12px; font-size:0.85rem; font-weight:700; color:var(--green-dark); display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .loop-banner.hidden{display:none;}
  .loop-banner button{border:none; background:var(--green-dark); color:#fff; border-radius:10px; padding:5px 10px; font-weight:700; cursor:pointer; font-family:inherit;}

  .program-list{min-height:70px; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; padding:6px 2px;}
  .program-list:empty::before{content:'Tap blocks above to build your program! 🧩'; color:var(--ink-soft); opacity:.7; font-weight:600; font-size:0.9rem;}
  .chip{
    display:flex; align-items:center; gap:6px; border-radius:14px; padding:8px 10px 8px 12px; font-weight:700; font-size:0.85rem;
    color:#fff; position:relative; animation:popIn .28s cubic-bezier(.4,1.6,.5,1); box-shadow:0 3px 0 rgba(0,0,0,0.18);
  }
  @keyframes popIn{0%{transform:scale(0.3); opacity:0;}80%{transform:scale(1.08);}100%{transform:scale(1); opacity:1;}}
  .chip.forward{background:var(--blue);}
  .chip.turnLeft,.chip.turnRight{background:var(--orange);}
  .chip.jump{background:var(--purple);}
  .chip-remove{background:rgba(0,0,0,0.2); border:none; color:#fff; width:18px;height:18px; border-radius:50%; font-size:11px; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center;}
  .repeat-chip{background:var(--green); border-radius:16px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; box-shadow:0 3px 0 var(--green-dark); animation:popIn .28s cubic-bezier(.4,1.6,.5,1); min-width:150px;}
  .repeat-chip.active-loop{outline:3px solid #fff; outline-offset:2px;}
  .repeat-head{display:flex; align-items:center; justify-content:space-between; gap:6px; color:#fff; font-weight:800; font-size:0.85rem;}
  .repeat-head-actions{display:flex; gap:4px;}
  .repeat-head-actions button{border:none; border-radius:8px; padding:3px 7px; font-weight:700; font-size:0.72rem; cursor:pointer; font-family:inherit;}
  .btn-add-inside{background:#fff; color:var(--green-dark);}
  .btn-done-inside{background:#fff; color:var(--green-dark);}
  .repeat-children{display:flex; flex-wrap:wrap; gap:6px; background:rgba(255,255,255,0.22); border:2px dashed rgba(255,255,255,0.7); border-radius:10px; padding:6px; min-height:34px;}
  .repeat-children:empty::before{content:'empty — add blocks!'; color:rgba(255,255,255,0.85); font-size:0.72rem; font-weight:600;}

  .program-actions{display:flex; gap:10px; margin-top:12px;}
  .btn{flex:1; border:none; border-radius:16px; padding:13px 10px; font-family:var(--font-body); font-weight:800; font-size:1rem; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.18); transition:transform .12s;}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,0.18);}
  .btn-primary{background:var(--pink); color:#fff; box-shadow:0 5px 0 var(--pink-dark);}
  .btn-secondary{background:var(--input-bg); color:var(--ink-soft); box-shadow:0 5px 0 var(--border-card); border:1px solid var(--input-border);}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none !important;}

  /* ---------- responsive: two columns only once there's room; mobile stays a safe single column ---------- */
  .board{min-height:240px;}
  @media (max-width:480px){
    #screen-game{padding:10px 8px 32px;}
    .board{min-height:200px;}
  }
  @media (min-width:901px){
    .game-main{flex-direction:row; align-items:flex-start;}
    .board-panel{flex:1.15 1 0; width:auto;}
    .controls-panel{flex:1 1 0; width:auto; min-width:270px;}
    .board{min-height:0;}
  }

  /* ---------- modal (level complete) ---------- */
  .modal{position:fixed; inset:0; background:var(--overlay-tint); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal.hidden{display:none;}
  .modal-card{background:var(--panel); border:1px solid var(--border-card); border-top:5px solid var(--gold); border-radius:26px; padding:30px 26px; text-align:center; max-width:360px; box-shadow:0 20px 40px var(--edge-shadow); animation:popIn .3s cubic-bezier(.4,1.6,.5,1);}
  .modal-emoji{font-size:3.4rem; margin-bottom:6px; animation:idleBounce 1.2s ease-in-out infinite;}
  .modal-card h2{margin:4px 0; font-family:var(--font-display); font-weight:700; color:var(--pink-dark); font-size:1.6rem;}
  .modal-card p{color:var(--ink-soft); font-weight:600; margin:6px 0 18px;}

  /* ---------- win screen ---------- */
  #screen-win{justify-content:center; min-height:100vh; text-align:center; padding:20px;}
  .win-content{background:var(--panel); border:1px solid var(--border-card); border-top:6px solid var(--gold); border-radius:30px; padding:44px 32px; max-width:440px; box-shadow:0 20px 50px var(--edge-shadow);}
  .trophy{font-size:6rem; animation:trophyShine 1.6s ease-in-out infinite;}
  @keyframes trophyShine{0%,100%{transform:scale(1) rotate(-2deg); filter:drop-shadow(0 0 0px var(--gold));}50%{transform:scale(1.08) rotate(2deg); filter:drop-shadow(0 0 22px var(--gold));}}
  .win-content h1{font-family:var(--font-display); font-weight:700; color:var(--pink-dark); font-size:2.2rem; margin:8px 0;}
  .win-content p{color:var(--ink-soft); font-weight:600; font-size:1.05rem;}
  .stars-final{font-size:1.8rem; margin:14px 0; letter-spacing:4px;}

  .confetti-piece{position:fixed; top:0; left:0; border-radius:2px; pointer-events:none; z-index:999; animation:confettiFall ease-out forwards;}
  @keyframes confettiFall{to{transform:translate(var(--dx),calc(var(--dy) + 340px)) rotate(var(--rot)); opacity:0;}}

  .hidden{display:none !important;}

  @media (prefers-reduced-motion: reduce){
    .sun,.cloud,.idle-bounce,.mascot-avatar,.goal-icon,.dot.current,.trophy{animation:none !important;}
  }
</style>
</head>
<body>

<div id="bg-decor">
  <div class="sun"></div>
  <div class="hill"></div>
</div>

<div class="top-bar">
  <span></span>
  <button class="theme-toggle" id="btnTheme" title="Toggle light/dark theme">🌙</button>
</div>

<!-- ===================== CHARACTER SELECT ===================== -->
<div id="screen-select" class="screen active">
  <h1 class="title">🎮 Code Quest</h1>
  <p class="subtitle">Pick your hero and start your coding adventure!</p>
  <div class="char-grid" id="charGrid"></div>
</div>

<!-- ===================== GAME SCREEN ===================== -->
<div id="screen-game" class="screen">
  <div class="game-header">

<script>
/* ============================================================

/* ---------- theme (light/dark, mirrors the Rupee Game) ---------- */
(function initTheme(){
  var root = document.documentElement;
  var btn = document.getElementById('btnTheme');
  var stored = null;
  try{ stored = localStorage.getItem('codeQuestTheme'); }catch(e){}
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = stored || (prefersDark ? 'dark' : 'light');
  applyTheme(theme);
  function applyTheme(t){
    root.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('codeQuestTheme', next); }catch(e){}
  });
})();

const CHARACTERS = [
  {id:'robo',  name:'Robo',  tag:'the friendly robot', svg:svgRobo},
  {id:'foxy',  name:'Foxy',  tag:'the clever fox',      svg:svgFoxy},
  {id:'kitty', name:'Kitty', tag:'the playful cat',     svg:svgKitty},
  {id:'dino',  name:'Dino',  tag:'the brave lil dragon',svg:svgDino},
];

/* ---------- levels ---------- */
const LEVELS = [
  { id:1, title:'First Steps', rows:1, cols:4, start:{row:0,col:0}, startFacing:1,
    goal:{row:0,col:3}, obstacles:[], allowed:['forward'],
    story:"Let's help {name} reach the star! ⭐ Tap Move Forward a few times, then press Play!" },
  { id:2, title:'Turn the Corner', rows:2, cols:3, start:{row:0,col:0}, startFacing:1,
    goal:{row:1,col:2}, obstacles:[], allowed:['forward','turnLeft','turnRight'],
    story:"Nice! Now {name} needs to turn a corner. Move forward, turn, then move forward again!" },
  { id:3, title:'Jump the Rock', rows:1, cols:4, start:{row:0,col:0}, startFacing:1,
    goal:{row:0,col:3}, obstacles:[{row:0,col:2}], allowed:['forward','turnLeft','turnRight','jump'],
    story:"Uh-oh, a rock 🪨 blocks the path! Use the Jump block to hop right over it!" },
  { id:4, title:'Loop it Up', rows:1, cols:6, start:{row:0,col:0}, startFacing:1,
    goal:{row:0,col:5}, obstacles:[], allowed:['forward','turnLeft','turnRight','jump','repeat2','repeat3'],
    story:"Long path ahead! Try the Repeat block so you don't need lots of Move Forward blocks!" },
  { id:5, title:'Final Quest', rows:3, cols:4, start:{row:0,col:0}, startFacing:1,
    goal:{row:2,col:3}, obstacles:[{row:1,col:2}], allowed:['forward','turnLeft','turnRight','jump','repeat2','repeat3'],
    story:"The final challenge! Use everything you've learned to guide {name} to the treasure! 🏆" },
];

const BLOCK_DEFS = {
  forward:  {label:'Move Forward', icon:'➡️', cls:'forward'},
  turnLeft: {label:'Turn Left',    icon:'↩️', cls:'turnLeft'},
  turnRight:{label:'Turn Right',   icon:'↪️', cls:'turnRight'},
  jump:     {label:'Jump',         icon:'🦘', cls:'jump'},
  repeat2:  {label:'Repeat 2×',    icon:'🔁', cls:'repeat2'},
  repeat3:  {label:'Repeat 3×',    icon:'🔁', cls:'repeat3'},
};

/* facing: 0 up, 1 right, 2 down, 3 left */
const DELTAS = [{r:-1,c:0},{r:0,c:1},{r:1,c:0},{r:0,c:-1}];
const ARROW = ['⬆️','➡️','⬇️','⬅️'];

/* ---------- state ---------- */
const state = {
  charId:null, levelIndex:0, program:[], activeRepeatId:null,
  pos:{row:0,col:0}, facing:1, running:false, starsEarned:0, muted:false, uid:1,
};

function level(){ return LEVELS[state.levelIndex]; }
function charInfo(){ return CHARACTERS.find(c=>c.id===state.charId); }
function nextId(){ return state.uid++; }

/* ---------- sound (WebAudio, no external files) ---------- */
let actx=null;
function audioCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq,dur,type='sine',gain=0.16,delay=0){
  if(state.muted) return;
  const ctx=audioCtx(); if(!ctx) return;
  try{
    const t0=ctx.currentTime+delay;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(gain,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function sfx(name){
  if(name==='click') tone(520,0.09,'triangle',0.12);
  else if(name==='move') tone(430,0.14,'sine',0.14);
  else if(name==='turn') tone(600,0.1,'triangle',0.12);
  else if(name==='fail') tone(180,0.28,'sawtooth',0.12);
  else if(name==='success'){ tone(660,0.12,'sine',0.16); tone(880,0.14,'sine',0.16,0.12); tone(1040,0.2,'sine',0.18,0.24); }
  else if(name==='win'){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.24,'sine',0.18,i*0.14)); }
}

/* ---------- confetti (self-contained, no external libs) ---------- */
function burstConfetti(x,y,count=28){
  const colors=['#ff6f91','#ffd54a','#4fc3f7','#81c784','#ba68c8','#ff9e5e'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    const size=6+Math.random()*7;
    el.style.width=size+'px'; el.style.height=(size*0.45)+'px';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.left=x+'px'; el.style.top=y+'px';
    const angle=Math.random()*Math.PI*2;
    const dist=90+Math.random()*220;
    const dx=Math.cos(angle)*dist, dy=Math.sin(angle)*dist-140-Math.random()*120;
    el.style.setProperty('--dx',dx+'px');
    el.style.setProperty('--dy',dy+'px');
    el.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    el.style.animationDuration=(1.0+Math.random()*0.8)+'s';
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}
function confettiRain(durationMs){
  const start=Date.now();
  const iv=setInterval(()=>{
    if(Date.now()-start>durationMs){ clearInterval(iv); return; }
    burstConfetti(Math.random()*window.innerWidth, -10, 10);
  },220);
}

/* ---------- character select screen ---------- */
function initCharacterSelect(){
  const grid=document.getElementById('charGrid');
  grid.innerHTML='';
  CHARACTERS.forEach(ch=>{
    const card=document.createElement('div');
    card.className='char-card';
    const artWrap=document.createElement('div');
    artWrap.className='idle-bounce';
    artWrap.innerHTML=ch.svg();
    const h=document.createElement('h3'); h.textContent=ch.name;
    const p=document.createElement('p'); p.textContent=ch.tag;
    card.appendChild(artWrap); card.appendChild(h); card.appendChild(p);
    card.addEventListener('click',()=>{ sfx('click'); selectCharacter(ch.id); });
    grid.appendChild(card);
  });
}

function selectCharacter(id){
  state.charId=id; state.levelIndex=0; state.starsEarned=0;
  document.getElementById('mascotAvatar').innerHTML=charInfo().svg();
  loadLevel(0);
  showScreen('screen-game');
}

/* ---------- screens ---------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------- level loading ---------- */
function loadLevel(idx){
  state.levelIndex=idx;
  const lv=level();
  state.pos={row:lv.start.row, col:lv.start.col};
  state.facing=lv.startFacing;
  state.program=[]; state.activeRepeatId=null;
  document.getElementById('levelTag').textContent='Level '+(idx+1);
  document.getElementById('speechText').textContent=lv.story.replace('{name}',charInfo().name);
  renderLevelDots();
  renderBoard();
  renderPalette();
  renderProgram();
  clearFeedback();
  setControlsEnabled(true);
}

function renderLevelDots(){
  const wrap=document.getElementById('levelDots');
  wrap.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i<state.levelIndex?' done':'')+(i===state.levelIndex?' current':'');
    wrap.appendChild(d);
  });
}

/* ---------- board rendering ----------
   NOTE: grid-template-columns/rows and aspect-ratio are all set together,
   before any cells are appended, in one synchronous pass. Combined with
   `contain:layout` on .board-wrap and fixed flex-basis on the surrounding
   columns (see CSS), this keeps the board a stable size instead of
   "popping" bigger once content is added elsewhere on the page. */
function renderBoard(){
  const lv=level();
  const board=document.getElementById('board');
  board.innerHTML='';
  board.style.gridTemplateColumns=`repeat(${lv.cols},minmax(0,1fr))`;
  board.style.gridTemplateRows=`repeat(${lv.rows},minmax(0,1fr))`;
  board.style.aspectRatio=`${lv.cols}/${lv.rows}`;

  for(let r=0;r<lv.rows;r++){
    for(let c=0;c<lv.cols;c++){
      const cell=document.createElement('div');
      cell.className='cell'+(((r+c)%2)?' alt':'');
      const isRock=lv.obstacles.some(o=>o.row===r&&o.col===c);
      const isGoal=lv.goal.row===r&&lv.goal.col===c;
      const isStart=lv.start.row===r&&lv.start.col===c;
      if(isRock){ cell.classList.add('rock'); const s=document.createElement('div'); s.className='rock-icon'; s.textContent='🪨'; cell.appendChild(s); }
      if(isGoal){ cell.classList.add('goal'); const s=document.createElement('div'); s.className='goal-icon'; s.textContent='⭐'; cell.appendChild(s); }
      if(isStart){ const s=document.createElement('div'); s.className='start-icon'; s.textContent='🚩'; cell.appendChild(s); }
      board.appendChild(cell);
    }
  }

  const sprite=document.createElement('div');
  sprite.id='charSprite'; sprite.className='char-sprite';
  sprite.style.width=(100/lv.cols)+'%';
  sprite.style.height=(100/lv.rows)+'%';
  sprite.style.left=(state.pos.col*100/lv.cols)+'%';
  sprite.style.top=(state.pos.row*100/lv.rows)+'%';

  const inner=document.createElement('div');
  inner.id='charInner'; inner.className='char-inner';
  inner.innerHTML=charInfo().svg();
  const arrow=document.createElement('div');
  arrow.id='facingArrow'; arrow.className='facing-arrow';
  arrow.textContent=ARROW[state.facing];
  inner.appendChild(arrow);
  sprite.appendChild(inner);
  board.appendChild(sprite);
}

/* ---------- palette ---------- */
function renderPalette(){
  const lv=level();
  const wrap=document.getElementById('paletteBlocks');
  wrap.innerHTML='';
  lv.allowed.forEach(type=>{
    const def=BLOCK_DEFS[type];
    const btn=document.createElement('button');
    btn.className='block-btn '+def.cls;
    btn.innerHTML=`<span class="ic">${def.icon}</span><span>${def.label}</span>`;
    btn.addEventListener('click',()=>{ sfx('click'); handleBlockClick(type); });
    wrap.appendChild(btn);
  });
  updateLoopBanner();
}

function handleBlockClick(type){
  if(state.running) return;
  if(type==='repeat2') return addRepeat(2);
  if(type==='repeat3') return addRepeat(3);
  const step={id:nextId(), type};
  if(state.activeRepeatId){
    const rep=findRepeat(state.activeRepeatId);
    if(rep) rep.children.push(step);
  } else {
    state.program.push(step);
  }
  renderProgram();
}

function addRepeat(count){
  const rep={id:nextId(), type:'repeat', count, children:[]};
  state.program.push(rep);
  state.activeRepeatId=rep.id;
  renderProgram();
}

function findRepeat(id){
  return state.program.find(s=>s.type==='repeat'&&s.id===id);
}

function setActiveRepeat(id){ state.activeRepeatId=id; renderProgram(); }
function closeActiveRepeat(){ state.activeRepeatId=null; renderProgram(); }

function updateLoopBanner(){
  const banner=document.getElementById('loopBanner');
  const text=document.getElementById('loopBannerText');
  if(state.activeRepeatId){
    const rep=findRepeat(state.activeRepeatId);
    banner.classList.remove('hidden');
    text.textContent='📦 Adding blocks into your loop (🔁 x'+(rep?rep.count:'')+')...';
  } else {
    banner.classList.add('hidden');
  }
}

/* ---------- program rendering ---------- */
function renderProgram(){
  const wrap=document.getElementById('programList');
  wrap.innerHTML='';
  state.program.forEach(step=>{
    if(step.type==='repeat'){
      wrap.appendChild(buildRepeatChip(step));
    } else {
      wrap.appendChild(buildSimpleChip(step, state.program));
    }
  });
  updateLoopBanner();
}

function buildSimpleChip(step, ownerArray){
  const def=BLOCK_DEFS[step.type];
  const chip=document.createElement('div');
  chip.className='chip '+def.cls;
  chip.innerHTML=`<span>${def.icon}</span><span>${def.label}</span>`;
  const rm=document.createElement('button');
  rm.className='chip-remove'; rm.textContent='×';
  rm.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(state.running) return;
    const idx=ownerArray.indexOf(step);
    if(idx>-1) ownerArray.splice(idx,1);
    renderProgram();
  });
  chip.appendChild(rm);
  return chip;
}

function buildRepeatChip(rep){
  const outer=document.createElement('div');
  outer.className='repeat-chip'+(state.activeRepeatId===rep.id?' active-loop':'');
  const head=document.createElement('div');
  head.className='repeat-head';
  const label=document.createElement('span');
  label.textContent='🔁 Repeat '+rep.count+'×';
  const actions=document.createElement('div');
  actions.className='repeat-head-actions';

  const addBtn=document.createElement('button');
  addBtn.className='btn-add-inside';
  addBtn.textContent=(state.activeRepeatId===rep.id)?'✏️ Editing':'＋ Add';
  addBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(state.running) return; setActiveRepeat(rep.id); });

  const delBtn=document.createElement('button');
  delBtn.className='btn-done-inside';
  delBtn.textContent='🗑️';
  delBtn.addEventListener('click',(e)=>{
    e.stopPropagation(); if(state.running) return;
    const idx=state.program.indexOf(rep);
    if(idx>-1) state.program.splice(idx,1);
    if(state.activeRepeatId===rep.id) state.activeRepeatId=null;
    renderProgram();
  });

  actions.appendChild(addBtn); actions.appendChild(delBtn);
  head.appendChild(label); head.appendChild(actions);

  const childWrap=document.createElement('div');
  childWrap.className='repeat-children';
  rep.children.forEach(child=>{
    childWrap.appendChild(buildSimpleChip(child, rep.children));
  });

  outer.appendChild(head);
  outer.appendChild(childWrap);
  return outer;
}

/* ---------- feedback ---------- */
function showFeedback(msg){ document.getElementById('feedbackBanner').textContent=msg; }
function clearFeedback(){ document.getElementById('feedbackBanner').textContent=''; }

/* ---------- controls enable/disable ---------- */
function setControlsEnabled(on){
  document.querySelectorAll('.block-btn').forEach(b=>b.disabled=!on);
  document.getElementById('btnRun').disabled=!on;
  document.getElementById('btnClear').disabled=!on;
  document.querySelectorAll('.chip-remove, .btn-add-inside, .btn-done-inside').forEach(b=>b.style.pointerEvents=on?'auto':'none');
}

/* ---------- execution ---------- */
function flattenProgram(){
  const out=[];
  state.program.forEach(step=>{
    if(step.type==='repeat'){
      for(let i=0;i<step.count;i++){ step.children.forEach(c=>out.push({type:c.type})); }
    } else {
      out.push({type:step.type});
    }
  });
  return out;
}

function sparkleAt(){
  const sprite=document.getElementById('charSprite');
  const s=document.createElement('div');
  s.className='sparkle'; s.textContent='✨';
  s.style.left='30%'; s.style.top='10%';
  sprite.appendChild(s);
  setTimeout(()=>s.remove(),720);
}

function moveTo(row,col,jump){
  return new Promise(resolve=>{
    const sprite=document.getElementById('charSprite');
    const inner=document.getElementById('charInner');
    const lv=level();
    sprite.style.left=(col*100/lv.cols)+'%';
    sprite.style.top=(row*100/lv.rows)+'%';
    inner.classList.remove('hop','hop-big');
    void inner.offsetWidth;
    inner.classList.add(jump?'hop-big':'hop');
    sparkleAt();
    sfx('move');
    setTimeout(()=>{ inner.classList.remove('hop','hop-big'); resolve(true); },500);
  });
}

function bumpChar(msg){
  return new Promise(resolve=>{
    const inner=document.getElementById('charInner');
    inner.classList.remove('bump'); void inner.offsetWidth;
    inner.classList.add('bump');
    sfx('fail');
    showFeedback(msg);
    setTimeout(()=>{ inner.classList.remove('bump'); resolve(false); },520);
  });
}

function turnTo(newFacing){
  return new Promise(resolve=>{
    state.facing=newFacing;
    const arrow=document.getElementById('facingArrow');
    arrow.textContent=ARROW[newFacing];
    sfx('turn');
    setTimeout(()=>resolve(true),300);
  });
}

async function executeStep(step){
  const lv=level();
  if(step.type==='turnLeft'){ return await turnTo((state.facing+3)%4); }
  if(step.type==='turnRight'){ return await turnTo((state.facing+1)%4); }
  const d=DELTAS[state.facing];
  const mult=(step.type==='jump')?2:1;
  const nr=state.pos.row+d.r*mult, nc=state.pos.col+d.c*mult;
  if(nr<0||nr>=lv.rows||nc<0||nc>=lv.cols){
    return await bumpChar(step.type==='jump' ? "Whoa, that jump goes off the map! 🌟" : "That's the edge of the map! Try a different move. 🌟");
  }
  if(step.type==='forward'){
    const blocked=lv.obstacles.some(o=>o.row===nr&&o.col===nc);
    if(blocked){
      return await bumpChar("A rock is in the way! 🪨 Try the Jump block!");
    }
  }
  state.pos={row:nr,col:nc};
  return await moveTo(nr,nc, step.type==='jump');
}

async function runProgram(){
  if(state.running) return;
  if(state.program.length===0){ showFeedback('Add some blocks first! 🧩'); return; }
  state.activeRepeatId=null; renderProgram();
  state.running=true; setControlsEnabled(false); clearFeedback();
  const steps=flattenProgram();
  let hitProblem=false;
  for(const step of steps){
    const res=await executeStep(step);
    if(!res){ hitProblem=true; break; }
  }
  // Always check the goal, even if a later block failed — reaching the
  // star is what matters, not whether every single block ran cleanly.
  const lv=level();
  if(state.pos.row===lv.goal.row && state.pos.col===lv.goal.col){
    await onLevelSuccess();
  } else if(!hitProblem){
    showFeedback("So close! Keep trying — you can do it! 💪");
  }
  state.running=false; setControlsEnabled(true);
}

async function onLevelSuccess(){
  sfx('success');
  const inner=document.getElementById('charInner');
  inner.classList.add('celebrate');
  const sprite=document.getElementById('charSprite');
  const rect=sprite.getBoundingClientRect();
  burstConfetti(rect.left+rect.width/2, rect.top+rect.height/2, 34);
  showFeedback('🎉 You reached the goal! Great coding!');
  state.starsEarned++;
  setTimeout(()=>inner.classList.remove('celebrate'),1000);

  await new Promise(r=>setTimeout(r,900));

  if(state.levelIndex===LEVELS.length-1){
    showFinalWin();
  } else {
    openLevelCompleteModal();
  }
}

function openLevelCompleteModal(){
  const lv=level();
  document.getElementById('modalTitle').textContent=['Great job!','Awesome!','Fantastic!','You rock!'][state.levelIndex%4];
  document.getElementById('modalText').textContent=charInfo().name+' finished "'+lv.title+'"! Ready for the next challenge?';
  document.getElementById('levelCompleteModal').classList.remove('hidden');
}

document.getElementById('btnNextLevel').addEventListener('click',()=>{
  sfx('click');
  document.getElementById('levelCompleteModal').classList.add('hidden');
  loadLevel(state.levelIndex+1);
});

function showFinalWin(){
  showScreen('screen-win');
  sfx('win');
  document.getElementById('winMessage').textContent=
    charInfo().name+' completed Code Quest! You learned sequencing, turns, jumps and loops like a real programmer! 🏆';
  confettiRain(3200);
  setTimeout(()=>burstConfetti(window.innerWidth/2, window.innerHeight*0.35, 60),200);
}

document.getElementById('btnPlayAgain').addEventListener('click',()=>{
  sfx('click');
  state.levelIndex=0; state.starsEarned=0; state.charId=null;
  showScreen('screen-select');
});

/* ---------- header buttons ---------- */
document.getElementById('btnHome').addEventListener('click',()=>{
  sfx('click');
  showScreen('screen-select');
});
document.getElementById('btnMute').addEventListener('click',(e)=>{
  state.muted=!state.muted;
  e.target.textContent=state.muted?'🔇':'🔊';
  if(!state.muted) sfx('click');
});
document.getElementById('btnClear').addEventListener('click',()=>{
  if(state.running) return;
  sfx('click');
  state.program=[]; state.activeRepeatId=null;
  renderProgram(); clearFeedback();
});
document.getElementById('btnRun').addEventListener('click',()=>{ sfx('click'); runProgram(); });
document.getElementById('btnDoneLoop').addEventListener('click',()=>{ sfx('click'); closeActiveRepeat(); });

/* ---------- floating clouds ---------- */
function spawnClouds(){
  const decor=document.getElementById('bg-decor');
  const cloudSvg=(w)=>`<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg"><ellipse cx="30" cy="38" rx="28" ry="18" fill="#fff"/><ellipse cx="60" cy="26" rx="30" ry="22" fill="#fff"/><ellipse cx="92" cy="38" rx="24" ry="16" fill="#fff"/></svg>`;
  for(let i=0;i<4;i++){
    const c=document.createElement('div');
    c.className='cloud';
    const w=90+Math.random()*90;
    c.style.width=w+'px'; c.style.height=(w*0.5)+'px';
    c.style.top=(6+Math.random()*32)+'%';
    c.style.animationDuration=(38+Math.random()*30)+'s';
    c.style.animationDelay=(-Math.random()*40)+'s';
    c.innerHTML=cloudSvg(w);
    decor.appendChild(c);
  }
}

/* ---------- init ---------- */
initCharacterSelect();
spawnClouds();
</script>
