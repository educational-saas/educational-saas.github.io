<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Snapshot Safari 📸 — Photo Fun for Kids!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;

    /* ---------- Brand palette (light) — matches the parent portal ---------- */
    --teal-900:#0d3841;
    --teal-800:#124f59;
    --teal-700:#1b6b78;
    --teal-600:#227d8b;
    --teal-100:#e3eef0;
    --gold-600:#e2941a;
    --gold-500:#f5a623;
    --gold-400:#ffc65c;
    --gold-100:#fdf1dc;
    --cream:#faf8f3;
    --ink-900:#1c2626;
    --ink-500:#5f6f70;
    --white:#ffffff;

    --bg-tint-gold: rgba(245,166,35,.10);
    --bg-tint-teal: rgba(27,107,120,.10);
    --border-card: rgba(13,56,65,.08);

    /* ---------- Kid-friendly accents ---------- */
    --fun-red:#f2555a;
    --fun-orange:#ff9f45;
    --fun-yellow:#ffd85c;
    --fun-green:#4fc98a;
    --fun-blue:#4aa8e0;
    --fun-purple:#a679e0;
    --fun-pink:#ff8fc0;

    /* ---------- Snapshot Safari semantic tokens ---------- */
    --leaf:var(--fun-green);
    --leaf-dark:#399c6c;
    --flash:var(--gold-500);
    --flash-dark:var(--gold-600);
    --shutter:var(--fun-red);
    --shutter-dark:#d1454a;
    --plum:var(--ink-900);
    --ink-soft:var(--ink-500);
    --frame-locked: var(--teal-100);
    --frame-locked-ink: var(--ink-500);
    --lens: var(--fun-purple);
    --sky-blue: var(--fun-blue);

    --panel-tint: var(--bg-tint-teal);
    --bubble-tint: var(--bg-tint-gold);
    --cloud-tint: rgba(255,255,255,.85);
    --overlay-tint: color-mix(in srgb, var(--teal-900) 55%, transparent);
    --overlay-tint-strong: color-mix(in srgb, var(--teal-900) 62%, transparent);
    --edge-shadow: rgba(13,56,65,.14);
    --edge-shadow-soft: rgba(13,56,65,.08);
    --photo-frame-bg: #ffffff;
    --photo-border: rgba(13,56,65,.10);

    --r-lg:26px;
    --r-md:18px;
    --r-sm:14px;
    --ease:cubic-bezier(.22,1,.36,1);

    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Manrope',system-ui,sans-serif;
  }

  html[data-theme="dark"]{
    color-scheme: dark;
    --teal-900:#092227;
    --teal-800:#8fe1ec;
    --teal-700:#5fd0de;
    --teal-600:#7fdbe6;
    --teal-100:#173338;
    --gold-600:#ffb648;
    --gold-500:#ffc65c;
    --gold-400:#ffd685;
    --gold-100:#2b2110;
    --cream:#0d1517;
    --ink-900:#eef3f2;
    --ink-500:#a4b6b7;
    --white:#182425;

    --bg-tint-gold: rgba(255,182,72,.08);
    --bg-tint-teal: rgba(95,208,222,.12);
    --border-card: rgba(255,255,255,.10);

    --leaf-dark:#2c8f60;
    --shutter-dark:#c23b41;

    --cloud-tint: rgba(255,255,255,.14);
    --edge-shadow: rgba(0,0,0,.5);
    --edge-shadow-soft: rgba(0,0,0,.35);
    --photo-frame-bg:#20302f;
    --photo-border: rgba(255,255,255,.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100%;
    font-family:var(--font-body);
    color:var(--plum);
    background:linear-gradient(180deg,var(--bg-tint-teal) 0%, var(--cream) 55%, var(--bg-tint-gold) 100%);
    overflow-x:hidden;
    position:relative;
    transition:background .3s var(--ease), color .3s var(--ease);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- decorative sky ---------- */
  .sky-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .sun-decor{
    position:absolute;top:-40px;right:6%;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--gold-400), var(--flash) 70%);
    box-shadow:0 0 60px 20px rgba(245,166,35,.35);
    animation:pulse 4s ease-in-out infinite;
  }
  .cloud{position:absolute;background:var(--cloud-tint);border-radius:50px;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:var(--cloud-tint);border-radius:50%;}
  .cloud1{width:110px;height:36px;top:8%;left:5%;animation:drift 34s linear infinite;}
  .cloud1::before{width:55px;height:55px;top:-26px;left:12px;}
  .cloud1::after{width:40px;height:40px;top:-18px;left:55px;}
  .cloud2{width:90px;height:30px;top:18%;left:70%;animation:drift 26s linear infinite reverse;}
  .cloud2::before{width:44px;height:44px;top:-20px;left:8px;}
  .cloud2::after{width:34px;height:34px;top:-14px;left:44px;}
  .cloud3{width:70px;height:24px;top:35%;left:40%;animation:drift 40s linear infinite;}
  .cloud3::before{width:34px;height:34px;top:-16px;left:6px;}
  .cloud3::after{width:26px;height:26px;top:-10px;left:34px;}
  @keyframes drift{from{transform:translateX(-10vw);}to{transform:translateX(110vw);}}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  /* floating camera / photo decorations */
  .float-deco{position:absolute;font-size:26px;opacity:.5;animation:floaty 6s ease-in-out infinite;}
  .float-deco.d2{top:60%;left:2%;animation-duration:8s;font-size:20px;}
  .float-deco.d3{top:45%;right:3%;animation-duration:7s;font-size:22px;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-14px) rotate(6deg);}}

  /* ---------- top bar ---------- */
  .top-bar{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;gap:12px;flex-wrap:wrap;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);font-weight:700;
    font-size:clamp(20px,3vw,28px);color:var(--plum);
  }
  .brand .mascot-mini{font-size:1.4em;animation:bob 2.4s ease-in-out infinite;display:inline-block;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}

  .top-right{display:flex;align-items:center;gap:10px;}
  .stars-counter{
    display:flex;align-items:center;gap:6px;
    background:var(--white);border:3px solid var(--flash);
    border-radius:999px;padding:8px 16px;
    font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--edge-shadow-soft);
    color:var(--plum);
  }
  .icon-btn{
    width:46px;height:46px;border-radius:50%;border:3px solid var(--white);
    background:var(--white);font-size:20px;cursor:pointer;box-shadow:0 4px 0 var(--edge-shadow-soft);
    display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
  }
  .icon-btn:hover{transform:translateY(-2px) scale(1.05);}
  .icon-btn:active{transform:translateY(1px) scale(.97);}

  /* ---------- path of stepping stones ---------- */
  .path-wrap{
    position:relative;z-index:2;
    margin:6px auto 10px;max-width:1000px;
    overflow-x:auto;overflow-y:hidden;
    padding:14px 18px 22px;
  }
  .path{
    display:flex;align-items:flex-end;gap:14px;min-width:max-content;padding:0 6px;
    position:relative;
  }
  .path::before{
    content:"";position:absolute;left:0;right:0;top:50%;height:0;
    border-top:5px dashed var(--border-card);z-index:0;
  }
  .stone{
    position:relative;z-index:1;
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:16px;
    background:var(--frame-locked);color:var(--frame-locked-ink);
    border:4px solid var(--white);box-shadow:0 4px 0 var(--edge-shadow-soft);
    flex:0 0 auto;transition:transform .2s ease, background .2s ease;
  }
  .stone:nth-child(odd){transform:translateY(-6px);}
  .stone:nth-child(even){transform:translateY(6px);}
  .stone.done{background:var(--leaf);color:#fff;}
  .stone.current{background:var(--flash);color:#5a3c00;transform:translateY(-6px) scale(1.18);box-shadow:0 0 0 5px rgba(245,166,35,.35), 0 4px 0 var(--edge-shadow-soft);animation:stonepulse 1.6s ease-in-out infinite;}
  @keyframes stonepulse{0%,100%{box-shadow:0 0 0 5px rgba(245,166,35,.35),0 4px 0 var(--edge-shadow-soft);}50%{box-shadow:0 0 0 9px rgba(245,166,35,.16),0 4px 0 var(--edge-shadow-soft);}}
  .stone.trophy{background:linear-gradient(160deg,var(--flash),var(--shutter));color:#fff;font-size:22px;}

  /* ---------- main stage ---------- */
  .stage{
    position:relative;z-index:2;
    max-width:1000px;margin:0 auto;padding:10px 18px 60px;
    display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start;
  }
  @media (max-width:760px){ .stage{grid-template-columns:1fr;} }

  .mascot-card{
    background:var(--white);border-radius:var(--r-lg);padding:18px 16px;
    text-align:center;box-shadow:0 8px 0 var(--edge-shadow-soft);
    position:sticky;top:14px;border:1px solid var(--border-card);
  }
  .mascot{
    font-size:64px;display:inline-block;
    animation:bob 3s ease-in-out infinite;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.12));
  }
  .mascot.happy{animation:jump .6s ease-in-out 2;}
  @keyframes jump{0%,100%{transform:translateY(0) rotate(0);}30%{transform:translateY(-18px) rotate(-8deg);}60%{transform:translateY(0) rotate(6deg);}}
  .speech-bubble{
    margin-top:10px;background:var(--bubble-tint);border-radius:var(--r-md);padding:12px;
    font-size:15px;font-weight:700;color:var(--plum);line-height:1.35;
    min-height:60px;display:flex;align-items:center;justify-content:center;
  }
  .mascot-name{font-family:var(--font-display);font-weight:700;color:var(--lens);font-size:14px;margin-top:6px;}

  .task-card{
    background:var(--white);border-radius:var(--r-lg);padding:24px 24px 20px;
    box-shadow:0 10px 0 var(--edge-shadow-soft);
    position:relative;overflow:hidden;border:1px solid var(--border-card);
  }
  .task-badge{
    display:inline-block;background:var(--flash);color:#5a3c00;font-weight:800;
    font-family:var(--font-display);font-size:13px;letter-spacing:.3px;
    padding:5px 14px;border-radius:999px;margin-bottom:10px;
  }
  .task-title{
    font-family:var(--font-display);font-weight:700;font-size:clamp(22px,4vw,30px);
    margin:2px 0 6px;color:var(--plum);
  }
  .task-instruction{
    font-size:16px;font-weight:600;line-height:1.5;margin:0 0 16px;color:var(--ink-soft);
  }

  /* ---------- photo stage ---------- */
  .photo-zone{
    display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  .photo-frame{
    background:var(--photo-frame-bg);border:6px solid var(--photo-frame-bg);
    outline:2px solid var(--photo-border);
    border-radius:16px;overflow:hidden;box-shadow:0 8px 0 var(--edge-shadow-soft);
    position:relative;transition:transform .25s var(--ease);
  }
  .photo-frame img{display:block;width:100%;height:100%;object-fit:cover;transition:filter .5s ease, transform .5s ease;}
  .photo-frame.landscape{width:min(360px,80vw);height:240px;}
  .photo-frame.portrait{width:220px;height:min(320px,60vw);}
  .photo-frame.clickable{cursor:pointer;}
  .photo-frame.clickable:hover{transform:translateY(-4px) scale(1.02);}
  .photo-frame.selected{outline:5px solid var(--leaf);box-shadow:0 0 0 6px rgba(79,201,138,.28),0 8px 0 var(--edge-shadow-soft);}
  .photo-frame.wrong-pick{outline:5px solid var(--shutter);animation:shake .5s ease;}
  .photo-badge{
    position:absolute;top:8px;left:8px;background:rgba(255,255,255,.9);color:var(--plum);
    font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;
  }
  .crop-window{
    width:min(320px,82vw);height:260px;border-radius:16px;overflow:hidden;
    background:var(--photo-frame-bg);border:6px solid var(--photo-frame-bg);outline:2px solid var(--photo-border);
    box-shadow:0 8px 0 var(--edge-shadow-soft);position:relative;
  }
  .crop-window svg{width:100%;height:100%;transition:transform .6s var(--ease);}

  .round-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--bg-tint-gold);
    border:2px dashed var(--flash-dark);border-radius:999px;padding:8px 16px;
    font-weight:800;color:var(--plum);font-family:var(--font-display);font-size:15px;margin-bottom:14px;
  }

  /* ---------- gallery grid (level 1) ---------- */
  .gallery-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-bottom:16px;
  }
  .gallery-item{
    border-radius:14px;overflow:hidden;cursor:pointer;border:5px solid var(--white);
    outline:2px solid var(--photo-border);box-shadow:0 5px 0 var(--edge-shadow-soft);
    transition:transform .15s ease; aspect-ratio:1/1; position:relative;
  }
  .gallery-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery-item:hover{transform:translateY(-3px) scale(1.03);}
  .gallery-item.chosen{outline:5px solid var(--leaf);}
  .gallery-item.chosen::after{
    content:"💚"; position:absolute; top:6px; right:6px; font-size:20px;
    background:rgba(255,255,255,.9); border-radius:50%; padding:2px 5px;
  }

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:16px;}
  .tool-btn{
    display:inline-flex;align-items:center;gap:8px;
    border:none;border-radius:16px;background:var(--white);color:var(--plum);
    box-shadow:0 4px 0 var(--edge-shadow-soft);cursor:pointer;font-weight:800;font-size:15px;
    padding:12px 18px;transition:transform .12s ease;font-family:var(--font-body);
  }
  .tool-btn .ic{font-size:20px;}
  .tool-btn:hover{transform:translateY(-2px);}
  .tool-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--edge-shadow-soft);}
  .tool-btn.glow{animation:glow 1.1s ease-in-out infinite;}
  @keyframes glow{0%,100%{box-shadow:0 4px 0 var(--edge-shadow-soft),0 0 0 0 rgba(166,121,224,.5);}50%{box-shadow:0 4px 0 var(--edge-shadow-soft),0 0 0 9px rgba(166,121,224,0);}}
  .tool-btn.leaf{background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-dark);}
  .tool-btn.lens{background:var(--lens);color:#fff;box-shadow:0 4px 0 #7d54b8;}
  .tool-btn.sky{background:var(--sky-blue);color:#fff;box-shadow:0 4px 0 #3583b3;}
  .tool-btn.flash{background:var(--flash);color:#5a3c00;box-shadow:0 4px 0 var(--flash-dark);}
  .tool-btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;}

  .meter-wrap{width:min(260px,80vw);margin:4px auto 0;text-align:center;}
  .meter-track{height:16px;background:var(--frame-locked);border-radius:999px;overflow:hidden;border:2px solid var(--photo-border);}
  .meter-fill{height:100%;background:linear-gradient(90deg,var(--flash),var(--flash-dark));width:20%;transition:width .35s var(--ease);}
  .meter-label{font-size:13px;font-weight:800;color:var(--ink-soft);margin-top:6px;}

  .action-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;}
  .btn-primary,.btn-big{
    font-family:var(--font-body);font-weight:800;font-size:17px;
    border:none;border-radius:999px;padding:14px 26px;cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn-primary{background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-dark);}
  .btn-primary:hover{filter:brightness(1.05);transform:translateY(-2px);}
  .btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-dark);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none !important;filter:none !important;}
  .btn-big{background:var(--shutter);color:#fff;font-size:19px;padding:16px 34px;box-shadow:0 5px 0 var(--shutter-dark);}
  .btn-big:hover{transform:translateY(-2px);}
  .btn-big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shutter-dark);}

  .hint-msg{margin-top:14px;font-weight:800;font-size:15px;min-height:22px;text-align:center;}
  .hint-msg.err{color:var(--shutter-dark);}
  .hint-msg.ok{color:var(--leaf-dark);}

  /* ---------- confetti ---------- */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
  .confetti-piece{position:absolute;top:-20px;border-radius:3px;animation:fall linear forwards;}
  @keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(105vh) rotate(540deg);opacity:.9;}}
  @keyframes shake{10%,90%{transform:translateX(-3px);}20%,80%{transform:translateX(6px);}30%,50%,70%{transform:translateX(-10px);}40%,60%{transform:translateX(10px);}}

  /* ---------- celebration overlay ---------- */
  .celebrate-overlay{position:fixed;inset:0;background:var(--overlay-tint);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .celebrate-overlay.show{display:flex;}
  .celebrate-card{
    background:var(--white);border-radius:var(--r-lg);padding:34px 30px;text-align:center;
    max-width:420px;width:100%;box-shadow:0 12px 0 var(--edge-shadow);
    animation:pop .35s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--border-card);
  }
  @keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .celebrate-emoji{font-size:70px;animation:jump .6s ease-in-out 3;display:inline-block;}
  .celebrate-title{font-family:var(--font-display);font-weight:700;font-size:26px;margin:8px 0 4px;color:var(--plum);}
  .celebrate-msg{font-weight:700;color:var(--ink-soft);margin-bottom:18px;}

  /* ---------- final certificate ---------- */
  .final-overlay{position:fixed;inset:0;background:var(--overlay-tint-strong);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;}
  .final-overlay.show{display:flex;}
  .certificate{
    background:var(--cream);border-radius:var(--r-lg);padding:40px 34px;text-align:center;
    max-width:520px;width:100%;border:10px solid var(--flash);
    box-shadow:0 14px 0 var(--edge-shadow);animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  .certificate .trophy-emoji{font-size:74px;}
  .certificate h2{font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--plum);margin:6px 0;}
  .certificate .cert-name{font-family:var(--font-display);font-weight:700;font-size:32px;color:var(--shutter-dark);margin:10px 0;}
  .certificate p{font-weight:700;color:var(--ink-soft);}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

  @media (max-width:480px){
    .task-card{padding:18px 16px 16px;}
    .toolbar{gap:8px;}
    .tool-btn{padding:10px 14px;font-size:14px;}
  }
</style>
</head>
<body>

<div class="sky-decor">
  <div class="sun-decor"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <div class="float-deco">📷</div>
  <div class="float-deco d2">🌟</div>
  <div class="float-deco d3">🖼️</div>
</div>

<div class="top-bar">
  <div class="brand"><span class="mascot-mini">🦊</span> Snapshot Safari</div>
  <div class="top-right">
    <div class="stars-counter">⭐ <span id="starCount">0</span></div>
    <button class="icon-btn" id="muteBtn" title="Sound on/off">🔊</button>
  </div>
</div>

<div class="path-wrap">
  <div class="path" id="pathTrack"></div>
</div>

<main class="stage">
  <div class="mascot-card">
    <div class="mascot" id="mascotFace">🦊</div>
    <div class="speech-bubble" id="speechBubble">Hi! I'm Pip the Fox. Let's play with pictures together! 📸</div>
    <div class="mascot-name">Pip the Fox</div>
  </div>

  <div class="task-card" id="taskCard">
    <div class="task-badge" id="taskBadge">Level 1</div>
    <h2 class="task-title" id="taskTitle"></h2>
    <p class="task-instruction" id="taskInstruction"></p>

    <div id="roundPillWrap" style="text-align:center;"></div>
    <div class="photo-zone" id="photoZone"></div>
    <div class="gallery-grid" id="galleryGrid" style="display:none;"></div>
    <div class="toolbar" id="toolbar" style="display:none;"></div>

    <div class="action-row">
      <button class="btn-primary" id="checkBtn">Check! ✅</button>
    </div>
    <div class="hint-msg" id="hintMsg"></div>
  </div>
</main>

<div class="confetti-layer" id="confettiLayer"></div>

<div class="celebrate-overlay" id="celebrateOverlay">
  <div class="celebrate-card">
    <div class="celebrate-emoji" id="celebrateEmoji">🎉</div>

    var gen = ILLUS[id] || mountainSVG;
    return svgDataUri(gen());

  var GALLERY = [

    {id:1040, orient:'landscape', label:'Sunny Beach'}
  ];

  var CLARITY_PAIRS = [
    {id:1084, label:'Curious Fox'},
    {id:237,  label:'Sleepy Dog'}
  ];

  /* ================= STATE ================= */
  var state = { index:0, stars:0, muted:false, playerName:'', round:0, brightness:0.35, rotated:true, colored:false, cropChoice:null, chosenGalleryIdx:null, clarityPick:null };

  var tryAgain = ["Almost! Try again. 🦊","So close! One more try. 💪","Not quite — you can do it! 🌈","Keep going, you're learning fast! ✨"];

  };

  /* ================= AUDIO ================= */
  var audioCtx = null;
  function getCtx(){ if(!audioCtx){ var C=window.AudioContext||window.webkitAudioContext; if(C) audioCtx=new C(); } return audioCtx; }
  function beep(freq,dur,delay,vol){
    if(state.muted) return;
    var ctx=getCtx(); if(!ctx) return;
    var t0=ctx.currentTime+(delay||0);
    var osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(vol||0.15,t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function playTap(){ beep(520,0.08,0,0.08); }
  function playSuccess(){ beep(523.25,0.16,0); beep(659.25,0.16,0.12); beep(783.99,0.28,0.24); }
  function playOops(){ beep(300,0.18,0,0.09); beep(240,0.22,0.1,0.09); }
  function speak(text){
    if(state.muted) return;
    if(!('speechSynthesis' in window)) return;

  }

    levels.forEach(function(t,i){
      var s=document.getElementById('stone-'+i);
      s.classList.remove('done','current');
      if(i<state.index) s.classList.add('done');
      else if(i===state.index) s.classList.add('current');
    });
  }

    var wrap=document.createElement('div');

    el.toolbar.style.display='flex';
    var bWide=document.createElement('button'); bWide.className='tool-btn sky'; bWide.innerHTML='<span class="ic">🖼️</span> Landscape (Wide)';
    var bTall=document.createElement('button'); bTall.className='tool-btn lens'; bTall.innerHTML='<span class="ic">📱</span> Portrait (Tall)';
    el.toolbar.appendChild(bTall); el.toolbar.appendChild(bWide);
    el.checkBtn.style.display='none';

    function pick(choice){
      playTap();
      if(choice===r.orient){
        levelSucceededInline();
      } else {
        playOops();
        el.hintMsg.textContent = tryAgain[Math.floor(Math.random()*tryAgain.length)];
        el.hintMsg.className='hint-msg err';
        f.wrap.classList.add('wrong-pick');
        setTimeout(function(){ f.wrap.classList.remove('wrong-pick'); },500);
      }
    }
    bWide.addEventListener('click', function(){ pick('landscape'); });
    bTall.addEventListener('click', function(){ pick('portrait'); });
  }

  function orientationRoundAdvance(){
    state.round += 1;
    if(state.round >= ORIENTATION_ROUNDS.length){
      state.round = 0;
      return true; // level complete
    }
    renderLevel();
    return false;
  }

  /* ---- Level: clarity pick ---- */
  function renderClarity(){
    var pair = CLARITY_PAIRS[0];
    var blurFirst = Math.random() < 0.5;
    var frameA = makePhotoFrame('landscape', pair.id, 320, 220);
    var frameB = makePhotoFrame('landscape', pair.id, 320, 220);
    if(blurFirst){ frameA.img.style.filter='blur(7px)'; } else { frameB.img.style.filter='blur(7px)'; }
    frameA.wrap.classList.add('clickable'); frameB.wrap.classList.add('clickable');
    el.photoZone.appendChild(frameA.wrap); el.photoZone.appendChild(frameB.wrap);
    el.checkBtn.style.display='none';

    function choose(frame, isClear){
      playTap();
      if(isClear){ levelSucceededInline(); }
      else {
        playOops();
        frame.wrap.classList.add('wrong-pick');
        setTimeout(function(){ frame.wrap.classList.remove('wrong-pick'); },500);
        el.hintMsg.textContent = tryAgain[Math.floor(Math.random()*tryAgain.length)];
        el.hintMsg.className='hint-msg err';
      }
    }
    frameA.wrap.addEventListener('click', function(){ choose(frameA, !blurFirst); });
    frameB.wrap.addEventListener('click', function(){ choose(frameB, blurFirst); });
  }

  /* ---- Level: brightness ---- */
  function renderBrightness(){
    state.brightness = 0.32;
    var f = makePhotoFrame('landscape', 1018, 360, 240);
    f.img.style.filter='brightness('+state.brightness+')';
    el.photoZone.appendChild(f.wrap);

    var meterWrap=document.createElement('div'); meterWrap.className='meter-wrap';
    meterWrap.innerHTML='<div class="meter-track"><div class="meter-fill" id="brightFill"></div></div><div class="meter-label">Brightness</div>';
    el.photoZone.appendChild(meterWrap);

    el.toolbar.style.display='flex';
    var btn=document.createElement('button'); btn.className='tool-btn flash glow'; btn.innerHTML='<span class="ic">☀️</span> Brighten!';
    el.toolbar.appendChild(btn);

    updateBrightFill();
    btn.addEventListener('click', function(){
      playTap();
      state.brightness = Math.min(1.05, state.brightness + 0.15);
      f.img.style.filter='brightness('+state.brightness+')';
      updateBrightFill();
      if(state.brightness >= 1.0){
        btn.classList.remove('glow');
        el.hintMsg.textContent='Perfect! So bright and cheerful! ☀️';
        el.hintMsg.className='hint-msg ok';
      }
    });
    function updateBrightFill(){
      var pct = Math.min(100, Math.round((state.brightness/1.0)*100));
      document.getElementById('brightFill').style.width = pct+'%';
    }
  }

  /* ---- Level: sharpen ---- */
  function renderSharpen(){
    var f = makePhotoFrame('portrait', 1084, 220, 320);
    f.img.style.filter='blur(6px)';
    el.photoZone.appendChild(f.wrap);

    el.toolbar.style.display='flex';
    var btn=document.createElement('button'); btn.className='tool-btn lens glow'; btn.innerHTML='<span class="ic">✨</span> Sharpen!';
    el.toolbar.appendChild(btn);

    var done=false;
    btn.addEventListener('click', function(){
      playTap();
      if(done) return;
      done=true;
      f.img.style.filter='blur(0px)';
      btn.classList.remove('glow');
      el.hintMsg.textContent='So clear now! Great fix! ✨';
      el.hintMsg.className='hint-msg ok';
    });
    el.checkBtn.dataset.needsDone='sharpen';
    checkTaskExtra = function(){ return done; };
  }

  /* ---- Level: rotate ---- */
  function renderRotate(){
    var f = makePhotoFrame('landscape', 1074, 360, 240);
    f.wrap.style.transform='rotate(180deg)';
    el.photoZone.appendChild(f.wrap);

    el.toolbar.style.display='flex';
    var btn=document.createElement('button'); btn.className='tool-btn sky glow'; btn.innerHTML='<span class="ic">🔄</span> Turn It Right!';
    el.toolbar.appendChild(btn);

    var fixed=false;
    btn.addEventListener('click', function(){
      playTap();
      if(fixed) return;
      fixed=true;
      f.wrap.style.transform='rotate(0deg)';
      btn.classList.remove('glow');
      el.hintMsg.textContent='Yay! Right-side up! 🔄';
      el.hintMsg.className='hint-msg ok';
    });
    checkTaskExtra = function(){ return fixed; };
  }

  /* ---- Level: color ---- */
  function renderColor(){
    var f = makePhotoFrame('landscape', 1040, 360, 240);
    f.img.style.filter='grayscale(1)';
    el.photoZone.appendChild(f.wrap);

    el.toolbar.style.display='flex';
    var btn=document.createElement('button'); btn.className='tool-btn leaf glow'; btn.innerHTML='<span class="ic">🎨</span> Add Color!';
    el.toolbar.appendChild(btn);

    var colored=false;
    btn.addEventListener('click', function(){
      playTap();
      if(colored) return;
      colored=true;
      f.img.style.filter='grayscale(0)';
      btn.classList.remove('glow');
      el.hintMsg.textContent='Wow, so colorful! 🎨';
      el.hintMsg.className='hint-msg ok';
    });
    checkTaskExtra = function(){ return colored; };
  }

  /* ---- Level: crop to face ---- */
  function renderCrop(){
    var cw = document.createElement('div'); cw.className='crop-window';
    cw.innerHTML = foxSVG();
    el.photoZone.appendChild(cw);
    var svg = cw.querySelector('svg');
    svg.style.transform='scale(1) translate(0,0)';

    el.toolbar.style.display='flex';
    var bFace=document.createElement('button'); bFace.className='tool-btn lens glow'; bFace.innerHTML='<span class="ic">🔍</span> Zoom to Face';
    var bBody=document.createElement('button'); bBody.className='tool-btn sky'; bBody.innerHTML='<span class="ic">🦊</span> Whole Fox';
    var bBg=document.createElement('button'); bBg.className='tool-btn leaf'; bBg.innerHTML='<span class="ic">🌳</span> Background';
    el.toolbar.appendChild(bFace); el.toolbar.appendChild(bBody); el.toolbar.appendChild(bBg);

    var picked=null;
    function setPick(which){
      playTap(); picked=which;
      if(which==='face'){ svg.style.transform='scale(2.5) translate(0px,-30px)'; }
      else if(which==='body'){ svg.style.transform='scale(1) translate(0,0)'; }
      else { svg.style.transform='scale(1.3) translate(-90px,-100px)'; }
    }
    bFace.addEventListener('click', function(){ setPick('face'); });
    bBody.addEventListener('click', function(){ setPick('body'); });
    bBg.addEventListener('click', function(){ setPick('background'); });
    checkTaskExtra = function(){ return picked==='face'; };
  }

  var checkTaskExtra = null;

  function levelSucceededInline(){
    // used for orientation/clarity rounds which succeed via direct click, not the Check button
    if(levels[state.index].type==='orientation'){
      playSuccess();
      state.stars += 1;
      el.starCount.textContent = state.stars;
      el.mascotFace.textContent='🥳'; el.mascotFace.classList.add('happy');
      burstConfetti();
      var isLastRound = (state.round >= ORIENTATION_ROUNDS.length-1);
      if(isLastRound){
        var line = encourage[Math.floor(Math.random()*encourage.length)];
        el.speechBubble.textContent=line;
        showCelebration(line);
      } else {
        el.hintMsg.textContent='Yes! Next picture coming up! 🎉';
        el.hintMsg.className='hint-msg ok';
        setTimeout(function(){ orientationRoundAdvance(); }, 900);
      }
    } else {
      // clarity
      playSuccess();
      state.stars += 1;
      el.starCount.textContent = state.stars;
      el.mascotFace.textContent='🥳'; el.mascotFace.classList.add('happy');
      burstConfetti();
      var line2 = encourage[Math.floor(Math.random()*encourage.length)];
      el.speechBubble.textContent=line2;
      showCelebration(line2);
    }
  }

  /* ================= CHECK / SUCCEED ================= */
  function checkTask(){
    var lvl = levels[state.index];
    if(lvl.type==='gallery'){
      if(state.chosenGalleryIdx===null){
        failFeedback('Tap a picture first! 😊');
        return;
      }
      succeed();
      return;
    }
    if(lvl.type==='brightness'){
      if(state.brightness < 1.0){ failFeedback('Tap the sun button a bit more! ☀️'); return; }
      succeed(); return;
    }
    if(lvl.type==='sharpen' || lvl.type==='rotate' || lvl.type==='color' || lvl.type==='crop'){
      if(checkTaskExtra && checkTaskExtra()){ succeed(); }
      else { failFeedback('Tap the button to fix it first! 💪'); }
      return;
    }
    // orientation & clarity succeed inline via click, Check button hidden
  }

  function failFeedback(msg){
    playOops();
    el.hintMsg.textContent = msg;
    el.hintMsg.className='hint-msg err';
    el.mascotFace.textContent='🦊';
    el.speechBubble.textContent = msg;
  }

  function succeed(){
    playSuccess();
    state.stars += 1;
    el.starCount.textContent = state.stars;
    el.mascotFace.textContent='🥳'; el.mascotFace.classList.add('happy');
    burstConfetti();
    var line = encourage[Math.floor(Math.random()*encourage.length)];
    el.speechBubble.textContent = line;
    showCelebration(line);
  }

  function showCelebration(line){
    var emojis=['🎉','🌟','🥳','🎈','🚀','🏅','✨'];
    el.celebrateEmoji.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.celebrateTitle.textContent = line;
    el.celebrateMsg.textContent = (state.index===levels.length-1) ? "You finished every level!" : "Ready for the next fun level?";
    el.celebrateOverlay.classList.add('show');
  }

  el.nextBtn.addEventListener('click', function(){
    el.celebrateOverlay.classList.remove('show');
    if(state.index >= levels.length-1){ showFinal(); }
    else { state.index += 1; renderLevel(); }
  });

  function showFinal(){
    el.certName.textContent = 'Star Photographer';
    el.certStars.textContent = state.stars;
    el.finalOverlay.classList.add('show');
    burstConfetti(60);
  }

  el.restartBtn.addEventListener('click', function(){
    state.index=0; state.stars=0; state.round=0;
    el.starCount.textContent=0;
    el.finalOverlay.classList.remove('show');
    renderLevel();
  });

  /* ================= CONFETTI ================= */
  var confettiColors=['#f2555a','#ffd85c','#4fc98a','#4aa8e0','#a679e0','#ff8fc0'];
  function burstConfetti(count){
    count = count || 36;
    for(var i=0;i<count;i++){
      var p=document.createElement('div'); p.className='confetti-piece';
      var size=6+Math.random()*8;
      p.style.width=size+'px'; p.style.height=(size*0.6)+'px';
      p.style.left=(Math.random()*100)+'vw';
      p.style.background=confettiColors[Math.floor(Math.random()*confettiColors.length)];
      var dur=2.2+Math.random()*1.6;
      p.style.animationDuration=dur+'s';
      p.style.animationDelay=(Math.random()*0.3)+'s';
      el.confettiLayer.appendChild(p);
      (function(node,life){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, (life+0.5)*1000); })(p,dur);
    }
  }

  /* ================= BUTTONS ================= */
  el.checkBtn.addEventListener('click', function(){ playTap(); checkTask(); });
  el.muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    el.muteBtn.textContent = state.muted ? '🔇' : '🔊';
    if(state.muted && 'speechSynthesis' in window){ window.speechSynthesis.cancel(); }
  });

  /* ================= INIT ================= */
  buildPath();
  renderLevel();

})();
</script>
</body>
</html>
