<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>My Exam Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;

    /* ---------- Brand palette (light) — matches the parent portal ---------- */
    --teal-900:#0d3841;
    --teal-800:#124f59;
    --teal-700:#1b6b78;
    --teal-600:#227d8b;
    --teal-100:#e3eef0;
    --gold-600:#e2941a;
    --gold-500:#f5a623;
    --gold-400:#ffc65c;
    --gold-100:#fdf1dc;
    --cream:#faf8f3;
    --ink-900:#1c2626;
    --ink-500:#5f6f70;
    --white:#ffffff;

    --bg-tint-gold: rgba(245,166,35,.10);
    --bg-tint-teal: rgba(27,107,120,.10);
    --border-card: rgba(13,56,65,.08);

    /* ---------- status semantics (mirrors the portal's accent family) ---------- */
    --status-present:#4fc98a;
    --status-present-dark:#2f8f61;
    --status-absent:#f2555a;
    --status-absent-dark:#c23b41;
    --status-leave:#f5a623;
    --status-leave-dark:#b06f12;
    --status-medical:#4aa8e0;
    --status-medical-dark:#2878aa;
    --status-holiday:#9aa7a8;
    --status-blank:#e4e9ea;

    --panel-tint: var(--bg-tint-teal);
    --input-bg: color-mix(in srgb, var(--white) 97%, var(--ink-900) 3%);
    --input-border: color-mix(in srgb, var(--ink-900) 16%, transparent);
    --edge-shadow: rgba(13,56,65,.14);
    --edge-shadow-soft: rgba(13,56,65,.08);
    --track: color-mix(in srgb, var(--ink-900) 9%, transparent);

    --r-lg:26px;
    --r-md:18px;
    --r-sm:12px;
    --ease:cubic-bezier(.22,1,.36,1);

    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Manrope',system-ui,sans-serif;
  }

  html[data-theme="dark"]{
    color-scheme: dark;

    --teal-900:#092227;
    --teal-800:#8fe1ec;
    --teal-700:#5fd0de;
    --teal-600:#7fdbe6;
    --teal-100:#173338;
    --gold-600:#ffb648;
    --gold-500:#ffc65c;
    --gold-400:#ffd685;
    --gold-100:#2b2110;
    --cream:#0d1517;
    --ink-900:#eef3f2;
    --ink-500:#a4b6b7;
    --white:#182425;

    --bg-tint-gold: rgba(255,182,72,.08);
    --bg-tint-teal: rgba(95,208,222,.12);
    --border-card: rgba(255,255,255,.10);

    --status-present:#49d696;
    --status-present-dark:#8be9c4;
    --status-absent:#ff6b70;
    --status-absent-dark:#ffb0b2;
    --status-leave:#ffc65c;
    --status-leave-dark:#ffe2a8;
    --status-medical:#63bdf2;
    --status-medical-dark:#b4e0fb;
    --status-holiday:#71807f;
    --status-blank:#1f2a2c;

    --input-bg: color-mix(in srgb, var(--white) 90%, black 10%);
    --input-border: color-mix(in srgb, var(--white) 22%, transparent);
    --edge-shadow: rgba(0,0,0,.5);
    --edge-shadow-soft: rgba(0,0,0,.35);
    --track: color-mix(in srgb, var(--white) 14%, transparent);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:var(--font-body);
    color:var(--ink-900);
    background:linear-gradient(180deg,var(--bg-tint-teal) 0%, var(--cream) 55%, var(--bg-tint-gold) 100%);
    transition:background .3s var(--ease), color .3s var(--ease);
    padding:14px 14px 28px;
  }

  .wrap{max-width:760px;margin:0 auto;}

  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--border-card);
    background:var(--white);font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--edge-shadow-soft);
    display:flex;align-items:center;justify-content:center;transition:transform .15s ease;color:var(--ink-900);
    flex:0 0 auto;
  }
  .icon-btn:hover{transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--edge-shadow-soft);}
  .icon-btn:focus-visible{outline:3px solid var(--teal-600);outline-offset:2px;}

  .card{
    background:var(--white);border-radius:var(--r-lg);border:1px solid var(--border-card);
    box-shadow:0 6px 0 var(--edge-shadow-soft);padding:20px;margin-bottom:16px;
  }

  .section-title{
    font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 2px;color:var(--ink-900);
  }
  .section-sub{font-size:13px;color:var(--ink-500);margin:0 0 14px;font-weight:600;}
  .group-title{
    font-family:var(--font-display);font-weight:700;font-size:15px;margin:18px 0 10px;color:var(--ink-900);
  }
  .group-title:first-of-type{margin-top:2px;}

  /* ---------- exam tiles ---------- */
  .exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .exam-tile{
    text-align:left;border:1px solid var(--border-card);background:var(--panel-tint);
    border-radius:var(--r-md);padding:14px 14px 12px;cursor:pointer;font-family:var(--font-body);
    box-shadow:0 4px 0 var(--edge-shadow-soft);transition:transform .14s ease;
  }
  .exam-tile:hover{transform:translateY(-2px);}
  .exam-tile:active{transform:translateY(1px);box-shadow:0 1px 0 var(--edge-shadow-soft);}
  .exam-tile:focus-visible{outline:3px solid var(--teal-600);outline-offset:2px;}
  .exam-tile-name{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--ink-900);margin-bottom:6px;line-height:1.25;}
  .exam-tile-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .exam-badge{
    font-weight:800;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;
    padding:4px 10px;white-space:nowrap;
  }
  .exam-badge.common{background:color-mix(in srgb, var(--teal-600) 20%, var(--white));color:var(--teal-700);}
  html[data-theme="dark"] .exam-badge.common{color:var(--teal-800);}
  .exam-badge.custom{background:color-mix(in srgb, var(--gold-500) 22%, var(--white));color:var(--gold-600);}
  .exam-tile-mm{font-size:12px;font-weight:700;color:var(--ink-500);}
  .exam-tile-subject{font-size:11.5px;font-weight:700;color:var(--ink-500);margin-top:4px;}

  /* ---------- detail screen ---------- */
  .detail-header{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .detail-titles{min-width:0;}
  .detail-titles .section-title{word-break:break-word;}
  .detail-ring-row{display:flex;justify-content:center;margin:10px 0 18px;}
  .ring-block{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;}
  .ring-label{font-weight:700;font-size:13px;color:var(--ink-500);text-align:center;}
  .ring-svg{display:block;}
  .ring-pct{font-family:var(--font-display);font-weight:700;}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-sm);border:1px solid var(--border-card);}
  table.subject-table{width:100%;border-collapse:collapse;min-width:460px;font-size:13.5px;}
  table.subject-table th{
    text-align:left;font-size:11px;letter-spacing:.03em;text-transform:uppercase;font-weight:800;
    color:var(--ink-500);background:var(--panel-tint);padding:10px 12px;white-space:nowrap;
  }
  table.subject-table td{padding:10px 12px;border-top:1px solid var(--border-card);vertical-align:top;}
  table.subject-table tr:nth-child(even) td{background:color-mix(in srgb, var(--panel-tint) 45%, transparent);}
  .subj-cell{font-weight:700;}
  .marks-cell,.pct-cell{white-space:nowrap;font-weight:700;}
  .remark-cell{white-space:nowrap;font-weight:700;}
  .remark-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

  .component-list{margin-top:6px;display:flex;flex-direction:column;gap:3px;}
  .component-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:600;color:var(--ink-500);}
  .component-name{font-style:italic;}
  .component-score{font-weight:700;color:var(--ink-900);}

  .single-remark{
    display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;margin-top:4px;
  }
  .single-remark .remark-dot{width:10px;height:10px;}
  .single-components{max-width:260px;margin:14px auto 0;}
  .single-components .component-row{font-size:13px;}

  /* ---------- status / loading ---------- */
  .state-msg{
    text-align:center;padding:30px 12px;font-weight:700;color:var(--ink-500);font-size:14.5px;
  }
  .state-msg.err{color:var(--status-absent-dark);}
  .retry-btn{
    margin-top:10px;font-family:var(--font-body);font-weight:800;font-size:13.5px;border:none;
    border-radius:999px;padding:9px 18px;cursor:pointer;background:var(--teal-700);color:#fff;
  }
  .spinner{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--teal-600);
    margin:0 auto 10px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .hidden{display:none !important;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  @media (max-width:420px){
    .card{padding:16px;}
    .exam-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  }

  /* ---------- Track Progress additions (purely additive) ---------- */
  .group-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px;}
  .group-header:first-of-type{margin-top:2px;}
  .group-header .group-title{margin:0;}
  .track-btn{
    font-family:var(--font-body);font-weight:800;font-size:12px;letter-spacing:.01em;
    border:1px solid var(--border-card);background:var(--white);color:var(--teal-700);
    border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
    box-shadow:0 3px 0 var(--edge-shadow-soft);transition:transform .14s ease;
  }
  html[data-theme="dark"] .track-btn{color:var(--teal-800);}
  .track-btn:hover{transform:translateY(-1px);}
  .track-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--edge-shadow-soft);}
  .track-btn:focus-visible{outline:3px solid var(--teal-600);outline-offset:2px;}

  .progress-controls{display:flex;align-items:center;gap:10px;margin:4px 0 18px;flex-wrap:wrap;}
  .progress-controls label{font-size:13px;color:var(--ink-500);font-weight:700;}
  .subject-filter{
    font-family:var(--font-body);font-weight:700;font-size:13.5px;color:var(--ink-900);
    background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--r-sm);
    padding:9px 12px;cursor:pointer;min-width:170px;
  }
  .subject-filter:focus-visible{outline:3px solid var(--teal-600);outline-offset:2px;}

  .chart-wrap{position:relative;width:100%;height:300px;}
  .chart-wrap canvas{width:100% !important;height:100% !important;}
  .chart-empty-msg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:12px;font-weight:700;color:var(--ink-500);font-size:14px;
  }

  @media (max-width:420px){
    .chart-wrap{height:260px;}
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- Screen 1: list of all exams applicable to the student -->
  <div class="card" id="examListScreen">
    <h2 class="section-title">My exam results</h2>
    <p class="section-sub">Tap an exam to see your scores</p>
    <div id="examListBody">
      <div class="state-msg" id="examListState"><div class="spinner"></div>Loading your exams…</div>
    </div>
  </div>

  <!-- Screen 2: results for one selected exam -->
  <div class="card hidden" id="examDetailScreen">
    <div class="detail-header">
      <button class="icon-btn" id="backBtn" aria-label="Back to exam list">‹</button>
      <div class="detail-titles">
        <h2 class="section-title" id="detailExamName">—</h2>
        <p class="section-sub" id="detailExamMeta">&nbsp;</p>
      </div>
    </div>
    <div id="examDetailBody">
      <div class="state-msg" id="examDetailState"><div class="spinner"></div>Loading your scores…</div>
    </div>
  </div>

  <!-- Screen 3 (new, additive): progress trend across exams in a category -->
  <div class="card hidden" id="examProgressScreen">
    <div class="detail-header">
      <button class="icon-btn" id="progBackBtn" aria-label="Back to exam list">‹</button>
      <div class="detail-titles">
        <h2 class="section-title" id="progTitle">Progress</h2>
        <p class="section-sub">Your percentage trend over time</p>
      </div>
    </div>
    <div class="progress-controls hidden" id="progControls">
      <label for="progSubjectFilter">Subject</label>
      <select class="subject-filter" id="progSubjectFilter">
        <option value="__all__">All subjects (overall)</option>
      </select>
    </div>
    <div class="chart-wrap hidden" id="progChartWrap">
      <canvas id="progChartCanvas"></canvas>
      <div class="chart-empty-msg hidden" id="progChartEmptyMsg"></div>
    </div>
    <div class="state-msg" id="progState"><div class="spinner"></div>Loading your progress…</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     Multi-tenant credentials — provided as-is, do not modify.
  ============================================================ */
  var SUPABASE_URL, SUPABASE_ANON_KEY;
  (function(){
    var institutionId = localStorage.getItem('gsms_last_institution_id');
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem('cp_institution_' + institutionId)); } catch(e) {}

    if (!cached || !cached.data || !cached.data.supabase_url || !cached.data.supabase_anon_key) {
      window.location.href = 'https://educational-saas.github.io/'; // no credentials on record — back to login
      throw new Error('Redirecting to sign-in.');
    }
    SUPABASE_URL = cached.data.supabase_url;
    SUPABASE_ANON_KEY = cached.data.supabase_anon_key;
  })();

  var AUTH_REDIRECT = 'https://educational-saas.github.io/'; // If user not already logged in or does not have a "student" role

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Theme is controlled entirely by the parent page, which sets
  // data-theme="light" | "dark" on <html>. This page's CSS already
  // keys off html[data-theme="dark"], so nothing else is needed here.

  /* ============================================================
     Helpers
  ============================================================ */
  var STATUS_LABELS = { P:'Present', AB:'Absent', L:'On leave', ML:'Medical leave' };
  var NON_PRESENT_COLOR = {
    AB: 'var(--status-absent-dark)',
    L: 'var(--status-leave-dark)',
    ML: 'var(--status-medical-dark)'
  };

  function escapeHtml(s){
    return String(s==null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function remarkTier(pct){
    if(pct >= 90) return {label:'Outstanding performance', cls:'remark-outstanding', color:'var(--status-present-dark)'};
    if(pct >= 75) return {label:'Very good performance', cls:'remark-verygood', color:'var(--teal-700)'};
    if(pct >= 50) return {label:'Good performance', cls:'remark-good', color:'var(--status-leave-dark)'};
    return {label:'Needs hard work', cls:'remark-hardwork', color:'var(--status-absent-dark)'};
  }

  // Resolves the display remark + color + percentage for one marks row.
  function remarkFor(row, mm){
    if(row.status !== 'P'){
      return {
        pct: null,
        label: STATUS_LABELS[row.status] || row.status,
        color: NON_PRESENT_COLOR[row.status] || 'var(--ink-500)'
      };
    }
    if(mm == null || row.marks_obtained == null){
      return {pct:null, label:'—', color:'var(--ink-500)'};
    }
    var pct = (row.marks_obtained / mm) * 100;
    var tier = remarkTier(pct);
    return {pct:pct, label:tier.label, color:tier.color};
  }

  function ringSVG(pct, label, size){
    size = size || 132;
    var stroke = 12;
    var r = (size - stroke) / 2;
    var c = 2 * Math.PI * r;
    var tierColor = pct === null ? 'var(--ink-500)' : remarkTier(pct).color;
    var dash = pct === null ? 0 : (pct/100) * c;
    var displayPct = pct === null ? '—' : Math.round(pct) + '%';
    return ''
      + '<div class="ring-block">'
      + '<svg class="ring-svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+stroke+'"/>'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+tierColor+'" stroke-width="'+stroke+'" '
      +   'stroke-linecap="round" stroke-dasharray="'+dash.toFixed(1)+' '+c.toFixed(1)+'" '
      +   'transform="rotate(-90 '+size/2+' '+size/2+')"/>'
      + '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ring-pct" '
      +   'font-size="'+Math.round(size*0.22)+'" fill="'+tierColor+'">'+displayPct+'</text>'
      + '</svg>'
      + '<span class="ring-label">'+escapeHtml(label)+'</span>'
      + '</div>';
  }

  function componentsHTML(components, componentMarks, compact){
    if(!components || !Array.isArray(components) || components.length === 0) return '';
    var rows = components.map(function(comp){
      var score = componentMarks && componentMarks[comp.name] != null ? componentMarks[comp.name] : null;
      return '<div class="component-row"><span class="component-name">'+escapeHtml(comp.name)+'</span>'
        + '<span class="component-score">'+(score==null?'—':score)+' / '+comp.mm+'</span></div>';
    }).join('');
    return '<div class="'+(compact?'component-list':'single-components')+'">'+rows+'</div>';
  }

  /* ============================================================
     App state
  ============================================================ */
  var state = {
    masterId: null,
    studentClass: null,
    tiles: [],               // merged list of common + custom exam tiles
    subjectOrder: null,      // subject name -> display_order (best-effort)
    examCache: {},           // examKey -> marks rows
    progressCache: {},               // category -> progress rows (additive)
    currentProgressCategory: null,   // additive
    currentProgressRows: null,       // additive
    currentProgressSelectedSubject: null // additive
  };

  /* ============================================================
     Auth + identity resolution
  ============================================================ */
  async function init(){
    try{
      var sessionRes = await supabase.auth.getSession();
      var session = sessionRes && sessionRes.data ? sessionRes.data.session : null;
      if(!session){ window.location.href = AUTH_REDIRECT; return; }

      var uid = session.user.id;

      var studentRes = await supabase.from('students')
        .select('name, master_token')
        .eq('id', uid)
        .maybeSingle();

      if(studentRes.error || !studentRes.data || !studentRes.data.master_token){
        window.location.href = AUTH_REDIRECT; return;
      }

      var masterRes = await supabase.from('students_master')
        .select('id, class')
        .eq('token', studentRes.data.master_token)
        .maybeSingle();

      if(masterRes.error || !masterRes.data){
        showExamListError('We could not find your student record.');
        return;
      }

      state.masterId = masterRes.data.id;
      state.studentClass = masterRes.data.class;

      loadSubjectOrder(); // best-effort, non-blocking
      await loadExamList();
    } catch(e){
      showExamListError('Something went wrong loading your exams.');
    }
  }

  // Fetched once, used only to sort subject columns sensibly. Never
  // blocks rendering if it fails or is slow.
  async function loadSubjectOrder(){
    try{
      var res = await supabase.from('subjects').select('name, display_order');
      if(res.error || !res.data) return;
      var map = {};
      res.data.forEach(function(s){ map[s.name] = s.display_order; });
      state.subjectOrder = map;
    } catch(e){ /* ignore — alphabetical fallback is fine */ }
  }

  /* ============================================================
     Exam list — only the columns needed for the tiles.
  ============================================================ */
  async function loadExamList(){
    document.getElementById('examListBody').innerHTML =
      '<div class="state-msg" id="examListState"><div class="spinner"></div>Loading your exams…</div>';
    try{
      var cls = state.studentClass;

      var commonReq = supabase.from('exam_classes')
        .select('exam, exams(name, mm, components, added_at)')
        .eq('class', cls);

      var customReq = supabase.from('custom_exams')
        .select('id, name, subject, mm, components, created_at')
        .eq('class', cls)
        .order('created_at', {ascending:false});

      var results = await Promise.all([commonReq, customReq]);
      var commonRes = results[0], customRes = results[1];
      if(commonRes.error) throw commonRes.error;
      if(customRes.error) throw customRes.error;

      var tiles = [];

      (commonRes.data || []).forEach(function(row){
        if(!row.exams) return;
        tiles.push({
          type: 'common',
          key: 'E:' + row.exams.name,
          examName: row.exams.name,
          name: row.exams.name,
          mm: row.exams.mm,
          components: row.exams.components,
          sortAt: row.exams.added_at // additive — used only by the progress-tracking feature
        });
      });

      (customRes.data || []).forEach(function(row){
        tiles.push({
          type: 'custom',
          key: 'C:' + row.id,
          customExamId: row.id,
          name: row.name,
          subject: row.subject,
          mm: row.mm,
          components: row.components,
          sortAt: row.created_at // additive — used only by the progress-tracking feature
        });
      });

      tiles.sort(function(a,b){ return a.name.localeCompare(b.name); });
      state.tiles = tiles;
      renderExamList();
    } catch(e){
      showExamListError('Could not load your exams.');
    }
  }

  function renderExamList(){
    var common = state.tiles.filter(function(t){ return t.type === 'common'; });
    var custom = state.tiles.filter(function(t){ return t.type === 'custom'; });

    if(common.length === 0 && custom.length === 0){
      document.getElementById('examListBody').innerHTML =
        '<div class="state-msg">No exams have been set up for your class yet.</div>';
      return;
    }

    function tileHtml(t){
      var mmText = t.mm ? ('MM ' + t.mm) : 'MM —';
      var badge = t.type === 'common'
        ? '<span class="exam-badge common">School-wide</span>'
        : '<span class="exam-badge custom">Class test</span>';
      var subjectLine = t.type === 'custom'
        ? '<div class="exam-tile-subject">'+escapeHtml(t.subject)+'</div>'
        : '';
      return '<button type="button" class="exam-tile" data-key="'+escapeHtml(t.key)+'">'
        + '<div class="exam-tile-name">'+escapeHtml(t.name)+'</div>'
        + '<div class="exam-tile-meta">'+badge+'<span class="exam-tile-mm">'+mmText+'</span></div>'
        + subjectLine
        + '</button>';
    }

    var html = '';
    if(common.length){
      html += '<div class="group-header"><h3 class="group-title">School-wide exams</h3>'
        + '<button type="button" class="track-btn" data-category="common">Track Progress</button></div>'
        + '<div class="exam-grid">' + common.map(tileHtml).join('') + '</div>';
    }
    if(custom.length){
      html += '<div class="group-header"><h3 class="group-title">Class tests &amp; quizzes</h3>'
        + '<button type="button" class="track-btn" data-category="custom">Track Progress</button></div>'
        + '<div class="exam-grid">' + custom.map(tileHtml).join('') + '</div>';
    }

    document.getElementById('examListBody').innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll('.exam-tile'), function(btn){
      btn.addEventListener('click', function(){
        var tile = state.tiles.filter(function(t){ return t.key === btn.getAttribute('data-key'); })[0];
        if(tile) openExam(tile);
      });
    });

    // additive — wires up the new "Track Progress" buttons
    Array.prototype.forEach.call(document.querySelectorAll('.track-btn'), function(btn){
      btn.addEventListener('click', function(){
        openProgress(btn.getAttribute('data-category'));
      });
    });
  }

  function showExamListError(msg){
    document.getElementById('examListBody').innerHTML =
      '<div class="state-msg err">'+escapeHtml(msg)+'<br><button class="retry-btn" id="retryExamList">Try again</button></div>';
    var btn = document.getElementById('retryExamList');
    if(btn) btn.addEventListener('click', loadExamList);
  }

  /* ============================================================
     Exam detail — fetched (and cached) only when a tile is tapped.
  ============================================================ */
  function openExam(tile){
    document.getElementById('examListScreen').classList.add('hidden');
    document.getElementById('examDetailScreen').classList.remove('hidden');
    document.getElementById('detailExamName').textContent = tile.name;
    document.getElementById('detailExamMeta').textContent =
      (tile.type === 'common' ? 'School-wide exam' : 'Class test · ' + tile.subject)
      + (tile.mm ? ' · MM ' + tile.mm : '');

    if(state.examCache[tile.key]){
      renderExamDetail(tile, state.examCache[tile.key]);
      return;
    }
    loadExamDetail(tile);
  }

  async function loadExamDetail(tile){
    document.getElementById('examDetailBody').innerHTML =
      '<div class="state-msg" id="examDetailState"><div class="spinner"></div>Loading your scores…</div>';
    try{
      var query = supabase.from('marks')
        .select('subject, status, marks_obtained, component_marks')
        .eq('student_id', state.masterId);

      query = tile.type === 'common'
        ? query.eq('exam_name', tile.examName)
        : query.eq('custom_exam_id', tile.customExamId);

      var res = await query;
      if(res.error) throw res.error;

      state.examCache[tile.key] = res.data || [];
      renderExamDetail(tile, state.examCache[tile.key]);
    } catch(e){
      showExamDetailError(tile, 'Could not load your scores for this exam.');
    }
  }

  function renderExamDetail(tile, rows){
    if(!rows || rows.length === 0){
      document.getElementById('examDetailBody').innerHTML =
        '<div class="state-msg">No marks have been entered for this exam yet.</div>';
      return;
    }

    if(tile.type === 'custom'){
      renderCustomDetail(tile, rows[0]);
    } else {
      renderCommonDetail(tile, rows);
    }
  }

  function renderCustomDetail(tile, row){
    var remark = remarkFor(row, tile.mm);
    var ring = ringSVG(remark.pct, tile.subject);
    var scoreLine = row.status === 'P'
      ? (row.marks_obtained == null || !tile.mm ? '' : '<div class="section-sub" style="text-align:center;margin-top:-6px;">'+row.marks_obtained+' out of '+tile.mm+'</div>')
      : '';
    var comps = row.status === 'P' ? componentsHTML(tile.components, row.component_marks, false) : '';

    var html = '<div class="detail-ring-row">'+ring+'</div>'
      + scoreLine
      + comps
      + '<div class="single-remark"><span class="remark-dot" style="background:'+remark.color+'"></span>'
      + '<span style="color:'+remark.color+'">'+escapeHtml(remark.label)+'</span></div>';

    document.getElementById('examDetailBody').innerHTML = html;
  }

  function renderCommonDetail(tile, rows){
    var subjectOrder = state.subjectOrder;
    var sorted = rows.slice().sort(function(a,b){
      var oa = subjectOrder && subjectOrder[a.subject] != null ? subjectOrder[a.subject] : 9999;
      var ob = subjectOrder && subjectOrder[b.subject] != null ? subjectOrder[b.subject] : 9999;
      if(oa !== ob) return oa - ob;
      return a.subject.localeCompare(b.subject);
    });

    var mm = tile.mm;
    var sumObtained = 0, sumMm = 0;

    var bodyRows = sorted.map(function(row){
      var remark = remarkFor(row, mm);
      if(remark.pct !== null){ sumObtained += row.marks_obtained; sumMm += mm; }

      var marksDisplay = row.status === 'P'
        ? (row.marks_obtained == null ? '—' : row.marks_obtained + (mm ? ' / ' + mm : ''))
        : '—';
      var pctDisplay = remark.pct === null ? '—' : Math.round(remark.pct) + '%';
      var comps = row.status === 'P' ? componentsHTML(tile.components, row.component_marks, true) : '';

      return '<tr>'
        + '<td class="subj-cell">'+escapeHtml(row.subject)+comps+'</td>'
        + '<td class="marks-cell">'+marksDisplay+'</td>'
        + '<td class="pct-cell">'+pctDisplay+'</td>'
        + '<td class="remark-cell"><span class="remark-dot" style="background:'+remark.color+'"></span>'
        + '<span style="color:'+remark.color+'">'+escapeHtml(remark.label)+'</span></td>'
        + '</tr>';
    }).join('');

    var totalPct = sumMm > 0 ? (sumObtained / sumMm) * 100 : null;
    var ring = ringSVG(totalPct, 'Overall');

    var html = '<div class="detail-ring-row">'+ring+'</div>'
      + '<div class="table-scroll"><table class="subject-table">'
      + '<thead><tr><th>Subject</th><th>Marks</th><th>%</th><th>Remark</th></tr></thead>'
      + '<tbody>'+bodyRows+'</tbody>'
      + '</table></div>';

    document.getElementById('examDetailBody').innerHTML = html;
  }

  function showExamDetailError(tile, msg){
    document.getElementById('examDetailBody').innerHTML =
      '<div class="state-msg err">'+escapeHtml(msg)+'<br><button class="retry-btn" id="retryExamDetail">Try again</button></div>';
    var btn = document.getElementById('retryExamDetail');
    if(btn) btn.addEventListener('click', function(){ loadExamDetail(tile); });
  }

  document.getElementById('backBtn').addEventListener('click', function(){
    document.getElementById('examDetailScreen').classList.add('hidden');
    document.getElementById('examListScreen').classList.remove('hidden');
  });

  /* ============================================================
     ADDITIVE — Screen 3: Track Progress (line chart of % across exams)
     Everything below is new and does not alter anything above.
  ============================================================ */
  var ALL_SUBJECTS = '__all__';
  var progressChart = null;

  // Primary path: a single, lean RPC call (security invoker — honours
  // existing RLS) that returns only the columns needed to plot the
  // trend, already filtered to Present/scored rows and sorted oldest
  // → newest. See the accompanying SQL for get_student_exam_progress.
  // Fallback path: if the RPC hasn't been created yet, we derive the
  // same shape from a single lightweight 'marks' query plus the
  // exam metadata already sitting in state.tiles (no extra round trip).
  async function fetchProgressRows(category){
    if(state.progressCache[category]) return state.progressCache[category];

    var rows;
    try{
      var res = await supabase.rpc('get_student_exam_progress', {
        p_student_id: state.masterId,
        p_category: category
      });
      if(res.error) throw res.error;
      rows = res.data || [];
    } catch(e){
      rows = await fetchProgressRowsFallback(category);
    }

    state.progressCache[category] = rows;
    return rows;
  }

  async function fetchProgressRowsFallback(category){
    var prefix = category === 'common' ? 'E:' : 'C:';
    var res = await supabase.from('marks')
      .select('exam_key, subject, marks_obtained')
      .eq('student_id', state.masterId)
      .eq('status', 'P')
      .like('exam_key', prefix + '%');

    if(res.error) throw res.error;

    var tileByKey = {};
    state.tiles.forEach(function(t){ tileByKey[t.key] = t; });

    var rows = (res.data || []).map(function(r){
      var t = tileByKey[r.exam_key];
      if(!t || !t.mm || !t.sortAt || r.marks_obtained == null) return null;
      return {
        exam_key: r.exam_key,
        exam_name: t.name,
        subject: r.subject,
        marks_obtained: r.marks_obtained,
        mm: t.mm,
        sort_at: t.sortAt
      };
    }).filter(function(r){ return r && r.mm > 0; });

    rows.sort(function(a,b){ return new Date(a.sort_at) - new Date(b.sort_at); });
    return rows;
  }

  async function openProgress(category){
    document.getElementById('examListScreen').classList.add('hidden');
    document.getElementById('examProgressScreen').classList.remove('hidden');
    document.getElementById('progTitle').textContent =
      category === 'common' ? 'Progress · School-wide exams' : 'Progress · Class tests & quizzes';

    state.currentProgressCategory = category;
    showProgressState('<div class="spinner"></div>Loading your progress…');

    try{
      var rows = await fetchProgressRows(category);
      state.currentProgressRows = rows;

      if(!rows || rows.length === 0){
        showProgressState('No scored exams available yet to plot progress.');
        return;
      }

      var subjects = [];
      var seen = {};
      rows.forEach(function(r){
        if(!seen[r.subject]){ seen[r.subject] = true; subjects.push(r.subject); }
      });
      subjects.sort(function(a,b){
        var order = state.subjectOrder;
        var oa = order && order[a] != null ? order[a] : 9999;
        var ob = order && order[b] != null ? order[b] : 9999;
        if(oa !== ob) return oa - ob;
        return a.localeCompare(b);
      });
      populateSubjectFilter(subjects);

      state.currentProgressSelectedSubject = ALL_SUBJECTS;
      hideProgressState();
      renderProgressChart(rows, ALL_SUBJECTS);
    } catch(e){
      showProgressError('Could not load your progress.');
    }
  }

  function populateSubjectFilter(subjects){
    var sel = document.getElementById('progSubjectFilter');
    var html = '<option value="'+ALL_SUBJECTS+'">All subjects (overall)</option>';
    subjects.forEach(function(s){
      html += '<option value="'+escapeHtml(s)+'">'+escapeHtml(s)+'</option>';
    });
    sel.innerHTML = html;
    sel.value = ALL_SUBJECTS;
  }

  function renderProgressChart(rows, selectedSubject){
    var examOrder = [];   // [{key, name}] in chronological order
    var seenExam = {};
    var examSubjMap = {}; // exam_key -> {subject: pct}

    rows.forEach(function(r){
      if(!seenExam[r.exam_key]){
        seenExam[r.exam_key] = true;
        examOrder.push({key: r.exam_key, name: r.exam_name});
        examSubjMap[r.exam_key] = {};
      }
      examSubjMap[r.exam_key][r.subject] = (r.marks_obtained / r.mm) * 100;
    });

    var labels = [];
    var values = [];

    if(selectedSubject === ALL_SUBJECTS){
      examOrder.forEach(function(e){
        var subjPcts = examSubjMap[e.key];
        var keys = Object.keys(subjPcts);
        if(keys.length === 0) return;
        var sum = 0;
        keys.forEach(function(s){ sum += subjPcts[s]; });
        labels.push(e.name);
        values.push(sum / keys.length);
      });
    } else {
      examOrder.forEach(function(e){
        var subjPcts = examSubjMap[e.key];
        if(subjPcts[selectedSubject] == null) return;
        labels.push(e.name);
        values.push(subjPcts[selectedSubject]);
      });
    }

    var emptyMsg = document.getElementById('progChartEmptyMsg');
    var canvas = document.getElementById('progChartCanvas');

    if(labels.length === 0){
      emptyMsg.textContent = 'No scored results for this subject yet.';
      emptyMsg.classList.remove('hidden');
      canvas.classList.add('hidden');
      if(progressChart){ progressChart.destroy(); progressChart = null; }
      return;
    }

    emptyMsg.classList.add('hidden');
    canvas.classList.remove('hidden');
    drawChart(labels, values);
  }

  function tierColorForPct(pct){
    var css = getComputedStyle(document.documentElement);
    if(pct >= 90) return css.getPropertyValue('--status-present-dark').trim();
    if(pct >= 75) return css.getPropertyValue('--teal-700').trim();
    if(pct >= 50) return css.getPropertyValue('--status-leave-dark').trim();
    return css.getPropertyValue('--status-absent-dark').trim();
  }

  function drawChart(labels, values){
    var canvas = document.getElementById('progChartCanvas');
    var css = getComputedStyle(document.documentElement);
    var textColor = css.getPropertyValue('--ink-500').trim();
    var gridColor = css.getPropertyValue('--track').trim();
    var lineColor = css.getPropertyValue('--teal-600').trim();
    var fillColor = css.getPropertyValue('--bg-tint-teal').trim();
    var pointColors = values.map(tierColorForPct);

    if(progressChart){ progressChart.destroy(); progressChart = null; }

    progressChart = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          fill: true,
          tension: 0.35,
          borderWidth: 3,
          borderColor: lineColor,
          backgroundColor: fillColor,
          pointRadius: 5,
          pointHoverRadius: 7,
          pointBackgroundColor: pointColors,
          pointBorderColor: css.getPropertyValue('--white').trim(),
          pointBorderWidth: 2,
          segment: {
            borderColor: function(ctx){
              var avg = (ctx.p0.parsed.y + ctx.p1.parsed.y) / 2;
              return tierColorForPct(avg);
            }
          }
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 450 },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx){ return Math.round(ctx.parsed.y) + '%'; }
            }
          }
        },
        scales: {
          y: {
            min: 0, max: 100,
            ticks: { color: textColor, stepSize: 20, callback: function(v){ return v + '%'; } },
            grid: { color: gridColor }
          },
          x: {
            ticks: { color: textColor, autoSkip: true, maxRotation: 40, minRotation: 0 },
            grid: { display: false }
          }
        }
      }
    });
  }

  function showProgressState(html){
    document.getElementById('progControls').classList.add('hidden');
    document.getElementById('progChartWrap').classList.add('hidden');
    var s = document.getElementById('progState');
    s.className = 'state-msg';
    s.innerHTML = html;
  }

  function showProgressError(msg){
    showProgressState(escapeHtml(msg) + '<br><button class="retry-btn" id="progRetryBtn">Try again</button>');
    document.getElementById('progState').classList.add('err');
    var btn = document.getElementById('progRetryBtn');
    if(btn) btn.addEventListener('click', function(){ openProgress(state.currentProgressCategory); });
  }

  function hideProgressState(){
    document.getElementById('progState').innerHTML = '';
    document.getElementById('progState').className = 'state-msg hidden';
    document.getElementById('progControls').classList.remove('hidden');
    document.getElementById('progChartWrap').classList.remove('hidden');
  }

  document.getElementById('progBackBtn').addEventListener('click', function(){
    document.getElementById('examProgressScreen').classList.add('hidden');
    document.getElementById('examListScreen').classList.remove('hidden');
  });

  document.getElementById('progSubjectFilter').addEventListener('change', function(){
    state.currentProgressSelectedSubject = this.value;
    if(state.currentProgressRows){
      renderProgressChart(state.currentProgressRows, this.value);
    }
  });

  // Keep the chart's colours in sync if the parent page flips the
  // theme while the progress screen is open — redraw is free (no
  // network call), it just reuses the already-fetched rows.
  var progressThemeObserver = new MutationObserver(function(){
    if(progressChart && state.currentProgressRows){
      renderProgressChart(state.currentProgressRows, state.currentProgressSelectedSubject || ALL_SUBJECTS);
    }
  });
  progressThemeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  init();
})();
</script>
</body>
</html>
