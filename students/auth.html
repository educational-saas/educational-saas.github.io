<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Student Sign-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --teal-900:#0d3841; --teal-800:#124f59; --teal-700:#1b6b78; --teal-600:#227d8b; --teal-100:#e3eef0;
    --gold-600:#e2941a; --gold-500:#f5a623; --gold-400:#ffc65c; --gold-100:#fdf1dc;
    --cream:#faf8f3; --ink-900:#1c2626; --ink-500:#5f6f70; --white:#ffffff;
    --bg-tint-gold: rgba(245,166,35,.10); --bg-tint-teal: rgba(27,107,120,.10); --border-card: rgba(13,56,65,.08);
    --status-present:#4fc98a; --status-present-dark:#2f8f61;
    --status-absent:#f2555a; --status-absent-dark:#c23b41;
    --status-leave:#f5a623; --status-leave-dark:#b06f12;
    --panel-tint: var(--bg-tint-teal);
    --edge-shadow: rgba(13,56,65,.14); --edge-shadow-soft: rgba(13,56,65,.08);
    --track: color-mix(in srgb, var(--ink-900) 9%, transparent);
    --r-lg:26px; --r-md:18px; --r-sm:12px; --ease:cubic-bezier(.22,1,.36,1);
    --font-display:'Fraunces',Georgia,serif; --font-body:'Manrope',system-ui,sans-serif;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --teal-900:#092227; --teal-800:#8fe1ec; --teal-700:#5fd0de; --teal-600:#7fdbe6; --teal-100:#173338;
    --gold-600:#ffb648; --gold-500:#ffc65c; --gold-400:#ffd685; --gold-100:#2b2110;
    --cream:#0d1517; --ink-900:#eef3f2; --ink-500:#a4b6b7; --white:#182425;
    --bg-tint-gold: rgba(255,182,72,.08); --bg-tint-teal: rgba(95,208,222,.12); --border-card: rgba(255,255,255,.10);
    --status-present:#49d696; --status-present-dark:#8be9c4;
    --status-absent:#ff6b70; --status-absent-dark:#ffb0b2;
    --status-leave:#ffc65c; --status-leave-dark:#ffe2a8;
    --edge-shadow: rgba(0,0,0,.5); --edge-shadow-soft: rgba(0,0,0,.35);
    --track: color-mix(in srgb, var(--white) 14%, transparent);
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      color-scheme: dark;
      --teal-900:#092227; --teal-800:#8fe1ec; --teal-700:#5fd0de; --teal-600:#7fdbe6; --teal-100:#173338;
      --gold-600:#ffb648; --gold-500:#ffc65c; --gold-400:#ffd685; --gold-100:#2b2110;
      --cream:#0d1517; --ink-900:#eef3f2; --ink-500:#a4b6b7; --white:#182425;
      --bg-tint-gold: rgba(255,182,72,.08); --bg-tint-teal: rgba(95,208,222,.12); --border-card: rgba(255,255,255,.10);
      --status-present:#49d696; --status-present-dark:#8be9c4;
      --status-absent:#ff6b70; --status-absent-dark:#ffb0b2;
      --status-leave:#ffc65c; --status-leave-dark:#ffe2a8;
      --edge-shadow: rgba(0,0,0,.5); --edge-shadow-soft: rgba(0,0,0,.35);
      --track: color-mix(in srgb, var(--white) 14%, transparent);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; font-family:var(--font-body); color:var(--ink-900);
    background:linear-gradient(180deg,var(--bg-tint-teal) 0%, var(--cream) 55%, var(--bg-tint-gold) 100%);
    transition:background .3s var(--ease), color .3s var(--ease); padding:14px 14px 28px;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{max-width:420px;width:100%;margin:0 auto;}
  .card{
    background:var(--white);border-radius:var(--r-lg);border:1px solid var(--border-card);
    box-shadow:0 6px 0 var(--edge-shadow-soft);padding:28px 24px;text-align:center;
  }
  .logo{
    width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;
    border:1px solid var(--border-card);background:var(--panel-tint);
  }
  .section-title{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 6px;color:var(--ink-900);}
  .section-sub{font-size:13px;color:var(--ink-500);margin:0;font-weight:600;line-height:1.5;}
  .state-msg{padding:30px 6px 6px;font-weight:700;color:var(--ink-500);font-size:14.5px;}
  .state-msg.err{color:var(--status-absent-dark);}
  .state-msg.ok{color:var(--status-present-dark);}
  .retry-btn{
    margin-top:14px;font-family:var(--font-body);font-weight:800;font-size:13.5px;border:none;
    border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--teal-700);color:#fff;
  }
  .spinner{
    width:30px;height:30px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--teal-600);
    margin:0 auto 14px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <img class="logo hidden" id="institutionLogo" alt="">
    <h2 class="section-title" id="institutionName">Student Sign-in</h2>
    <p class="section-sub" id="statusText">Reading your QR code…</p>
    <div id="stateArea">
      <div class="state-msg" id="loadingState"><div class="spinner"></div>Signing you in…</div>
    </div>
  </div>
</div>

<script type="module">
  import {
    getInstitutionInfo,
  } from 'https://educational-saas.github.io/commons/control-plane.js';
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

  "use strict";

  var DASHBOARD_URL = 'https://educational-saas.github.io/students/';
  var SIGNIN_URL = 'https://educational-saas.github.io/';

  var stateArea = document.getElementById('stateArea');
  var statusText = document.getElementById('statusText');
  var institutionName = document.getElementById('institutionName');
  var institutionLogo = document.getElementById('institutionLogo');

  function showLoading(msg){
    statusText.textContent = msg || 'Signing you in…';
    stateArea.innerHTML = '<div class="state-msg" id="loadingState"><div class="spinner"></div>'
      + (msg || 'Signing you in…') + '</div>';
  }

  function showError(msg, opts){
    opts = opts || {};
    stateArea.innerHTML = '<div class="state-msg err">' + msg
      + (opts.retry ? '<br><button class="retry-btn" id="retryBtn">Try again</button>' : '')
      + '</div>';
    if (opts.retry) {
      document.getElementById('retryBtn').addEventListener('click', opts.retry);
    }
  }

  function showSuccess(msg){
    stateArea.innerHTML = '<div class="state-msg ok"><div class="spinner"></div>' + msg + '</div>';
  }

  function parseHashParams(){
    var hash = window.location.hash.replace(/^#/, '');
    var params = new URLSearchParams(hash);
    return {
      token: params.get('token'),
      iId: params.get('i_id'),
    };
  }

  // Parsed once, from the URL, on first load — and reused on every retry.
  // We strip the hash from the visible URL right after this first read (see
  // below) so it doesn't linger in browser history, but that means a retry
  // can't just re-read location.hash a second time: it has to reuse this
  // cached copy instead, or "Try again" would itself fail with a bogus
  // "link looks incomplete" error.
  var cachedParsed = null;

  async function run(){
    var parsed = cachedParsed;

    if (!parsed) {
      parsed = parseHashParams();

      if (!parsed.token || !parsed.iId) {
        showError('This sign-in link looks incomplete. Please scan your QR code again, or ask your teacher for a new one.');
        return;
      }

      cachedParsed = parsed;

      // Clear the token from the visible URL/history as soon as we've read
      // it, so it doesn't linger in browser history or get accidentally
      // shared via a screenshot of the address bar on a shared device.
      try {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      } catch (e) { /* non-fatal */ }
    }

    var institutionInfo, supabaseUrl, supabaseAnonKey;
    try {
      showLoading('Finding your school…');
      institutionInfo = await getInstitutionInfo(parsed.iId);
      supabaseUrl = institutionInfo.supabase_url;
      supabaseAnonKey = institutionInfo.supabase_anon_key;
      if (!supabaseUrl || !supabaseAnonKey) throw new Error('Incomplete institution record.');

      var displayName = institutionInfo.full_name || institutionInfo.short_name;
      if (displayName) institutionName.textContent = displayName;
      var logo = institutionInfo.logo_transparent_url || institutionInfo.logo_url;
      if (logo) {
        institutionLogo.src = logo;
        institutionLogo.alt = displayName || '';
        institutionLogo.classList.remove('hidden');
      }

      // So in-app pages (which read 'gsms_last_institution_id') work after we
      // hand off to the dashboard.
      try { localStorage.setItem('gsms_last_institution_id', String(parsed.iId)); } catch (e) {}
    } catch (e) {
      showError('We couldn\'t find your school. Please scan your QR code again.', { retry: run });
      return;
    }

    var supabase = createClient(supabaseUrl, supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
    });

    // Already signed in on this device as this same student? Skip straight
    // to the dashboard instead of re-running the whole exchange.
    try {
      var existing = await supabase.auth.getSession();
      if (existing && existing.data && existing.data.session) {
        showSuccess('Welcome back! Taking you to your dashboard…');
        window.location.href = DASHBOARD_URL;
        return;
      }
    } catch (e) { /* fall through to normal sign-in */ }

    try {
      showLoading('Signing you in…');

      var functionsUrl = supabaseUrl.replace(/\/$/, '') + '/functions/v1/qr-login';
      var res = await fetch(functionsUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': supabaseAnonKey,
        },
        body: JSON.stringify({ token: parsed.token }),
      });

      var payload = null;
      try { payload = await res.json(); } catch (e) {}

      if (!res.ok || !payload || !payload.token_hash || !payload.email) {
        var message = (payload && payload.error) || 'We couldn\'t sign you in right now.';
        showError(message + ' Please ask your teacher for help.', { retry: run });
        return;
      }

      // token_hash-based verification is its own request shape: {token_hash,
      // type} only. Adding `email` here pushes the request down Supabase's
      // email+code (6-digit OTP) verification path instead, which then
      // reports back "expired or invalid" regardless of whether the hash
      // itself is actually fine — that was the real bug.
      var verifyRes = await supabase.auth.verifyOtp({
        token_hash: payload.token_hash,
        type: payload.verification_type || 'email',
      });

      if (verifyRes.error || !verifyRes.data || !verifyRes.data.session) {
        console.error('verifyOtp failed:', verifyRes.error);
        showError('Your sign-in link has expired. Please scan your QR code again.', { retry: run });
        return;
      }

      showSuccess('You\'re signed in! Taking you to your dashboard…');
      window.location.href = DASHBOARD_URL;
    } catch (e) {
      showError('Something went wrong. Please try again.', { retry: run });
    }
  }

  run();
</script>
</body>
</html>
