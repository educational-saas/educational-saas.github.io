<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>My Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;

    /* ---------- Brand palette (light) — matches the parent portal ---------- */
    --teal-900:#0d3841;
    --teal-800:#124f59;
    --teal-700:#1b6b78;
    --teal-600:#227d8b;
    --teal-100:#e3eef0;
    --gold-600:#e2941a;
    --gold-500:#f5a623;
    --gold-400:#ffc65c;
    --gold-100:#fdf1dc;
    --cream:#faf8f3;
    --ink-900:#1c2626;
    --ink-500:#5f6f70;
    --white:#ffffff;

    --bg-tint-gold: rgba(245,166,35,.10);
    --bg-tint-teal: rgba(27,107,120,.10);
    --border-card: rgba(13,56,65,.08);

    /* ---------- status semantics (mirrors the portal's accent family) ---------- */
    --status-present:#4fc98a;
    --status-present-dark:#2f8f61;
    --status-absent:#f2555a;
    --status-absent-dark:#c23b41;
    --status-leave:#f5a623;
    --status-leave-dark:#b06f12;
    --status-medical:#4aa8e0;
    --status-medical-dark:#2878aa;
    --status-holiday:#9aa7a8;
    --status-blank:#e4e9ea;

    --panel-tint: var(--bg-tint-teal);
    --input-bg: color-mix(in srgb, var(--white) 97%, var(--ink-900) 3%);
    --input-border: color-mix(in srgb, var(--ink-900) 16%, transparent);
    --edge-shadow: rgba(13,56,65,.14);
    --edge-shadow-soft: rgba(13,56,65,.08);
    --track: color-mix(in srgb, var(--ink-900) 9%, transparent);

    --r-lg:26px;
    --r-md:18px;
    --r-sm:12px;
    --ease:cubic-bezier(.22,1,.36,1);

    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Manrope',system-ui,sans-serif;
  }

  html[data-theme="dark"]{
    color-scheme: dark;

    --teal-900:#092227;
    --teal-800:#8fe1ec;
    --teal-700:#5fd0de;
    --teal-600:#7fdbe6;
    --teal-100:#173338;
    --gold-600:#ffb648;
    --gold-500:#ffc65c;
    --gold-400:#ffd685;
    --gold-100:#2b2110;
    --cream:#0d1517;
    --ink-900:#eef3f2;
    --ink-500:#a4b6b7;
    --white:#182425;

    --bg-tint-gold: rgba(255,182,72,.08);
    --bg-tint-teal: rgba(95,208,222,.12);
    --border-card: rgba(255,255,255,.10);

    --status-present:#49d696;
    --status-present-dark:#8be9c4;
    --status-absent:#ff6b70;
    --status-absent-dark:#ffb0b2;
    --status-leave:#ffc65c;
    --status-leave-dark:#ffe2a8;
    --status-medical:#63bdf2;
    --status-medical-dark:#b4e0fb;
    --status-holiday:#71807f;
    --status-blank:#1f2a2c;

    --input-bg: color-mix(in srgb, var(--white) 90%, black 10%);
    --input-border: color-mix(in srgb, var(--white) 22%, transparent);
    --edge-shadow: rgba(0,0,0,.5);
    --edge-shadow-soft: rgba(0,0,0,.35);
    --track: color-mix(in srgb, var(--white) 14%, transparent);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:var(--font-body);
    color:var(--ink-900);
    background:linear-gradient(180deg,var(--bg-tint-teal) 0%, var(--cream) 55%, var(--bg-tint-gold) 100%);
    transition:background .3s var(--ease), color .3s var(--ease);
    padding:14px 14px 28px;
  }

  .wrap{max-width:760px;margin:0 auto;}

  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--border-card);
    background:var(--white);font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--edge-shadow-soft);
    display:flex;align-items:center;justify-content:center;transition:transform .15s ease;color:var(--ink-900);
  }
  .icon-btn:hover{transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--edge-shadow-soft);}
  .icon-btn:focus-visible{outline:3px solid var(--teal-600);outline-offset:2px;}

  .card{
    background:var(--white);border-radius:var(--r-lg);border:1px solid var(--border-card);
    box-shadow:0 6px 0 var(--edge-shadow-soft);padding:20px;margin-bottom:16px;
  }

  /* ---------- overview card: rings + counts ---------- */
  .overview{display:flex;flex-wrap:wrap;gap:20px;align-items:center;}
  .ring-block{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;}
  .ring-label{font-weight:700;font-size:13px;color:var(--ink-500);text-align:center;}
  .ring-svg{display:block;}
  .ring-pct{font-family:var(--font-display);font-weight:700;}
  .ring-sub{font-size:11px;font-weight:600;color:var(--ink-500);}

  .counts-grid{
    flex:1 1 220px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;min-width:220px;
  }
  .count-chip{
    border-radius:var(--r-sm);padding:10px 12px;display:flex;align-items:center;gap:10px;
    background:var(--panel-tint);border:1px solid var(--border-card);
  }
  .count-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;}
  .count-text{display:flex;flex-direction:column;line-height:1.2;}
  .count-num{font-family:var(--font-display);font-weight:700;font-size:20px;}
  .count-name{font-size:11.5px;font-weight:700;color:var(--ink-500);}

  .section-title{
    font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 2px;color:var(--ink-900);
  }
  .section-sub{font-size:13px;color:var(--ink-500);margin:0 0 14px;font-weight:600;}

  /* ---------- calendar ---------- */
  .cal-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .cal-title{display:flex;align-items:center;gap:10px;}
  .cal-month{font-family:var(--font-display);font-weight:700;font-size:19px;min-width:150px;text-align:center;}
  .cal-nav-btns{display:flex;gap:6px;}
  .cal-badge{
    font-weight:800;font-size:12.5px;border-radius:999px;padding:5px 12px;
    background:var(--panel-tint);color:var(--ink-900);border:1px solid var(--border-card);
  }

  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 6px;}
  .weekday-row span{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-500);}

  .day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day-cell{
    aspect-ratio:1/1;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;position:relative;background:var(--status-blank);color:var(--ink-500);
    transition:transform .12s ease;
  }
  .day-cell.empty{background:transparent;}
  .day-cell.today{box-shadow:0 0 0 2px var(--teal-600) inset;}
  .day-cell.P{background:color-mix(in srgb, var(--status-present) 28%, var(--white));color:var(--status-present-dark);}
  .day-cell.A{background:color-mix(in srgb, var(--status-absent) 26%, var(--white));color:var(--status-absent-dark);}
  .day-cell.L{background:color-mix(in srgb, var(--status-leave) 30%, var(--white));color:var(--status-leave-dark);}
  .day-cell.M{background:color-mix(in srgb, var(--status-medical) 26%, var(--white));color:var(--status-medical-dark);}
  .day-cell.H{background:color-mix(in srgb, var(--status-holiday) 24%, var(--white));color:var(--ink-500);}
  .day-cell[data-note]:after{
    content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7;
  }

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-500);}
  .legend-dot{width:10px;height:10px;border-radius:3px;}

  /* ---------- status / loading ---------- */
  .state-msg{
    text-align:center;padding:30px 12px;font-weight:700;color:var(--ink-500);font-size:14.5px;
  }
  .state-msg.err{color:var(--status-absent-dark);}
  .retry-btn{
    margin-top:10px;font-family:var(--font-body);font-weight:800;font-size:13.5px;border:none;
    border-radius:999px;padding:9px 18px;cursor:pointer;background:var(--teal-700);color:#fff;
  }
  .spinner{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--teal-600);
    margin:0 auto 10px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  @media (max-width:420px){
    .card{padding:16px;}
    .cal-month{min-width:120px;font-size:17px;}
    .day-cell{font-size:11.5px;border-radius:8px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- Overview: attendance rings + lifetime counts -->
  <div class="card" id="overviewCard">
    <h2 class="section-title">Overall attendance</h2>
    <p class="section-sub">Since your records began</p>
    <div id="overviewBody">
      <div class="state-msg" id="overviewState"><div class="spinner"></div>Loading your attendance…</div>
    </div>
  </div>

  <!-- Calendar: month view -->
  <div class="card" id="calendarCard">
    <div class="cal-header">
      <div class="cal-title">
        <div class="cal-nav-btns">
          <button class="icon-btn" id="prevMonthBtn" aria-label="Previous month">‹</button>
        </div>
        <span class="cal-month" id="calMonthLabel">—</span>
        <div class="cal-nav-btns">
          <button class="icon-btn" id="nextMonthBtn" aria-label="Next month">›</button>
        </div>
      </div>
      <span class="cal-badge" id="calPctBadge">—</span>
    </div>
    <div id="calendarBody">
      <div class="state-msg" id="calendarState"><div class="spinner"></div>Loading this month…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     Multi-tenant credentials — provided as-is, do not modify.
  ============================================================ */
  var SUPABASE_URL, SUPABASE_ANON_KEY;
  (function(){
    var institutionId = localStorage.getItem('gsms_last_institution_id');
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem('cp_institution_' + institutionId)); } catch(e) {}

    if (!cached || !cached.data || !cached.data.supabase_url || !cached.data.supabase_anon_key) {
      window.location.href = 'https://educational-saas.github.io/'; // no credentials on record — back to login
      throw new Error('Redirecting to sign-in.');
    }
    SUPABASE_URL = cached.data.supabase_url;
    SUPABASE_ANON_KEY = cached.data.supabase_anon_key;
  })();

  var AUTH_REDIRECT = 'https://educational-saas.github.io/'; // If user not already logged in or does not have a "student" role

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Theme is controlled entirely by the parent page, which sets
  // data-theme="light" | "dark" on <html>. This page's CSS already
  // keys off html[data-theme="dark"], so nothing else is needed here.

  /* ============================================================
     Helpers
  ============================================================ */
  var STATUS_META = {
    P: {label:'Present', short:'P', color:'var(--status-present)', colorDark:'var(--status-present-dark)'},
    A: {label:'Absent', short:'A', color:'var(--status-absent)', colorDark:'var(--status-absent-dark)'},
    L: {label:'Leave', short:'L', color:'var(--status-leave)', colorDark:'var(--status-leave-dark)'},
    M: {label:'Medical leave', short:'ML', color:'var(--status-medical)', colorDark:'var(--status-medical-dark)'},
    H: {label:'Holiday', short:'H', color:'var(--status-holiday)', colorDark:'var(--status-holiday)'}
  };
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function ymd(y,m,d){ return y+'-'+pad2(m+1)+'-'+pad2(d); }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

  function colorTierFor(pct){
    if(pct === null) return {bg:'var(--panel-tint)', fg:'var(--ink-500)'};
    if(pct < 75) return {bg:'color-mix(in srgb, var(--status-absent) 20%, var(--white))', fg:'var(--status-absent-dark)'};
    if(pct < 90) return {bg:'color-mix(in srgb, var(--status-leave) 24%, var(--white))', fg:'var(--status-leave-dark)'};
    return {bg:'color-mix(in srgb, var(--status-present) 22%, var(--white))', fg:'var(--status-present-dark)'};
  }

  function ringSVG(id, pct, label, size){
    size = size || 118;
    var stroke = 11;
    var r = (size - stroke) / 2;
    var c = 2 * Math.PI * r;
    var tier = colorTierFor(pct);
    var dash = pct === null ? 0 : (pct/100) * c;
    var displayPct = pct === null ? '—' : Math.round(pct) + '%';
    return ''
      + '<div class="ring-block">'
      + '<svg class="ring-svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+stroke+'"/>'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+tier.fg+'" stroke-width="'+stroke+'" '
      +   'stroke-linecap="round" stroke-dasharray="'+dash.toFixed(1)+' '+c.toFixed(1)+'" '
      +   'transform="rotate(-90 '+size/2+' '+size/2+')"/>'
      + '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ring-pct" '
      +   'font-size="'+Math.round(size*0.22)+'" fill="'+tier.fg+'">'+displayPct+'</text>'
      + '</svg>'
      + '<span class="ring-label">'+label+'</span>'
      + '</div>';
  }

  function countChip(key, count){
    var meta = STATUS_META[key];
    return ''
      + '<div class="count-chip">'
      + '<span class="count-dot" style="background:'+meta.color+'"></span>'
      + '<span class="count-text"><span class="count-num">'+count+'</span>'
      + '<span class="count-name">'+meta.label+'</span></span>'
      + '</div>';
  }

  function pctFromCounts(counts){
    var total = (counts.P||0) + (counts.A||0) + (counts.L||0) + (counts.M||0); // holidays excluded
    if(total === 0) return null;
    return (counts.P / total) * 100;
  }

  /* ============================================================
     App state
  ============================================================ */
  var state = {
    masterId: null,
    studentName: '',
    viewYear: 0,
    viewMonth: 0, // 0-indexed
    monthCache: {}, // 'YYYY-M' -> {counts, days: {date: {status, note}}}
    overallCounts: null
  };

  var today = new Date();

  /* ============================================================
     Auth + identity resolution
  ============================================================ */
  async function init(){
    try{
      var sessionRes = await supabase.auth.getSession();
      var session = sessionRes && sessionRes.data ? sessionRes.data.session : null;
      if(!session){ window.location.href = AUTH_REDIRECT; return; }

      var uid = session.user.id;

      // Confirm this user is a student, and get the link to their master record.
      var studentRes = await supabase.from('students')
        .select('name, master_token')
        .eq('id', uid)
        .maybeSingle();

      if(studentRes.error || !studentRes.data || !studentRes.data.master_token){
        window.location.href = AUTH_REDIRECT; return;
      }
      state.studentName = studentRes.data.name;

      // Resolve the official master record (id + class) behind this account.
      var masterRes = await supabase.from('students_master')
        .select('id, class')
        .eq('token', studentRes.data.master_token)
        .maybeSingle();

      if(masterRes.error || !masterRes.data){
        showOverviewError('We could not find your student record.');
        showCalendarError('We could not find your student record.');
        return;
      }

      state.masterId = masterRes.data.id;
      state.viewYear = today.getFullYear();
      state.viewMonth = today.getMonth();

      await Promise.all([loadOverallCounts(), loadMonth(state.viewYear, state.viewMonth)]);
    } catch(e){
      showOverviewError('Something went wrong loading your attendance.');
      showCalendarError('Something went wrong loading this month.');
    }
  }

  /* ============================================================
     Overall (lifetime) counts — count-only queries, no row data
     transferred, so this stays bandwidth-light regardless of how
     many years of records exist.
  ============================================================ */
  async function loadOverallCounts(){
    try{
      var statuses = ['P','A','L','M'];
      var results = await Promise.all(statuses.map(function(s){
        return supabase.from('attendance')
          .select('*', {count:'exact', head:true})
          .eq('student_id', state.masterId)
          .eq('status', s);
      }));

      var counts = {};
      for(var i=0;i<statuses.length;i++){
        if(results[i].error) throw results[i].error;
        counts[statuses[i]] = results[i].count || 0;
      }
      state.overallCounts = counts;
      renderOverview();
    } catch(e){
      showOverviewError('Could not load your overall attendance.');
    }
  }

  function renderOverview(){
    var pct = pctFromCounts(state.overallCounts);
    var html = '<div class="overview">'
      + ringSVG('overallRing', pct, 'Overall attendance')
      + '<div class="counts-grid">'
      + countChip('P', state.overallCounts.P)
      + countChip('A', state.overallCounts.A)
      + countChip('L', state.overallCounts.L)
      + countChip('M', state.overallCounts.M)
      + '</div></div>';
    document.getElementById('overviewBody').innerHTML = html;
  }

  function showOverviewError(msg){
    document.getElementById('overviewBody').innerHTML =
      '<div class="state-msg err">'+msg+'<br><button class="retry-btn" id="retryOverview">Try again</button></div>';
    var btn = document.getElementById('retryOverview');
    if(btn) btn.addEventListener('click', loadOverallCounts);
  }

  /* ============================================================
     Month data — one row-fetch per month, cached in memory so
     switching back to a previously viewed month costs nothing.
     This single query also drives the calendar grid and the
     month's percentage badge, so no duplicate requests are made.
  ============================================================ */
  async function loadMonth(year, month){
    var key = year + '-' + month;
    document.getElementById('calendarBody').innerHTML =
      '<div class="state-msg" id="calendarState"><div class="spinner"></div>Loading this month…</div>';
    renderCalendarHeader(year, month, null);

    if(state.monthCache[key]){
      renderCalendar(year, month, state.monthCache[key]);
      return;
    }

    try{
      var first = ymd(year, month, 1);
      var last = ymd(year, month, daysInMonth(year, month));

      var res = await supabase.from('attendance')
        .select('att_date, status, note')
        .eq('student_id', state.masterId)
        .gte('att_date', first)
        .lte('att_date', last);

      if(res.error) throw res.error;

      var days = {};
      var counts = {P:0,A:0,L:0,M:0,H:0};
      (res.data || []).forEach(function(row){
        days[row.att_date] = {status: row.status, note: row.note};
        if(counts.hasOwnProperty(row.status)) counts[row.status]++;
      });

      var monthData = {days: days, counts: counts};
      state.monthCache[key] = monthData;
      renderCalendar(year, month, monthData);
    } catch(e){
      showCalendarError('Could not load this month\u2019s attendance.');
    }
  }

  function renderCalendarHeader(year, month, pct){
    document.getElementById('calMonthLabel').textContent = MONTH_NAMES[month] + ' ' + year;
    var badge = document.getElementById('calPctBadge');
    badge.textContent = pct === null || pct === undefined ? '—' : Math.round(pct) + '% present';

    var isCurrentMonth = (year === today.getFullYear() && month === today.getMonth());
    document.getElementById('nextMonthBtn').disabled = isCurrentMonth;
    document.getElementById('nextMonthBtn').style.opacity = isCurrentMonth ? .4 : 1;
    document.getElementById('nextMonthBtn').style.cursor = isCurrentMonth ? 'default' : 'pointer';
  }

  function renderCalendar(year, month, monthData){
    var pct = pctFromCounts(monthData.counts);
    renderCalendarHeader(year, month, pct);

    var firstWeekday = new Date(year, month, 1).getDay();
    var totalDays = daysInMonth(year, month);
    var isCurrentMonth = (year === today.getFullYear() && month === today.getMonth());

    var cells = '<div class="weekday-row">'
      + ['S','M','T','W','T','F','S'].map(function(d){ return '<span>'+d+'</span>'; }).join('')
      + '</div><div class="day-grid">';

    for(var i=0;i<firstWeekday;i++) cells += '<div class="day-cell empty"></div>';

    for(var d=1; d<=totalDays; d++){
      var dateStr = ymd(year, month, d);
      var rec = monthData.days[dateStr];
      var cls = 'day-cell';
      if(rec) cls += ' ' + rec.status;
      if(isCurrentMonth && d === today.getDate()) cls += ' today';
      var noteAttr = rec && rec.note ? ' data-note="1" title="'+rec.note.replace(/"/g,'&quot;')+'"' : '';
      cells += '<div class="'+cls+'"'+noteAttr+'>'+d+'</div>';
    }
    cells += '</div>';

    cells += '<div class="legend">'
      + ['P','A','L','M','H'].map(function(k){
          var m = STATUS_META[k];
          return '<span class="legend-item"><span class="legend-dot" style="background:'+m.color+'"></span>'+m.label+'</span>';
        }).join('')
      + '<span class="legend-item"><span class="legend-dot" style="background:var(--status-blank)"></span>No record</span>'
      + '</div>';

    document.getElementById('calendarBody').innerHTML = cells;
  }

  function showCalendarError(msg){
    document.getElementById('calendarBody').innerHTML =
      '<div class="state-msg err">'+msg+'<br><button class="retry-btn" id="retryMonth">Try again</button></div>';
    var btn = document.getElementById('retryMonth');
    if(btn) btn.addEventListener('click', function(){ loadMonth(state.viewYear, state.viewMonth); });
  }

  /* ============================================================
     Month navigation
  ============================================================ */
  document.getElementById('prevMonthBtn').addEventListener('click', function(){
    state.viewMonth -= 1;
    if(state.viewMonth < 0){ state.viewMonth = 11; state.viewYear -= 1; }
    loadMonth(state.viewYear, state.viewMonth);
  });
  document.getElementById('nextMonthBtn').addEventListener('click', function(){
    var isCurrentMonth = (state.viewYear === today.getFullYear() && state.viewMonth === today.getMonth());
    if(isCurrentMonth) return;
    state.viewMonth += 1;
    if(state.viewMonth > 11){ state.viewMonth = 0; state.viewYear += 1; }
    loadMonth(state.viewYear, state.viewMonth);
  });

  init();
})();
</script>
</body>
</html>
