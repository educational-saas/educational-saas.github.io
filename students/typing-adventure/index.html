<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Typing Town 🦉 — Learn to Type!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;

    /* ---------- Brand palette (light) — matches the parent portal ---------- */
    --teal-900:#0d3841;
    --teal-800:#124f59;
    --teal-700:#1b6b78;
    --teal-600:#227d8b;
    --teal-100:#e3eef0;
    --gold-600:#e2941a;
    --gold-500:#f5a623;
    --gold-400:#ffc65c;
    --gold-100:#fdf1dc;
    --cream:#faf8f3;
    --ink-900:#1c2626;
    --ink-500:#5f6f70;
    --white:#ffffff;

    --bg-tint-gold: rgba(245,166,35,.10);
    --bg-tint-teal: rgba(27,107,120,.10);
    --border-card: rgba(13,56,65,.08);

    /* ---------- Kid-friendly accents (mascot, path, confetti, celebrations) ---------- */
    --fun-red:#f2555a;
    --fun-orange:#ff9f45;
    --fun-yellow:#ffd85c;
    --fun-green:#4fc98a;
    --fun-blue:#4aa8e0;
    --fun-purple:#a679e0;
    --fun-pink:#ff8fc0;
    --char-line:#2a2a2a;

    /* ---------- Typing Town semantic tokens (derived from the brand palette) ---------- */
    --grass:var(--fun-green);
    --grass-dark:#399c6c;
    --sun:var(--gold-500);
    --sun-dark:var(--gold-600);
    --berry:var(--fun-red);
    --berry-dark:#d1454a;
    --plum:var(--ink-900);
    --ink-soft:var(--ink-500);
    --stone-locked: var(--teal-100);
    --stone-locked-ink: var(--ink-500);
    --purple: var(--fun-purple);

    --panel-tint: var(--bg-tint-teal);
    --bubble-tint: var(--bg-tint-gold);
    --input-bg: color-mix(in srgb, var(--white) 97%, var(--ink-900) 3%);
    --input-border: color-mix(in srgb, var(--ink-900) 16%, transparent);
    --cloud-tint: rgba(255,255,255,.85);
    --overlay-tint: color-mix(in srgb, var(--teal-900) 55%, transparent);
    --overlay-tint-strong: color-mix(in srgb, var(--teal-900) 62%, transparent);
    --edge-shadow: rgba(13,56,65,.14);
    --edge-shadow-soft: rgba(13,56,65,.08);

    --r-lg:26px;
    --r-md:18px;
    --r-sm:14px;
    --ease:cubic-bezier(.22,1,.36,1);

    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Manrope',system-ui,sans-serif;
  }

  html[data-theme="dark"]{
    color-scheme: dark;

    --teal-900:#092227;
    --teal-800:#8fe1ec;
    --teal-700:#5fd0de;
    --teal-600:#7fdbe6;
    --teal-100:#173338;
    --gold-600:#ffb648;
    --gold-500:#ffc65c;
    --gold-400:#ffd685;
    --gold-100:#2b2110;
    --cream:#0d1517;
    --ink-900:#eef3f2;
    --ink-500:#a4b6b7;
    --white:#182425;

    --bg-tint-gold: rgba(255,182,72,.08);
    --bg-tint-teal: rgba(95,208,222,.12);
    --border-card: rgba(255,255,255,.10);
    --char-line:#0d1517;

    --grass-dark:#2c8f60;
    --berry-dark:#c23b41;

    --input-bg: color-mix(in srgb, var(--white) 90%, black 10%);
    --input-border: color-mix(in srgb, var(--white) 22%, transparent);
    --cloud-tint: rgba(255,255,255,.14);
    --edge-shadow: rgba(0,0,0,.5);
    --edge-shadow-soft: rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:var(--font-body);
    color:var(--plum);
    background:linear-gradient(180deg,var(--bg-tint-teal) 0%, var(--cream) 55%, var(--bg-tint-gold) 100%);
    overflow-x:hidden;
    position:relative;
    transition:background .3s var(--ease), color .3s var(--ease);
  }

  /* ---------- decorative sky ---------- */
  .sky-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .sun-decor{
    position:absolute;top:-40px;right:6%;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--gold-400), var(--sun) 70%);
    box-shadow:0 0 60px 20px rgba(245,166,35,.35);
    animation:pulse 4s ease-in-out infinite;
  }
  .cloud{position:absolute;background:var(--cloud-tint);border-radius:50px;filter:blur(0.2px);}
  .cloud::before,.cloud::after{content:"";position:absolute;background:var(--cloud-tint);border-radius:50%;}
  .cloud1{width:110px;height:36px;top:8%;left:5%;animation:drift 34s linear infinite;}
  .cloud1::before{width:55px;height:55px;top:-26px;left:12px;}
  .cloud1::after{width:40px;height:40px;top:-18px;left:55px;}
  .cloud2{width:90px;height:30px;top:18%;left:70%;animation:drift 26s linear infinite reverse;}
  .cloud2::before{width:44px;height:44px;top:-20px;left:8px;}
  .cloud2::after{width:34px;height:34px;top:-14px;left:44px;}
  .cloud3{width:70px;height:24px;top:35%;left:40%;animation:drift 40s linear infinite;}
  .cloud3::before{width:34px;height:34px;top:-16px;left:6px;}
  .cloud3::after{width:26px;height:26px;top:-10px;left:34px;}
  @keyframes drift{from{transform:translateX(-10vw);}to{transform:translateX(110vw);}}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  /* ---------- top bar ---------- */
  .top-bar{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;gap:12px;flex-wrap:wrap;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);font-weight:700;
    font-size:clamp(20px,3vw,28px);color:var(--plum);
  }
  .brand .mascot-mini{font-size:1.4em;animation:bob 2.4s ease-in-out infinite;display:inline-block;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}

  .top-right{display:flex;align-items:center;gap:10px;}
  .stars-counter{
    display:flex;align-items:center;gap:6px;
    background:var(--white);border:3px solid var(--sun);
    border-radius:999px;padding:8px 16px;
    font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--edge-shadow-soft);
    color:var(--plum);
  }
  .icon-btn{
    width:46px;height:46px;border-radius:50%;border:3px solid var(--white);
    background:var(--white);font-size:20px;cursor:pointer;box-shadow:0 4px 0 var(--edge-shadow-soft);
    display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
  }
  .icon-btn:hover{transform:translateY(-2px) scale(1.05);}
  .icon-btn:active{transform:translateY(1px) scale(.97);}

  /* ---------- path of stepping stones ---------- */
  .path-wrap{
    position:relative;z-index:2;
    margin:6px auto 10px;max-width:1000px;
    overflow-x:auto;overflow-y:hidden;
    padding:14px 18px 22px;
  }
  .path{
    display:flex;align-items:flex-end;gap:14px;min-width:max-content;padding:0 6px;
    position:relative;
  }
  .path::before{
    content:"";position:absolute;left:0;right:0;top:50%;height:0;
    border-top:5px dashed var(--border-card);z-index:0;
  }
  .stone{
    position:relative;z-index:1;
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:16px;
    background:var(--stone-locked);color:var(--stone-locked-ink);
    border:4px solid var(--white);box-shadow:0 4px 0 var(--edge-shadow-soft);
    flex:0 0 auto;transition:transform .2s ease, background .2s ease;
  }
  .stone:nth-child(odd){transform:translateY(-6px);}
  .stone:nth-child(even){transform:translateY(6px);}
  .stone.done{background:var(--grass);color:#fff;}
  .stone.current{background:var(--sun);color:#5a3c00;transform:translateY(-6px) scale(1.18);box-shadow:0 0 0 5px rgba(245,166,35,.35), 0 4px 0 var(--edge-shadow-soft);animation:stonepulse 1.6s ease-in-out infinite;}
  @keyframes stonepulse{0%,100%{box-shadow:0 0 0 5px rgba(245,166,35,.35),0 4px 0 var(--edge-shadow-soft);}50%{box-shadow:0 0 0 9px rgba(245,166,35,.16),0 4px 0 var(--edge-shadow-soft);}}
  .stone.trophy{background:linear-gradient(160deg,var(--sun),var(--berry));color:#fff;font-size:22px;}

  /* ---------- main stage ---------- */
  .stage{
    position:relative;z-index:2;
    max-width:980px;margin:0 auto;padding:10px 18px 60px;
    display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start;
  }
  @media (max-width:760px){
    .stage{grid-template-columns:1fr;}
  }

  .mascot-card{
    background:var(--white);border-radius:var(--r-lg);padding:18px 16px;
    text-align:center;box-shadow:0 8px 0 var(--edge-shadow-soft);
    position:sticky;top:14px;border:1px solid var(--border-card);
  }
  .mascot{
    font-size:64px;display:inline-block;
    animation:bob 3s ease-in-out infinite;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.12));
  }
  .mascot.happy{animation:jump .6s ease-in-out 2;}
  @keyframes jump{0%,100%{transform:translateY(0) rotate(0);}30%{transform:translateY(-18px) rotate(-8deg);}60%{transform:translateY(0) rotate(6deg);}}
  .speech-bubble{
    margin-top:10px;background:var(--bubble-tint);border-radius:var(--r-md);padding:12px;
    font-size:15px;font-weight:700;color:var(--plum);line-height:1.35;
    min-height:60px;display:flex;align-items:center;justify-content:center;
  }
  .mascot-name{font-family:var(--font-display);font-weight:700;color:var(--purple);font-size:14px;margin-top:6px;}

  .task-card{
    background:var(--white);border-radius:var(--r-lg);padding:24px 24px 20px;
    box-shadow:0 10px 0 var(--edge-shadow-soft);
    position:relative;overflow:hidden;border:1px solid var(--border-card);
  }
  .task-badge{
    display:inline-block;background:var(--sun);color:#5a3c00;font-weight:800;
    font-family:var(--font-display);font-size:13px;letter-spacing:.3px;
    padding:5px 14px;border-radius:999px;margin-bottom:10px;
  }
  .task-title{
    font-family:var(--font-display);font-weight:700;font-size:clamp(24px,4vw,32px);
    margin:2px 0 6px;color:var(--plum);
  }
  .task-instruction{
    font-size:17px;font-weight:600;line-height:1.5;margin:0 0 14px;color:var(--ink-soft);
  }
  .target-chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--bg-tint-gold);border:2px dashed var(--sun-dark);
    border-radius:var(--r-md);padding:10px 16px;font-size:20px;font-weight:800;
    margin-bottom:16px;color:var(--plum);font-family:var(--font-display);
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--panel-tint);border-radius:var(--r-md);padding:12px;margin-bottom:16px;
  }
  .toolbar.hidden{display:none;}
  .tool-group{display:flex;gap:8px;align-items:center;padding:2px 8px;border-right:2px solid var(--border-card);}
  .tool-group:last-child{border-right:none;}
  .tool-btn{
    width:46px;height:46px;border-radius:14px;border:none;background:var(--white);
    box-shadow:0 3px 0 var(--edge-shadow-soft);cursor:pointer;font-size:18px;font-weight:800;
    display:flex;align-items:center;justify-content:center;transition:transform .12s ease, background .12s ease;
    color:var(--plum);
  }
  .tool-btn:hover{transform:translateY(-2px);}
  .tool-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--edge-shadow-soft);}
  .tool-btn.active-state{background:var(--purple);color:#fff;}
  .tool-btn.glow{animation:glow 1.1s ease-in-out infinite;}
  @keyframes glow{0%,100%{box-shadow:0 3px 0 var(--edge-shadow-soft),0 0 0 0 rgba(166,121,224,.5);}50%{box-shadow:0 3px 0 var(--edge-shadow-soft),0 0 0 8px rgba(166,121,224,0);}}
  .swatch{
    width:34px;height:34px;border-radius:50%;border:3px solid var(--white);box-shadow:0 2px 0 var(--edge-shadow-soft);
    cursor:pointer;transition:transform .12s ease;
  }
  .swatch:hover{transform:scale(1.15);}
  .swatch.active-state{outline:3px solid var(--plum);outline-offset:2px;}

  /* ---------- type box ---------- */
  .type-box-wrap{margin-bottom:14px;}
  .type-box{
    min-height:110px;border-radius:var(--r-md);border:3px solid var(--input-border);
    background:var(--input-bg);padding:16px 18px;font-size:26px;line-height:1.4;
    outline:none;word-wrap:break-word;color:var(--plum);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .type-box:focus{border-color:var(--teal-600);box-shadow:0 0 0 5px var(--bg-tint-teal);}
  .type-box:empty::before{content:attr(data-placeholder);color:var(--ink-500);font-weight:600;opacity:.7;}
  .type-box.shake{animation:shake .5s ease;}
  @keyframes shake{10%,90%{transform:translateX(-3px);}20%,80%{transform:translateX(6px);}30%,50%,70%{transform:translateX(-10px);}40%,60%{transform:translateX(10px);}}

  .action-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .btn-primary,.btn-secondary,.btn-big{
    font-family:var(--font-body);font-weight:800;font-size:17px;
    border:none;border-radius:999px;padding:14px 26px;cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn-primary{background:var(--grass);color:#fff;box-shadow:0 5px 0 var(--grass-dark);}
  .btn-primary:hover{filter:brightness(1.05);transform:translateY(-2px);}
  .btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--grass-dark);}
  .btn-secondary{background:var(--panel-tint);color:var(--plum);box-shadow:0 5px 0 var(--border-card);}
  .btn-secondary:hover{transform:translateY(-2px);}
  .btn-secondary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--border-card);}
  .btn-big{background:var(--berry);color:#fff;font-size:19px;padding:16px 34px;box-shadow:0 5px 0 var(--berry-dark);}
  .btn-big:hover{transform:translateY(-2px);}
  .btn-big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--berry-dark);}

  .hint-msg{margin-top:12px;font-weight:800;font-size:15px;min-height:22px;}
  .hint-msg.err{color:var(--berry-dark);}
  .hint-msg.ok{color:var(--grass-dark);}

  /* ---------- confetti ---------- */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
  .confetti-piece{position:absolute;top:-20px;border-radius:3px;animation:fall linear forwards;}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(105vh) rotate(540deg);opacity:.9;}
  }

  /* ---------- celebration overlay ---------- */
  .celebrate-overlay{
    position:fixed;inset:0;background:var(--overlay-tint);
    display:none;align-items:center;justify-content:center;z-index:60;padding:20px;
  }
  .celebrate-overlay.show{display:flex;}
  .celebrate-card{
    background:var(--white);border-radius:var(--r-lg);padding:34px 30px;text-align:center;
    max-width:420px;width:100%;box-shadow:0 12px 0 var(--edge-shadow);
    animation:pop .35s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--border-card);
  }
  @keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .celebrate-emoji{font-size:70px;animation:jump .6s ease-in-out 3;display:inline-block;}
  .celebrate-title{font-family:var(--font-display);font-weight:700;font-size:26px;margin:8px 0 4px;color:var(--plum);}
  .celebrate-msg{font-weight:700;color:var(--ink-soft);margin-bottom:18px;}

  /* ---------- final certificate ---------- */
  .final-overlay{
    position:fixed;inset:0;background:var(--overlay-tint-strong);
    display:none;align-items:center;justify-content:center;z-index:70;padding:20px;
  }
  .final-overlay.show{display:flex;}
  .certificate{
    background:var(--cream);border-radius:var(--r-lg);padding:40px 34px;text-align:center;
    max-width:520px;width:100%;border:10px solid var(--sun);
    box-shadow:0 14px 0 var(--edge-shadow);animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  .certificate .trophy-emoji{font-size:74px;}
  .certificate h2{font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--plum);margin:6px 0;}
  .certificate .cert-name{font-family:var(--font-display);font-weight:700;font-size:34px;color:var(--berry-dark);margin:10px 0;}
  .certificate p{font-weight:700;color:var(--ink-soft);}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  @media (max-width:480px){
    .type-box{font-size:22px;min-height:90px;}
    .task-card{padding:18px 16px 16px;}
    .toolbar{gap:8px;padding:10px;}
    .tool-group{border-right:none;padding:2px 4px;}
  }
</style>
</head>
<body>

<div class="sky-decor">
  <div class="sun-decor"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
</div>

<div class="top-bar">
  <div class="brand"><span class="mascot-mini">🦉</span> Typing Town</div>
  <div class="top-right">
    <div class="stars-counter">⭐ <span id="starCount">0</span></div>
    <button class="icon-btn" id="muteBtn" title="Sound on/off">🔊</button>
  </div>
</div>

<div class="path-wrap">
  <div class="path" id="pathTrack"></div>
</div>

<main class="stage">
  <div class="mascot-card">
    <div class="mascot" id="mascotFace">🦉</div>
    <div class="speech-bubble" id="speechBubble">Hi there! I'm Ollie the Owl. Let's learn to type together!</div>
    <div class="mascot-name">Ollie the Owl</div>
  </div>

  <div class="task-card" id="taskCard">
    <div class="task-badge" id="taskBadge">Level 1</div>
    <h2 class="task-title" id="taskTitle"></h2>
    <p class="task-instruction" id="taskInstruction"></p>
    <div class="target-chip" id="targetChip"></div>

    <div class="toolbar hidden" id="toolbar">
      <div class="tool-group">
        <button class="tool-btn" id="boldBtn" title="Bold"><b>B</b></button>
        <button class="tool-btn" id="italicBtn" title="Italic"><i>I</i></button>
      </div>
      <div class="tool-group">
        <button class="tool-btn" id="alignLeftBtn" title="Align left">⬅️</button>
        <button class="tool-btn" id="alignCenterBtn" title="Align center">⏺️</button>
        <button class="tool-btn" id="alignRightBtn" title="Align right">➡️</button>
      </div>
      <div class="tool-group">
        <button class="tool-btn" id="sizeDownBtn" title="Smaller text">A-</button>
        <button class="tool-btn" id="sizeUpBtn" title="Bigger text">A+</button>
      </div>
      <div class="tool-group" id="colorGroup"></div>
    </div>

    <div class="type-box-wrap">
      <div class="type-box" id="typeBox" contenteditable="true" data-placeholder="Tap here and start typing..."></div>
    </div>

    <div class="action-row">
      <button class="btn-primary" id="checkBtn">Check My Work ✅</button>
      <button class="btn-secondary" id="hearBtn">🔊 Hear It</button>
      <button class="btn-secondary" id="clearBtn">🧹 Clear</button>
    </div>
    <div class="hint-msg" id="hintMsg"></div>
  </div>
</main>

<div class="confetti-layer" id="confettiLayer"></div>

<div class="celebrate-overlay" id="celebrateOverlay">
  <div class="celebrate-card">
    <div class="celebrate-emoji" id="celebrateEmoji">🎉</div>
    <div class="celebrate-title" id="celebrateTitle">Awesome job!</div>
    <div class="celebrate-msg" id="celebrateMsg">You did it!</div>
    <button class="btn-big" id="nextBtn">Next ▶️</button>
  </div>
</div>

<div class="final-overlay" id="finalOverlay">
  <div class="certificate">
    <div class="trophy-emoji">🏆</div>
    <h2>Certificate of Awesomeness</h2>
    <div class="cert-name" id="certName">Star Typer</div>
    <p>has finished the Typing Town adventure and earned <span id="certStars">0</span> stars! 🌟</p>
    <p style="font-size:14px;margin-top:16px;">🎊 You are a typing superstar! 🎊</p>
    <button class="btn-big" id="restartBtn" style="margin-top:10px;">Play Again 🔁</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= TASK DATA ================= */
  var COLORS = [
    {name:'Red', hex:'#f2555a'},
    {name:'Orange', hex:'#ff9f45'},
    {name:'Yellow', hex:'#ffd85c'},
    {name:'Green', hex:'#4fc98a'},
    {name:'Blue', hex:'#4aa8e0'},
    {name:'Purple', hex:'#a679e0'},
    {name:'Pink', hex:'#ff8fc0'}
  ];

  var tasks = [
    {type:'text', title:"What's Your Name?", instruction:"Type your first name so we can cheer for YOU!", example:"e.g. Maya", target:null, isName:true},
    {type:'text', title:"Say Hello!", instruction:"Find the keys and type the word:", example:"hi", target:"hi"},
    {type:'text', title:"Meet a Pet", instruction:"Type this word:", example:"cat", target:"cat"},
    {type:'text', title:"Shine Bright", instruction:"Type this word:", example:"sun", target:"sun"},
    {type:'text', title:"Two Words!", instruction:"Type these two words:", example:"dog runs", target:"dog runs"},
    {type:'text', title:"Make a Sentence", instruction:"Type this little sentence:", example:"i am happy", target:"i am happy"},
    {type:'text', title:"Another Sentence", instruction:"Type this sentence:", example:"the sun is big", target:"the sun is big"},
    {type:'format', title:"Bold Like a Bear", instruction:"Type the word, then tap the B button to make it strong!", example:"wow", target:"wow", require:{bold:true}},
    {type:'format', title:"Wiggly Italics", instruction:"Type the word, then tap the I button to make it lean and wiggle!", example:"fun", target:"fun", require:{italic:true}},
    {type:'format', title:"Color It Red", instruction:"Type the word, then tap the RED circle to color it!", example:"apple", target:"apple", require:{color:'#f2555a'}},
    {type:'format', title:"Grow Big!", instruction:"Type the word, then tap A+ until it grows nice and big!", example:"big", target:"big", require:{minSize:44}},
    {type:'format', title:"Center Stage", instruction:"Type the word, then tap the middle button to put it in the center!", example:"star", target:"star", require:{align:'center'}},
    {type:'format', title:"Mix It Up!", instruction:"Type the sentence, make it BOLD and color it BLUE!", example:"i did it", target:"i did it", require:{bold:true, color:'#4aa8e0'}}
  ];

  /* ================= STATE ================= */
  var state = {
    index: 0,
    stars: 0,
    muted: false,
    playerName: '',
    fmt: {bold:false, italic:false, align:'left', color:'var(--plum)', size:26}
  };

  var encourage = [
    "Wow, you did it! 🌟",
    "Super typing! 🎉",
    "You're a typing star! ⭐",
    "Amazing work! 🥳",
    "Yes! Perfect! 🙌",
    "Fantastic job! 🚀",
    "You nailed it! 🎈"
  ];
  var tryAgain = [
    "Almost! Try once more. 🦉",
    "So close! Give it another try. 💪",
    "Not quite — you can do it! 🌈",
    "Keep going, you're learning fast! ✨"
  ];

  /* ================= ELEMENTS ================= */
  var el = {
    pathTrack: document.getElementById('pathTrack'),
    starCount: document.getElementById('starCount'),
    muteBtn: document.getElementById('muteBtn'),
    mascotFace: document.getElementById('mascotFace'),
    speechBubble: document.getElementById('speechBubble'),
    taskBadge: document.getElementById('taskBadge'),
    taskTitle: document.getElementById('taskTitle'),
    taskInstruction: document.getElementById('taskInstruction'),
    targetChip: document.getElementById('targetChip'),
    toolbar: document.getElementById('toolbar'),
    boldBtn: document.getElementById('boldBtn'),
    italicBtn: document.getElementById('italicBtn'),
    alignLeftBtn: document.getElementById('alignLeftBtn'),
    alignCenterBtn: document.getElementById('alignCenterBtn'),
    alignRightBtn: document.getElementById('alignRightBtn'),
    sizeDownBtn: document.getElementById('sizeDownBtn'),
    sizeUpBtn: document.getElementById('sizeUpBtn'),
    colorGroup: document.getElementById('colorGroup'),
    typeBox: document.getElementById('typeBox'),
    checkBtn: document.getElementById('checkBtn'),
    hearBtn: document.getElementById('hearBtn'),
    clearBtn: document.getElementById('clearBtn'),
    hintMsg: document.getElementById('hintMsg'),
    confettiLayer: document.getElementById('confettiLayer'),
    celebrateOverlay: document.getElementById('celebrateOverlay'),
    celebrateEmoji: document.getElementById('celebrateEmoji'),
    celebrateTitle: document.getElementById('celebrateTitle'),
    celebrateMsg: document.getElementById('celebrateMsg'),
    nextBtn: document.getElementById('nextBtn'),
    finalOverlay: document.getElementById('finalOverlay'),
    certName: document.getElementById('certName'),
    certStars: document.getElementById('certStars'),
    restartBtn: document.getElementById('restartBtn')
  };

  /* ================= AUDIO ================= */
  var audioCtx = null;
  function getCtx(){
    if(!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
  }
  function beep(freq, dur, delay, vol){
    if(state.muted) return;
    var ctx = getCtx();
    if(!ctx) return;
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.15, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+dur+0.02);
  }
  function playTap(){ beep(520, 0.08, 0, 0.08); }
  function playSuccess(){
    beep(523.25, 0.16, 0);
    beep(659.25, 0.16, 0.12);
    beep(783.99, 0.28, 0.24);
  }
  function playOops(){
    beep(300, 0.18, 0, 0.09);
    beep(240, 0.22, 0.1, 0.09);
  }
  function speak(text){
    if(state.muted) return;
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85;
      u.pitch = 1.15;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ================= PATH STONES ================= */
  function buildPath(){
    el.pathTrack.innerHTML = '';
    tasks.forEach(function(t, i){
      var s = document.createElement('div');
      s.className = 'stone';
      s.textContent = (i+1);
      s.id = 'stone-' + i;
      el.pathTrack.appendChild(s);
    });
    var trophy = document.createElement('div');
    trophy.className = 'stone trophy';
    trophy.textContent = '🏆';
    trophy.id = 'stone-trophy';
    el.pathTrack.appendChild(trophy);
  }
  function updatePath(){
    tasks.forEach(function(t, i){
      var s = document.getElementById('stone-' + i);
      s.classList.remove('done','current');
      if(i < state.index) s.classList.add('done');
      else if(i === state.index) s.classList.add('current');
    });
  }

  /* ================= COLOR SWATCHES ================= */
  function buildSwatches(){
    el.colorGroup.innerHTML = '';
    COLORS.forEach(function(c){
      var b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = c.hex;
      b.title = c.name;
      b.setAttribute('data-color', c.hex);
      b.addEventListener('click', function(){
        playTap();
        state.fmt.color = c.hex;
        applyFormatting();
        refreshToolbarState();
      });
      el.colorGroup.appendChild(b);
    });
  }

  /* ================= FORMATTING ================= */
  function applyFormatting(){
    el.typeBox.style.fontWeight = state.fmt.bold ? '800' : '400';
    el.typeBox.style.fontStyle = state.fmt.italic ? 'italic' : 'normal';
    el.typeBox.style.textAlign = state.fmt.align;
    el.typeBox.style.color = state.fmt.color;
    el.typeBox.style.fontSize = state.fmt.size + 'px';
  }
  function resetFormatting(){
    state.fmt = {bold:false, italic:false, align:'left', color:'var(--plum)', size:26};
    applyFormatting();
  }
  function refreshToolbarState(){
    el.boldBtn.classList.toggle('active-state', state.fmt.bold);
    el.italicBtn.classList.toggle('active-state', state.fmt.italic);
    el.alignLeftBtn.classList.toggle('active-state', state.fmt.align==='left');
    el.alignCenterBtn.classList.toggle('active-state', state.fmt.align==='center');
    el.alignRightBtn.classList.toggle('active-state', state.fmt.align==='right');
    Array.prototype.forEach.call(el.colorGroup.children, function(sw){
      sw.classList.toggle('active-state', sw.getAttribute('data-color').toLowerCase() === state.fmt.color.toLowerCase());
    });
  }
  function clearGlow(){
    [el.boldBtn, el.italicBtn, el.alignLeftBtn, el.alignCenterBtn, el.alignRightBtn, el.sizeUpBtn, el.sizeDownBtn].forEach(function(b){
      b.classList.remove('glow');
    });
    Array.prototype.forEach.call(el.colorGroup.children, function(sw){ sw.classList.remove('glow'); });
  }
  function applyGlow(require){
    if(!require) return;
    if(require.bold) el.boldBtn.classList.add('glow');
    if(require.italic) el.italicBtn.classList.add('glow');
    if(require.align === 'center') el.alignCenterBtn.classList.add('glow');
    if(require.align === 'left') el.alignLeftBtn.classList.add('glow');
    if(require.align === 'right') el.alignRightBtn.classList.add('glow');
    if(require.minSize) el.sizeUpBtn.classList.add('glow');
    if(require.color){
      Array.prototype.forEach.call(el.colorGroup.children, function(sw){
        if(sw.getAttribute('data-color').toLowerCase() === require.color.toLowerCase()) sw.classList.add('glow');
      });
    }
  }

  el.boldBtn.addEventListener('click', function(){ playTap(); state.fmt.bold = !state.fmt.bold; applyFormatting(); refreshToolbarState(); });
  el.italicBtn.addEventListener('click', function(){ playTap(); state.fmt.italic = !state.fmt.italic; applyFormatting(); refreshToolbarState(); });
  el.alignLeftBtn.addEventListener('click', function(){ playTap(); state.fmt.align = 'left'; applyFormatting(); refreshToolbarState(); });
  el.alignCenterBtn.addEventListener('click', function(){ playTap(); state.fmt.align = 'center'; applyFormatting(); refreshToolbarState(); });
  el.alignRightBtn.addEventListener('click', function(){ playTap(); state.fmt.align = 'right'; applyFormatting(); refreshToolbarState(); });
  el.sizeUpBtn.addEventListener('click', function(){ playTap(); state.fmt.size = Math.min(64, state.fmt.size + 6); applyFormatting(); });
  el.sizeDownBtn.addEventListener('click', function(){ playTap(); state.fmt.size = Math.max(18, state.fmt.size - 6); applyFormatting(); });

  /* ================= TASK RENDERING ================= */
  function normalize(str){
    return (str||'').replace(/\s+/g,' ').trim().toLowerCase();
  }

  function renderTask(){
    var t = tasks[state.index];
    el.taskBadge.textContent = 'Level ' + (state.index + 1) + ' of ' + tasks.length;
    el.taskTitle.textContent = t.title;
    el.taskInstruction.textContent = t.instruction;

    if(t.isName){
      el.targetChip.style.display = 'none';
    } else {
      el.targetChip.style.display = 'inline-flex';
      el.targetChip.textContent = '✏️ ' + t.example;
    }

    el.typeBox.innerHTML = '';
    el.typeBox.setAttribute('data-placeholder', t.isName ? 'Type your name here...' : 'Tap here and start typing...');
    resetFormatting();
    refreshToolbarState();
    clearGlow();

    if(t.type === 'format'){
      el.toolbar.classList.remove('hidden');
      applyGlow(t.require);
    } else {
      el.toolbar.classList.add('hidden');
    }

    el.hintMsg.textContent = '';
    el.hintMsg.className = 'hint-msg';
    el.mascotFace.textContent = '🦉';
    el.mascotFace.classList.remove('happy');

    var msg = t.isName ? "What's your name, friend?" : "Let's type: " + t.example + "!";
    el.speechBubble.textContent = msg;
    updatePath();
    setTimeout(function(){ speak(t.instruction + (t.isName ? '' : ' ' + t.example)); }, 300);
    el.typeBox.focus();
  }

  function checkTask(){
    var t = tasks[state.index];
    var typed = el.typeBox.innerText || el.typeBox.textContent || '';
    var typedNorm = normalize(typed);

    if(t.isName){
      if(typedNorm.length < 1){
        failFeedback("Type your name first! 😊");
        return;
      }
      state.playerName = typed.trim();
      succeed();
      return;
    }

    if(typedNorm !== normalize(t.target)){
      failFeedback(tryAgain[Math.floor(Math.random()*tryAgain.length)]);
      return;
    }

    if(t.type === 'format'){
      var req = t.require;
      if(req.bold && !state.fmt.bold){ failFeedback("Great typing! Now tap the B button too. 💪"); return; }
      if(req.italic && !state.fmt.italic){ failFeedback("Great typing! Now tap the I button too. 💪"); return; }
      if(req.align && state.fmt.align !== req.align){ failFeedback("Great typing! Now tap the right align button. 💪"); return; }
      if(req.minSize && state.fmt.size < req.minSize){ failFeedback("Great typing! Now tap A+ a bit more. 💪"); return; }
      if(req.color && state.fmt.color.toLowerCase() !== req.color.toLowerCase()){ failFeedback("Great typing! Now pick the right color. 💪"); return; }
    }

    succeed();
  }

  function failFeedback(msg){
    playOops();
    el.hintMsg.textContent = msg;
    el.hintMsg.className = 'hint-msg err';
    el.typeBox.classList.remove('shake');
    void el.typeBox.offsetWidth;
    el.typeBox.classList.add('shake');
    el.mascotFace.textContent = '🦉';
    el.speechBubble.textContent = msg;
  }

  function succeed(){
    playSuccess();
    state.stars += 1;
    el.starCount.textContent = state.stars;
    el.mascotFace.textContent = '🥳';
    el.mascotFace.classList.add('happy');
    burstConfetti();
    var line = encourage[Math.floor(Math.random()*encourage.length)];
    el.speechBubble.textContent = line;
    showCelebration(line);
  }

  function showCelebration(line){
    var emojis = ['🎉','🌟','🥳','🎈','🚀','🏅','✨'];
    el.celebrateEmoji.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.celebrateTitle.textContent = line;
    el.celebrateMsg.textContent = (state.index === tasks.length - 1) ? "You finished every level!" : "Ready for the next fun level?";
    el.celebrateOverlay.classList.add('show');
  }

  el.nextBtn.addEventListener('click', function(){
    el.celebrateOverlay.classList.remove('show');
    if(state.index >= tasks.length - 1){
      showFinal();
    } else {
      state.index += 1;
      renderTask();
    }
  });

  function showFinal(){
    el.certName.textContent = state.playerName ? state.playerName : 'Star Typer';
    el.certStars.textContent = state.stars;
    el.finalOverlay.classList.add('show');
    burstConfetti(60);
  }

  el.restartBtn.addEventListener('click', function(){
    state.index = 0;
    state.stars = 0;
    el.starCount.textContent = 0;
    el.finalOverlay.classList.remove('show');
    renderTask();
  });

  /* ================= CONFETTI ================= */
  var confettiColors = ['#f2555a','#ffd85c','#4fc98a','#4aa8e0','#a679e0','#ff8fc0'];
  function burstConfetti(count){
    count = count || 36;
    var frag = document.createDocumentFragment();
    for(var i=0;i<count;i++){
      var p = document.createElement('div');
      p.className = 'confetti-piece';
      var size = 6 + Math.random()*8;
      p.style.width = size + 'px';
      p.style.height = (size*0.6) + 'px';
      p.style.left = (Math.random()*100) + 'vw';
      p.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      var dur = 2.2 + Math.random()*1.6;
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (Math.random()*0.3) + 's';
      el.confettiLayer.appendChild(p);
      (function(node, life){
        setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, (life+0.5)*1000);
      })(p, dur);
    }
  }

  /* ================= BUTTONS ================= */
  el.checkBtn.addEventListener('click', function(){ playTap(); checkTask(); });
  el.clearBtn.addEventListener('click', function(){
    playTap();
    el.typeBox.innerHTML = '';
    el.typeBox.focus();
    el.hintMsg.textContent = '';
  });
  el.hearBtn.addEventListener('click', function(){
    var t = tasks[state.index];
    speak(t.isName ? "What's your name?" : t.example);
  });
  el.muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    el.muteBtn.textContent = state.muted ? '🔇' : '🔊';
    if(state.muted && 'speechSynthesis' in window){ window.speechSynthesis.cancel(); }
  });

  el.typeBox.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      checkTask();
    }
  });

  /* ================= INIT ================= */
  buildPath();
  buildSwatches();
  renderTask();

})();
</script>
</body>
</html>
