<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  /* Apply saved/preferred theme immediately to avoid a flash of the wrong theme */
  (function(){
    try{
      var saved = localStorage.getItem('gsms-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Student Dashboard</title>
<link rel="icon" type="image/png" href="https://educational-saas.github.io/gsms-logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    color-scheme: light;

    /* Live-tracked height of .app-header, kept in sync by JS (ResizeObserver).
       Used to pin the page-viewer flush under the header regardless of how
       the header's own height changes (e.g. the search row hiding). */
    --header-h: 0px;

    /* ---------- Brand palette (light) â€” same as teacher dashboard ---------- */
    --teal-900:#0d3841;
    --teal-800:#124f59;
    --teal-700:#1b6b78;
    --teal-600:#227d8b;
    --teal-100:#e3eef0;
    --gold-600:#e2941a;
    --gold-500:#f5a623;
    --gold-400:#ffc65c;
    --gold-100:#fdf1dc;
    --cream:#faf8f3;
    --ink-900:#1c2626;
    --ink-500:#5f6f70;
    --white:#ffffff;

    --bg-tint-gold: rgba(245,166,35,.10);
    --bg-tint-teal: rgba(27,107,120,.10);
    --border-card: rgba(13,56,65,.08);
    --border-card-hover: rgba(245,166,35,.45);

    --toggle-bg: rgba(255,255,255,.75);
    --toggle-border: rgba(13,56,65,.14);
    --toggle-icon: var(--teal-700);
    --toggle-shadow: 0 10px 24px -12px rgba(13,56,65,.4);

    --header-bg: rgba(250,248,243,.85);
    --header-border: rgba(13,56,65,.08);

    --r-lg:26px;
    --r-md:18px;
    --r-sm:14px;
    --shadow-card:0 18px 40px -22px rgba(13,56,65,.35);
    --shadow-card-hover:0 24px 50px -18px rgba(13,56,65,.45);
    --ease:cubic-bezier(.22,1,.36,1);

    /* ---------- Kid-friendly accent colors (used inside character icons only) ---------- */
    --fun-red:#f2555a;
    --fun-orange:#ff9f45;
    --fun-yellow:#ffd85c;
    --fun-green:#4fc98a;
    --fun-blue:#4aa8e0;
    --fun-purple:#a679e0;
    --fun-pink:#ff8fc0;
    --char-line:#2a2a2a;
  }

  html[data-theme="dark"]{
    color-scheme: dark;

    --teal-900:#092227;
    --teal-800:#8fe1ec;
    --teal-700:#5fd0de;
    --teal-600:#7fdbe6;
    --teal-100:#173338;
    --gold-600:#ffb648;
    --gold-500:#ffc65c;
    --gold-400:#ffd685;
    --gold-100:#2b2110;
    --cream:#0d1517;
    --ink-900:#eef3f2;
    --ink-500:#a4b6b7;
    --white:#182425;

    --bg-tint-gold: rgba(255,182,72,.07);
    --bg-tint-teal: rgba(95,208,222,.10);
    --border-card: rgba(255,255,255,.08);
    --border-card-hover: rgba(255,198,92,.4);

    --toggle-bg: rgba(24,36,37,.85);
    --toggle-border: rgba(255,255,255,.14);
    --toggle-icon: var(--gold-400);
    --toggle-shadow: 0 10px 24px -12px rgba(0,0,0,.6);

    --header-bg: rgba(9,34,39,.85);
    --header-border: rgba(255,255,255,.08);

    --shadow-card:0 18px 40px -22px rgba(0,0,0,.55);
    --shadow-card-hover:0 24px 50px -18px rgba(0,0,0,.65);

    --char-line:#0d1517;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(1100px 700px at 82% -10%, var(--bg-tint-gold), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, var(--bg-tint-teal), transparent 60%),
      var(--cream);
    color:var(--ink-900);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    overflow-x:hidden;
    position:relative;
    transition:background-color .35s var(--ease), color .35s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }

  ::selection{background:var(--gold-400); color:var(--teal-900);}
  a{color:inherit;}
  button{font:inherit;}

  #app{ min-height:100svh; display:flex; flex-direction:column; }

  /* ---------- App header ---------- */
  .app-header{
    position:sticky; 
    top:0;
    z-index:40;
    background:var(--header-bg);
    border-bottom:1px solid var(--header-border);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
    transition:background-color .35s var(--ease), border-color .35s var(--ease), padding .3s var(--ease);
  }
  .app-header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    max-width:1200px;
    margin:0 auto 14px;
    transition:margin .3s var(--ease);
  }
  /* When a tool/page is loaded in the viewer, the header tightens up (no search row below it) */
  body.viewer-open .app-header-top{
    margin-bottom:0;
  }

  .header-brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .header-brand img{
    width:38px; height:38px;
    border-radius:10px;
    object-fit:cover;
    flex-shrink:0;
  }
  .header-back-btn{
    display:none;
    align-items:center;
    justify-content:center;
  }
  .header-text{ min-width:0; }
  .header-greeting{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.02rem;
    color:var(--ink-900);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:color .3s var(--ease);
  }
  .header-sub{
    margin:1px 0 0;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold-600);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }

  .icon-btn{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--toggle-bg);
    border:1.5px solid var(--toggle-border);
    box-shadow:var(--toggle-shadow);
    cursor:pointer;
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    transition:background-color .3s var(--ease), border-color .3s var(--ease), transform .2s var(--ease);
    position:relative;
    flex-shrink:0;
  }
  .icon-btn:hover{ transform:translateY(-2px) scale(1.05); }
  .icon-btn:active{ transform:translateY(0) scale(.96); }
  .icon-btn:focus-visible{ outline:3px solid var(--gold-500); outline-offset:3px; }
  .icon-btn svg{
    width:19px; height:19px;
    fill:none; stroke:var(--toggle-icon); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    position:absolute;
    transition:opacity .3s var(--ease), transform .4s var(--ease);
  }
  .header-back-btn svg{ position:static; stroke:var(--teal-700); }

  .icon-sun{opacity:1; transform:rotate(0deg) scale(1);}
  .icon-moon{opacity:0; transform:rotate(-70deg) scale(.5);}
  html[data-theme="dark"] .icon-sun{opacity:0; transform:rotate(70deg) scale(.5);}
  html[data-theme="dark"] .icon-moon{opacity:1; transform:rotate(0deg) scale(1);}

  .avatar-btn{
    width:40px; height:40px;
    border-radius:50%;
    padding:0;
    border:2px solid var(--toggle-border);
    box-shadow:var(--toggle-shadow);
    background:var(--toggle-bg);
    cursor:pointer;
    overflow:hidden;
    flex-shrink:0;
    transition:transform .2s var(--ease), border-color .3s var(--ease);
  }
  .avatar-btn:hover{ transform:translateY(-2px) scale(1.05); border-color:var(--gold-500); }
  .avatar-btn:active{ transform:translateY(0) scale(.96); }
  .avatar-btn:focus-visible{ outline:3px solid var(--gold-500); outline-offset:3px; }
  .avatar-btn img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- Search ---------- */
  .search-wrap{
    max-width:960px;
    margin:0 auto;
    position:relative;
  }
  .search-wrap svg{
    position:absolute;
    left:16px; top:50%; transform:translateY(-50%);
    width:18px; height:18px;
    stroke:var(--ink-500);
    fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    pointer-events:none;
    transition:stroke .3s var(--ease);
  }
  #search{
    width:100%;
    padding:13px 16px 13px 46px;
    border-radius:999px;
    border:1.5px solid var(--border-card);
    background:var(--white);
    color:var(--ink-900);
    font-family:'Manrope',sans-serif;
    font-size:.94rem;
    font-weight:500;
    outline:none;
    transition:border-color .25s var(--ease), box-shadow .25s var(--ease), background-color .3s var(--ease), color .3s var(--ease);
  }
  #search::placeholder{ color:var(--ink-500); font-weight:500; }
  #search:focus{
    border-color:var(--border-card-hover);
    box-shadow:0 0 0 4px var(--bg-tint-gold);
  }

  /* ---------- Main ---------- */
  main.dash{
    flex:1;
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:22px 18px calc(env(safe-area-inset-bottom) + 40px);
    display:flex;
    flex-direction:column;
    min-height:0;
    transition:max-width .3s var(--ease), padding .3s var(--ease);
  }

  /* When the in-page viewer is open, let it fill the entire available width/height â€”
     no max-width column, no padding â€” so the loaded page truly owns the viewport. */
  body.viewer-open main.dash{
    max-width:none;
    padding:0;
    margin:0;
  }

  .section-label{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--teal-700);
    margin:0 4px 14px;
    transition:color .3s var(--ease);
  }

  .tile-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  @media (max-width:760px){
    .tile-grid{ grid-template-columns:repeat(3,1fr); gap:12px; }
  }
  @media (max-width:480px){
    .tile-grid{ grid-template-columns:repeat(2,1fr); gap:10px; }
  }

  .tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    text-align:center;
    text-decoration:none;
    color:inherit;
    background:var(--white);
    border:1px solid var(--border-card);
    border-radius:var(--r-md);
    padding:18px 8px 14px;
    box-shadow:var(--shadow-card);
    cursor:pointer;
    opacity:0;
    animation:rise .55s var(--ease) forwards;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease), background-color .3s var(--ease);
  }
  .tile:hover, .tile:focus-visible{
    transform:translateY(-4px);
    box-shadow:var(--shadow-card-hover);
    border-color:var(--border-card-hover);
  }
  .tile:active{ transform:translateY(-1px) scale(.98); }
  .tile:focus-visible{ outline:3px solid var(--gold-500); outline-offset:3px; }

  .tile-icon{
    width:60px; height:60px;
    border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg,var(--teal-100),var(--white));
    transition:background .3s var(--ease), transform .3s var(--ease);
    overflow:visible;
  }
  .tile:hover .tile-icon{
    background:linear-gradient(150deg,var(--gold-100),var(--white));
    transform:scale(1.08) rotate(-4deg);
  }
  .tile-icon svg{ width:55px; height:55px; overflow:visible; }

  .tile-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:.84rem;
    line-height:1.25;
    color:var(--ink-900);
    transition:color .3s var(--ease);
  }

  .lock-badge{
    position:absolute;
    top:10px; right:10px;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--gold-500);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px -3px rgba(0,0,0,.4);
  }
  .lock-badge svg{ width:11px; height:11px; stroke:var(--teal-900); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .tile{ position:relative; }

  .empty-state{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:10px;
    padding:60px 20px;
    color:var(--ink-500);
  }
  .empty-state.show{ display:flex; }
  .empty-state svg{ width:40px; height:40px; stroke:var(--ink-500); fill:none; stroke-width:1.6; }
  .empty-state p{ margin:0; font-size:.92rem; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- Idle character animations ---------- */
  @keyframes idle-bob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-3px) rotate(-1.5deg); }
  }
  .bob{ animation:idle-bob 2.8s ease-in-out infinite; transform-origin:center; }
  @keyframes blink{
    0%,90%,100%{ transform:scaleY(1); }
    95%{ transform:scaleY(.1); }
  }
  .eye-blink{ animation:blink 4.2s ease-in-out infinite; transform-origin:center; }
  @keyframes sparkle{
    0%,100%{ opacity:.4; transform:scale(.7) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(20deg); }
  }
  .sparkle{ animation:sparkle 1.8s ease-in-out infinite; transform-origin:center; }
  @keyframes wiggle{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }
  .wiggle{ animation:wiggle 2.2s ease-in-out infinite; transform-origin:bottom center; }
  @media (prefers-reduced-motion: reduce){
    .tile{ animation:none; opacity:1; }
    .bob, .eye-blink, .sparkle, .wiggle{ animation:none; }
  }

  /* ---------- In-page iframe viewer ----------
     No bar, no card chrome â€” it blends flush into the available space.
     It is pinned with position:fixed from the header's live rendered
     height (--header-h, kept in sync by JS) down to the bottom of the
     viewport. This sidesteps the nested flex/min-height chain entirely,
     so the iframe always gets a fully definite height to fill â€” full
     width, full height below the header, no blank space, no exceptions. */
  .page-viewer{
    display:none;
    flex-direction:column;
    position:fixed;
    top:var(--header-h, 0px);
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    background:var(--cream);
    z-index:20;
  }
  .page-viewer.show{ display:flex; }
  .page-viewer-body{
    flex:1;
    min-height:0;
    width:100%;
    position:relative;
    background:var(--cream);
  }
  .page-viewer-body iframe{
    width:100%; height:100%;
    border:none;
    display:block;
  }
  .pv-loading{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--cream);
    transition:opacity .25s var(--ease), visibility .25s var(--ease);
  }
  .pv-loading.hidden{ opacity:0; visibility:hidden; }
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid var(--border-card);
    border-top-color:var(--gold-500);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Kid-friendly sign-in popup ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:100;
    background:rgba(9,34,39,.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; visibility:hidden;
    transition:opacity .25s var(--ease), visibility .25s var(--ease);
  }
  .modal-backdrop.show{ opacity:1; visibility:visible; }
  .modal-card{
    width:100%; max-width:360px;
    background:var(--cream);
    border-radius:28px;
    padding:26px 22px calc(env(safe-area-inset-bottom) + 22px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
    text-align:center;
    transform:translateY(16px) scale(.96);
    transition:transform .3s var(--ease);
  }
  .modal-backdrop.show .modal-card{ transform:translateY(0) scale(1); }
  .modal-icon{
    width:76px; height:76px;
    margin:0 auto 12px;
    border-radius:50%;
    background:linear-gradient(150deg,var(--gold-100),var(--white));
    display:flex; align-items:center; justify-content:center;
  }
  .modal-icon svg{ width:40px; height:40px; }
  .modal-card h3{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    margin:0 0 8px;
    color:var(--ink-900);
  }
  .modal-card p{
    margin:0 0 22px;
    color:var(--ink-500);
    font-size:.9rem;
    line-height:1.5;
  }
  .modal-actions{ display:flex; flex-direction:column; gap:10px; }
  .btn{
    padding:14px 16px;
    border-radius:16px;
    border:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:.92rem;
    cursor:pointer;
    transition:transform .2s var(--ease), opacity .2s var(--ease);
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--gold-500); color:var(--teal-900); }
  .btn-ghost{ background:var(--white); color:var(--ink-900); border:1.5px solid var(--border-card); }
  .modal-close{
    position:absolute;
    top:14px; right:14px;
    width:30px; height:30px;
    border-radius:50%;
    border:none;
    background:var(--white);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 14px -8px rgba(0,0,0,.3);
  }
  .modal-close svg{ width:13px; height:13px; stroke:var(--ink-500); fill:none; stroke-width:2.4; stroke-linecap:round; }
  .modal-card{ position:relative; }
</style>
</head>

<body>
<div id="app">
  <header class="app-header">
    <div class="app-header-top">
      <div class="header-brand">
        <button class="icon-btn header-back-btn" id="header-back" type="button" aria-label="Back to dashboard" title="Back to dashboard" style="display:none;">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <img src="https://educational-saas.github.io/gsms-logo.png" alt="GSMS crest" id="header-logo">
        <div class="header-text">
          <p class="header-greeting" id="greeting">Hello, Student</p>
          <p class="header-sub" id="header-sub">Student Dashboard</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.4M12 19.1v2.4M4.5 4.5l1.7 1.7M17.8 17.8l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.5 19.5l1.7-1.7M17.8 6.2l1.7-1.7"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>
          </svg>
        </button>
        <button class="avatar-btn" id="avatar-btn" type="button" aria-label="Your profile" title="Your profile">
          <img id="avatar-img" src="" alt="Your avatar">
        </button>
      </div>
    </div>

    <div class="search-wrap" id="search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Search tools..." autocomplete="off" aria-label="Search tools">
    </div>
  </header>

  <main class="dash">
    <p class="section-label" id="tools-label">Your Tools</p>
    <div class="tile-grid" id="tile-grid"><!-- tiles injected by JS --></div>

    <div class="empty-state" id="empty-state">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <p>No tools match your search.</p>
    </div>

    <!-- Reusable in-page viewer: internal tools & sign-in load here, blended into the dashboard.
         No inner header bar â€” the parent header shows the back button + tool name instead. -->
    <div class="page-viewer" id="page-viewer">
      <div class="page-viewer-body">
        <div class="pv-loading" id="pv-loading"><div class="spinner" role="status" aria-label="Loading"></div></div>
        <iframe id="pv-iframe" title="Tool content" scrolling="yes"></iframe>
      </div>
    </div>
  </main>

</div>

<!-- Kid-friendly sign-in popup -->
<div class="modal-backdrop" id="signin-modal">
  <div class="modal-card" role="dialog" aria-label="Please sign in">
    <button class="modal-close" id="modal-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </button>

<script>
  /* ==========================================================
     THEME
  ========================================================== */
  var themeToggleBtn = document.getElementById('theme-toggle');
  function currentTheme(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }

  themeToggleBtn.addEventListener('click', function(){
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('gsms-theme', next); }catch(e){}
    syncThemeToIframe();
  });

  /* Push the parent's theme onto a same-origin child iframe */
  function syncThemeToIframe(){
    var frame = document.getElementById('pv-iframe');
    if(!frame || !pvHasContent) return;
    try{
      var doc = frame.contentDocument || frame.contentWindow.document;
      if(doc && doc.documentElement){
        doc.documentElement.setAttribute('data-theme', currentTheme());
      }
    }catch(e){ /* cross-origin: nothing we can do, expected for external standalone tools */ }
  }

  /* Inject a thin, theme-matched scrollbar into a same-origin child document */
  function injectScrollbarStyle(doc){
    try{
      if(doc.getElementById('gsms-embedded-scrollbar')) return;
      var style = doc.createElement('style');
      style.id = 'gsms-embedded-scrollbar';
      style.textContent =
        '::-webkit-scrollbar{width:8px;height:8px;}' +
        '::-webkit-scrollbar-track{background:transparent;}' +
        '::-webkit-scrollbar-thumb{background:rgba(245,166,35,.55);border-radius:99px;}' +
        '::-webkit-scrollbar-thumb:hover{background:rgba(245,166,35,.8);}' +
        'html{scrollbar-width:thin;scrollbar-color:rgba(245,166,35,.55) transparent;}';
      doc.head.appendChild(style);
    }catch(e){ /* cross-origin: skip */ }
  }

  /* ==========================================================
     HEADER HEIGHT TRACKING
     Keeps --header-h (used by .page-viewer's `top`) glued to the
     header's real rendered height at all times, including the
     moment it changes (e.g. the search row disappearing when the
     viewer opens). This is what guarantees the viewer always fills
     exactly "all the space below the header" with a definite,
     non-ambiguous size â€” no more nested flex/min-height guessing.
  ========================================================== */
  var appHeaderEl = document.querySelector('.app-header');
  function updateHeaderHeightVar(){
    document.documentElement.style.setProperty('--header-h', appHeaderEl.offsetHeight + 'px');
  }
  if('ResizeObserver' in window){
    new ResizeObserver(updateHeaderHeightVar).observe(appHeaderEl);
  }else{
    window.addEventListener('resize', updateHeaderHeightVar);
  }
  updateHeaderHeightVar();

  /* ==========================================================
     REUSABLE PAGE-VIEWER (iframe loader for internal tools/pages)
     The viewer fills the full width of the page and the full height
     below the header. The parent header itself becomes the "bar":
     it shows a back button and swaps its small label for the tool
     name, so the loaded page never looks like a separate container.
  ========================================================== */
  var pageViewer   = document.getElementById('page-viewer');
  var pvIframe     = document.getElementById('pv-iframe');
  var pvLoading    = document.getElementById('pv-loading');
  var tileGrid     = document.getElementById('tile-grid');
  var toolsLabel   = document.getElementById('tools-label');
  var searchWrap   = document.getElementById('search-wrap');
  var mainDash     = document.querySelector('main.dash');

  var headerBackBtn = document.getElementById('header-back');
  var headerLogo     = document.getElementById('header-logo');
  var headerSub       = document.getElementById('header-sub');

  // The header's small label normally shows "who you are" (e.g. "Student
  // Dashboard" or "Class 5"). We remember that and temporarily swap it for
  // the loaded tool's name, restoring it when the viewer closes.
  var currentIdentityLabel = headerSub.textContent;
  function setIdentityLabel(text){
    currentIdentityLabel = text;
    if(!document.body.classList.contains('viewer-open')){
      headerSub.textContent = text;
    }
  }

  var pvHistoryPushed = false;

  // Tracks whether the shared viewer iframe currently holds real tool
  // content (true) or has been reset to about:blank (false). We use this
  // instead of inspecting `pvIframe.src`, because navigateIframe() below
  // moves the iframe via contentWindow.location.replace() rather than the
  // `.src` attribute â€” and `.src` does NOT reflect navigations done that
  // way, so any code checking it (theme sync, the load handler) would
  // silently stop working otherwise.
  var pvHasContent = false;

  // Navigate the shared viewer iframe WITHOUT adding a browser history
  // entry for that navigation. Assigning `.src` directly causes the iframe
  // to push its own entry into the browser's joint session history â€”
  // invisible to our own code, but very real to the back button. Left
  // unchecked, those hidden entries interleave with our single
  // history.pushState() entry below, so one press of "back" would
  // sometimes only unwind the iframe's own internal navigation (leaving a
  // blank/stale page sitting in the viewer) instead of closing it, and
  // other times unwind ours instead (correctly reaching the dashboard) â€”
  // exactly the inconsistency being fixed. location.replace() on the
  // iframe's own window swaps its document in place instead of adding a
  // new entry, so our single top-level pushState() stays the only entry
  // that represents "viewer open", and back always behaves the same way.
  function navigateIframe(url){
    pvHasContent = (url !== 'about:blank');
    try{
      if(pvIframe.contentWindow){
        pvIframe.contentWindow.location.replace(url);
        return;
      }
    }catch(e){ /* cross-origin: fall back to a normal (less clean) navigation */ }
    pvIframe.src = url;
  }

  // Generic, reusable handler for loading ANY page inside the dashboard.
  // Pass { name, url } â€” works for tool pages, the sign-in page, the profile page, etc.
  function loadPage(page){
    pvLoading.classList.remove('hidden');
    navigateIframe(page.url);

    tileGrid.style.display = 'none';
    toolsLabel.style.display = 'none';
    searchWrap.style.display = 'none';
    document.getElementById('empty-state').classList.remove('show');
    pageViewer.classList.add('show');

    document.body.classList.add('viewer-open');
    mainDash.classList.add('viewer-open');
    headerSub.textContent = page.name || 'Loadingâ€¦';
    headerBackBtn.style.display = 'flex';
    headerLogo.style.display = 'none';

    // Let the browser's own back button close the viewer too.
    if(!pvHistoryPushed){
      history.pushState({ gsmsViewer:true }, '', location.href);
      pvHistoryPushed = true;
    }
  }

  // Called when the viewer should actually close (shared by header-back click
  // and the browser's popstate event) â€” never pushes/pops history itself.
  function closePageInternal(){
    pageViewer.classList.remove('show');
    navigateIframe('about:blank');
    tileGrid.style.display = '';
    toolsLabel.style.display = '';
    searchWrap.style.display = '';

    document.body.classList.remove('viewer-open');
    mainDash.classList.remove('viewer-open');
    headerSub.textContent = currentIdentityLabel;
    headerBackBtn.style.display = 'none';
    headerLogo.style.display = '';
    pvHistoryPushed = false;

    renderTiles(filterTools(document.getElementById('search').value));
  }

  // User-initiated close (tap on the header back button): go through the
  // history entry we pushed so the browser's back button stays in sync.
  function closePage(){
    if(pvHistoryPushed){
      history.back();
    } else {
      closePageInternal();
    }
  }

  window.addEventListener('popstate', function(){
    if(document.body.classList.contains('viewer-open')){
      closePageInternal();
    }
  });

  headerBackBtn.addEventListener('click', closePage);

  pvIframe.addEventListener('load', function(){
    pvLoading.classList.add('hidden');
    if(pvHasContent){
      try{
        var doc = pvIframe.contentDocument || pvIframe.contentWindow.document;
        doc.documentElement.setAttribute('data-theme', currentTheme());
        injectScrollbarStyle(doc);
      }catch(e){ /* cross-origin child: theme/scrollbar sync not possible, that's fine */ }
    }
  });

  /* Open a tool the "standalone" way â€” a real new tab, not inside our dashboard */
  function openStandalone(tool){
    window.open(tool.url, '_blank', 'noopener');
  }

    signinModal.classList.add('show');
  }
  function closeSigninModal(){
    signinModal.classList.remove('show');
    pendingTool = null;
  }
  document.getElementById('modal-close').addEventListener('click', closeSigninModal);
  document.getElementById('signin-later').addEventListener('click', closeSigninModal);
  document.getElementById('signin-now').addEventListener('click', function(){
    signinModal.classList.remove('show');
    loadPage(SIGNIN_PAGE);
    pendingTool = null;
  });
  signinModal.addEventListener('click', function(e){
    if(e.target === signinModal) closeSigninModal();
  });

    name: null,
    gender: null

  var AVATAR_MALE   = 'https://avataaars.io/?avatarStyle=Circle&topType=ShortHairShortCurly&accessoriesType=Blank&hairColor=BrownDark&facialHairType=Blank&clotheType=BlazerSweater&eyeType=Happy&eyebrowType=Default&mouthType=Smile&skinColor=Light';
  var AVATAR_FEMALE = 'https://avataaars.io/?avatarStyle=Circle&topType=LongHairStraight2&hairColor=BrownDark&clotheType=BlazerSweater&eyeType=Happy&mouthType=Smile&skinColor=Light&facialHairType=Blank&accessoriesType=Blank';

  function updateAvatar(){
    document.getElementById('avatar-img').src = (state.gender === 'F') ? AVATAR_FEMALE : AVATAR_MALE;
  }
  updateAvatar();

  document.getElementById('avatar-btn').addEventListener('click', function(){
    if(!state.isStudent){
      openSigninModal({ name: 'Profile' });
      return;
    }
    loadPage({ name: 'My Profile', url: 'https://educational-saas.github.io/students/profile/' });
  });

  /* ==========================================================
     RENDER TILES
  ========================================================== */
  var grid = document.getElementById('tile-grid');
  var emptyState = document.getElementById('empty-state');

  function filterTools(query){
    var q = (query || '').trim().toLowerCase();
    if(!q) return TOOLS;
    return TOOLS.filter(function(t){ return t.name.toLowerCase().indexOf(q) !== -1; });
  }

  function renderTiles(list){
    grid.innerHTML = '';
    list.forEach(function(tool, i){
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'tile';
      el.style.animationDelay = (i * 0.04) + 's';
      el.setAttribute('aria-label', tool.name);
      el.innerHTML =
        (tool.restricted && !state.isStudent ?
          '<span class="lock-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>' : '') +
        '<span class="tile-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 64 64">' + tool.icon + '</svg>' +
        '</span>' +
        '<span class="tile-name">' + tool.name + '</span>';
      el.addEventListener('click', function(){ handleToolClick(tool); });
      grid.appendChild(el);
    });
    emptyState.classList.toggle('show', list.length === 0);
    grid.style.display = list.length === 0 ? 'none' : 'grid';
  }

  function handleToolClick(tool){
    if(tool.restricted && !state.isStudent){
      openSigninModal(tool);
      return;
    }
    if(tool.standalone){
      openStandalone(tool);
      return;
    }
    loadPage(tool);
  }

  document.getElementById('search').addEventListener('input', function(e){
    renderTiles(filterTools(e.target.value));
  });

  // Render immediately â€” the dashboard is open to everyone.
  renderTiles(TOOLS);

  /* ==========================================================
     SUPABASE â€” background auth check (does not block the page)
  ========================================================== */
  var SUPABASE_URL, SUPABASE_ANON_KEY;
  (function(){
    var institutionId = localStorage.getItem('gsms_last_institution_id');
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem('cp_institution_' + institutionId)); } catch(e) {}

    if (!cached || !cached.data || !cached.data.supabase_url || !cached.data.supabase_anon_key) {
      window.location.href = 'https://educational-saas.github.io/'; // no credentials on record — back to login
      throw new Error('Redirecting to sign-in.');
    }
    SUPABASE_URL = cached.data.supabase_url;
    SUPABASE_ANON_KEY = cached.data.supabase_anon_key;
  })();

  async function wipeInstitutionData(){
    try{
      const { clearInstitutionCache } = await import('https://educational-saas.github.io/commons/control-plane.js');
      clearInstitutionCache(); // wipes every cached cp_institution_* entry on this device
    }catch(e){ /* ignore — nothing to clean up if this fails */ }
    localStorage.removeItem('gsms_last_institution_id');
  }

var AUTH_REDIRECT = 'https://educational-saas.github.io/';

  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  (async function initAuth(){
    try{
      var sessionResult = await supabaseClient.auth.getSession();
      var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
      if(!session || !session.user){
        return; // guest tiles already shown, restricted ones will prompt sign-in
      }

      var studentCheck = await supabaseClient.rpc('is_student');
      if(studentCheck.error || studentCheck.data !== true){
        return; // logged in, but not with a student account
      }

      var profileResult = await supabaseClient
        .from('students')
        .select('name, gender, class')
        .eq('id', session.user.id)
        .maybeSingle();

      if(profileResult.error || !profileResult.data){
        return;
      }

      state.isStudent = true;
      state.name = profileResult.data.name;
      state.gender = profileResult.data.gender;

      document.getElementById('greeting').textContent = 'Hi, ' + state.name.split(' ')[0] + '!';
      setIdentityLabel('Class ' + profileResult.data.class);
      updateAvatar();
      renderTiles(filterTools(document.getElementById('search').value));
    }catch(err){
      console.error('Auth check failed:', err);
    }
  })();
</script>
